[project]
name = "crucible-v2"
version = "2.0.0a1"
description = "CRUCIBLE v2 — autonomous, learning offensive-intelligence platform layered onto v1"
requires-python = ">=3.11"
authors = [{name = "OBSIDIAN-FORGE"}]
license = {text = "Operator-internal — see CLAUDE.md"}
readme = "README.md"

dependencies = [
  "pydantic>=2.10,<3",
  "structlog>=25.0,<26",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
anthropic   = ["anthropic>=0.40,<1"]
embeddings  = ["sentence-transformers>=2,<6"]
analysis    = ["semgrep>=1.100"]   # DAA real taint/dataflow analysis
dev         = ["pytest>=8,<11", "mypy>=1.10,<2"]

[tool.mypy]
python_version            = "3.11"
strict_optional           = true
no_implicit_optional      = true
disallow_untyped_defs     = true
ignore_missing_imports    = true
# Relaxed: sqlite3.Row indexing trips warn_return_any unhelpfully, and
# cross-platform conditional imports leave the occasional dead # type: ignore.
warn_return_any           = false
warn_unused_ignores       = false
exclude                   = ['/tests/']

[tool.pytest.ini_options]
testpaths        = [
  "common/tests",
  "kernel/tests",
  "memory/tests",
  "intake/tests",
  "agents/tests",
  "planner/tests",
  "entitlement/tests",
  "eval/tests",
  "improve/tests",
  "defender/tests",
  "analysis/tests",
  "authority/tests",
  "socialdefense/tests",
]
python_files     = ["test_*.py"]
python_functions = ["test_*"]
addopts          = "-q -ra"
