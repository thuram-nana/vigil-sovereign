[package]
name = "sigil-kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "sigil_kernel"
path = "src/lib.rs"

[[bin]]
name = "sigil-kernel"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
