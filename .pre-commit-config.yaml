# VIGIL pre-commit configuration (W2-5, #422).
#
# Every hook here ALSO runs on the pull request in .github/workflows/pre-commit.yml, so a local
# `git commit --no-verify` cannot bypass the gate — the same checks re-run in CI where they cannot be
# skipped. Hooks are SCOPED so `pre-commit run --all-files` is GREEN on the current tree; the scopes
# widen as W2-2 (#419 — ruff/mypy for every package) and W0-3 (#398 — the claims registry) land.
#
# Third-party hook repos are pinned to an immutable release TAG; the exact commit SHA that tag points
# at on 2026-08-18 is recorded in the comment beside each `rev:` so a moved tag is detectable by eye.
minimum_pre_commit_version: "3.5.0"

# Vendored third-party trees are never linted here (they carry their own upstream style/history).
exclude: '^vendor/'

repos:
  # ------------------------------------------------------------------------------------------------
  # Hygiene: trailing whitespace, final newline, YAML parse-validity.
  #
  # trailing-whitespace / end-of-file-fixer are `types: [text]` (binaries are skipped by pre-commit).
  # They are scoped AWAY from the narrative / imported directories that carry pre-existing whitespace
  # and newline debt (knowledge/, several docs/ subtrees, and the imported engine/crucible tree) so the
  # gate is green today over the actively-developed code. That exclude list shrinks as those files are
  # cleaned; it is deliberately a denylist of known-dirty roots, not the whole repo.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # commit cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b
    hooks:
      # docs/strix-patches/ is EXCLUDED below: it is a generated, digest-pinned artifact, not source.
      # series.json records each patch's sha256 and integration/tests/test_strix_patch_series.py
      # verifies it, so any reformatting — even a harmless one — invalidates the record and fails
      # that guard. A patch is a record of BYTES: git apply tolerates stripped trailing whitespace
      # today (no added line currently carries any), but silently rewriting one would make the
      # series misrepresent the commit it claims to reproduce.
      - id: trailing-whitespace
        exclude: '^(engine/crucible/|knowledge/claude-memory/|docs/knowledge/|docs/research/|docs/plain-english/|docs/architecture/|docs/assessments/|docs/strix-patches/)'
      - id: end-of-file-fixer
        exclude: '^(engine/crucible/|knowledge/claude-memory/|docs/knowledge/|docs/research/|docs/plain-english/|docs/architecture/|docs/assessments/|docs/strix-patches/)'
      - id: check-yaml
        # A YAML file that no longer parses is how a workflow or compose file silently stops working.
        # --allow-multiple-documents: the infra/ha/k8s manifests are legitimately multi-document (`---`).
        args: ["--allow-multiple-documents"]

  # ------------------------------------------------------------------------------------------------
  # ruff — blocks on real bug classes (E9/F/B). Same scope and config the `sigil-lint` CI job blocks
  # on today; `--force-exclude` (built into this hook's entry) honours the config's exclude even when
  # pre-commit passes explicit file paths.
  # ------------------------------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12  # commit 6fec9b7edb08fd9989088709d864a7826dc74e80
    hooks:
      - id: ruff
        name: ruff (E9/F/B — SIGIL scope)
        args: ["--config", "apps/sigil/pyproject.toml"]
        files: '^apps/sigil/sigil/.*\.py$'

  # ------------------------------------------------------------------------------------------------
  # gitleaks — secret scanning. Reads .gitleaks.toml (upstream default ruleset + an AUDITED allowlist
  # of synthetic test/fixture material). A real secret committed to shipped source or config fails.
  # ------------------------------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0  # aligned with security-scan.yml + the full-tree scan; 8.28.0 honours .gitleaks.toml [[allowlists]] path scoping (8.21.2 did not)
    hooks:
      - id: gitleaks

  # ------------------------------------------------------------------------------------------------
  # Local, repo-specific gates. They run system tools / repo scripts, installed dev-side per
  # CONTRIBUTING.md and in the pre-commit CI job.
  # ------------------------------------------------------------------------------------------------
  - repo: local
    hooks:
      # mypy fast subset — the SIGIL package, as a CAN-COMPLETE gate (exit 2 = a parse/type-comment/
      # config abort fails; pre-existing type-error debt does not). Mirrors the sigil-lint CI job.
      - id: mypy-sigil-can-complete
        name: mypy (fast subset — SIGIL can-complete gate)
        entry: tools/governance/mypy_can_complete.sh
        language: script
        pass_filenames: false
        files: '^apps/sigil/sigil/.*\.py$'
        require_serial: true

      # workflow-lint — yamllint over the GitHub Actions workflows with a config that errors only on
      # structural problems (syntax, duplicate keys) and stays quiet on cosmetics.
      - id: workflow-lint
        name: workflow-lint (yamllint over .github/workflows)
        entry: yamllint -c .github/yamllint-workflows.yaml
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'

      # claims / doc-truth — the shipped doc-truth checks (every declared gate/capability is explained
      # to a reader and not described as missing). The full doc-truth suite is a required CI job
      # (briefing-completeness: `pytest docs/tests -q`); this fast subset runs pre-commit-side too. The
      # claims registry proper (W0-3 / #398) plugs in here when it lands.
      - id: claims-doc-truth
        name: claims / doc-truth (docs are true of the code)
        entry: python3 -m pytest -q docs/tests/test_shipped_gates_not_described_as_missing.py docs/tests/test_briefing_completeness.py
        language: system
        pass_filenames: false
        files: '(^docs/|^README\.md$|^\.github/workflows/|^docs/capability-matrix/)'
