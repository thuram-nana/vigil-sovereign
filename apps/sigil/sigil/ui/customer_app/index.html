<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <!-- the browser chrome takes the app background (tokens.css --bg-0, dark and light) -->
  <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
  <title>VIGIL</title>
  <!-- installable app (PWA): the manifest and the owner's icons. The iOS home-screen tags go in the slot below
       only when the edge's iOS install flag is on (off until the owner's sign-in test on a real iPhone). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="brand/favicon.ico" sizes="any" />
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!--__VIGIL_IOS_TAGS__-->
  <!-- Self-contained + strict-CSP. The CSP / nosniff / no-referrer headers are set by the edge as RESPONSE
       HEADERS (never a <meta>). Asset refs are RELATIVE (no leading slash) so they resolve against the mount
       in dev (served under /customer/) and in prod (served at / on the separate customer origin). No CDN, no
       inline script, no embedded token — the customer plane authenticates by the vigil_customer_session
       cookie, so there is zero secret in the page. -->
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<!-- Config via CSP-safe data-* attributes (read by the external app.js at boot — no inline script). -->
<body data-plane="customer" data-build="__VIGIL_BUILD__" data-ios-install="__VIGIL_IOS_INSTALL__"
      data-google-signin="__VIGIL_GOOGLE_SIGNIN__" data-oidc-handoff="__VIGIL_OIDC_HANDOFF__"
      data-onboarding="__VIGIL_ONBOARDING__" data-team="__VIGIL_TEAM__">
  <noscript>VIGIL requires JavaScript. It talks only to this site (no external calls).</noscript>
  <div id="app" aria-live="polite"></div>
  <script src="ui.js"></script>
  <script src="pwa.js"></script>
  <script src="guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
