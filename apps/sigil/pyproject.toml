# SIGIL — a local-first, offense-free personal AI orchestrator.
# PEP 621 metadata. Classic setuptools backend (do NOT require bleeding-edge setuptools — stock LTS ships
# an older version, and PEP 639 SPDX license expressions need >=77).
# setuptools-rust compiles the WARDEN kernel (a Rust binary) at build time and ships it inside the wheel,
# so `pip install sigil` yields a working fail-closed authorizer with no separate `cargo build` step.
# Building from source therefore requires a Rust toolchain (rustc/cargo) — expected for this repo, which
# already carries the kernel crate. See [[tool.setuptools-rust.bins]] below.
[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil"
description = "A local-first, offense-free sovereign personal AI orchestrator (WARDEN kernel, signed memory spine, gated agent mesh)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0 OR Commercial" }  # see repo-root LICENSE + LICENSE-COMMERCIAL.md
authors = [{ name = "SIGIL" }]
keywords = ["ai", "assistant", "local-first", "agents", "personal", "sovereign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]
dynamic = ["version"]

# Core runtime dependencies — the memory loop, the MCP server, and the always-imported paths.
# `numpy` is a genuine top-level import (sigil/voice/backends.py) and MUST be declared, not relied on
# transitively via fastembed/onnxruntime.
dependencies = [
    "cryptography==50.0.1",
    "fastembed==0.8.0",
    "kuzu==0.11.3",
    "mcp==1.28.1",
    "numpy>=1.26,<3",
    "onnxruntime==1.29.0",
    "pydantic==2.13.4",
    "PyYAML>=6",                  # structural kubeconfig safety gate (refuse exec/cmd-path plugins)
    "qdrant-client==1.19.0",
]

# Optional stacks are lazy-imported and degrade gracefully; the extras make the install intentional
# instead of trial-and-error. `pip install "sigil[voice]"` etc.
[project.optional-dependencies]
voice = ["sounddevice", "faster-whisper", "openwakeword", "piper-tts"]
secrets = ["keyring"]
capture = ["mss"]                 # cross-platform screen capture (macOS/Windows backends)
dev = ["pytest>=9.1.1", "ruff>=0.16.3", "mypy>=2.3.1"]
all = ["sounddevice", "faster-whisper", "openwakeword", "piper-tts", "keyring", "mss"]

# The `sigil` console command + `python -m sigil` both resolve to the CLI.
[project.scripts]
sigil = "sigil.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sigil.__version__" }

[tool.setuptools.packages.find]
include = ["sigil*"]

# The WARDEN kernel: build the Rust binary from kernel/Cargo.toml and install it into the environment's
# script dir (next to the `sigil` console script), where `config.kernel_bin()` resolves it. A wheel build
# compiles in release profile by default (no explicit --release — setuptools-rust adds it, and passing it
# twice makes cargo error). `strip = "Debug"` keeps the shipped binary lean.
[[tool.setuptools-rust.bins]]
target = "sigil-kernel"
path = "kernel/Cargo.toml"
strip = "Debug"

# ── quality gates ──────────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["sigil/bridge/webapp"]   # vendored/static front-end assets

[tool.ruff.lint]
# W2-2 (#419): the rule set is WIDER than the historical `E9,F,B` entry gate — it now also blocks the
# real-bug families flake8-comprehensions (C4), flake8-pie (PIE), the Pylint error subset (PLE, incl.
# Trojan-Source / bidirectional-unicode PLE2502), implicit-string-concat missing-comma bugs (ISC),
# static-join (FLY), leftover-debugger (T10) and __slots__ correctness (SLOT). Still NOT stylistic
# modernization (UP), import ordering (I), or whitespace (E/W). Style-only sub-codes are deferred in
# `ignore` and are burned down + tightened by the W2-1 ratchet (#418). Tests are LINTED, not excluded.
select = ["E9", "F", "B", "C4", "PIE", "PLE", "ISC", "FLY", "T10", "SLOT"]
ignore = [
    "B008",   # function call in an argument default — used deliberately for injectable defaults
    "B011",   # assert False — used intentionally in tests/guards
    "B904",   # raise ... from — style; tighten later (kept selected so B still catches real bug rules)
    "B905",   # zip(strict=) — safety nudge; tighten later
    "B007",   # unused loop control variable — style; tighten later
    # Comprehension micro-simplifications — style, not a bug class; tighten via the W2-1 ratchet:
    "C401", "C408", "C416", "C419", "C420",
    "PIE810",            # combine startswith/endswith — style
    "FLY002",            # static join -> f-string — style
    "ISC002", "ISC003",  # multi-line / explicit string concatenation — formatter-adjacent style
]

[tool.ruff.lint.per-file-ignores]
# tests: late imports, unused re-exports/intermediates, assert False, pytest.raises(Exception):
"tests/*"     = ["E402", "F401", "F841", "B011", "B015", "B017"]
"tests/**"    = ["E402", "F401", "F841", "B011", "B015", "B017"]
"**/tests/**" = ["E402", "F401", "F841", "B011", "B015", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
# Pragmatic entry posture for a large, dynamically-typed codebase: check what's annotated, don't block
# on the untyped majority. Tighten module-by-module over time.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
# W2-2 (#419): tests are IN SCOPE (no longer excluded); only the vendored web assets stay out. The
# existing `sigil-lint` CI job still runs `mypy sigil` (source dir) — that invocation is unaffected.
exclude = ["sigil/bridge/webapp"]
