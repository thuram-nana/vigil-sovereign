# VIGIL PAYMENT WEBHOOKS — nginx vhost for the dedicated webhook host (hooks.vigilguard.net), behind Cloudflare
# =================================================================================================================
# Stripe (and Flutterwave, while that adapter is in use) must reach the payment webhook routes of the `vigil up`
# proxy (127.0.0.1:8770), but the operator console that proxy also serves stays private: no public `console`
# record, never Cloudflare (docs/runbooks/AWS-DEPLOY.md §topology). So the webhooks get their OWN public host,
# proxied by Cloudflare like the public site, and this vhost forwards EXACTLY two requests to the proxy:
#
#     POST /webhooks/stripe   → 127.0.0.1:8770/webhooks/stripe   (Stripe: https://hooks.vigilguard.net/webhooks/stripe)
#     POST /webhooks/billing  → 127.0.0.1:8770/webhooks/billing  (Flutterwave, when the proxy mounts it)
#
# Everything else is 404 from nginx itself: every other path, every other method on these two paths, and any raw
# request line that only NORMALISES onto them. No console page, API or plane-control path is reachable here.
#
# WHY IT IS SAFE TO ACCEPT THESE FROM ANYONE: the body is untrusted and never credits an account.
#   * The proxy verifies `Stripe-Signature` (HMAC-SHA256 over the raw body with the endpoint's signing secret,
#     300 s tolerance) and refuses anything else before it writes a byte; it only spools the delivery as an inert
#     file (integration/vigil_integration/uiproxy.py `_webhooks_stripe`). The webhook routes sit in the proxy's
#     probe-safe band, ahead of its Host/Origin gate and its routing, so they answer with Host hooks.vigilguard.net
#     and nothing else does.
#   * The billing drain re-verifies the same signature, then RE-FETCHES every Checkout Session / Invoice /
#     Subscription from Stripe with the restricted API key; only those fetched objects, mapped through the owner
#     catalog, can mint.
#   * `/webhooks/billing` (Flutterwave) has the same shape: a constant-time `verif-hash` check at the proxy, then a
#     server-side transaction re-verify in the drain before any mint.
#
# EXACT PATH ONLY. `location =` matches the NORMALISED path, but `proxy_pass` would forward the raw one: without the
# `$request_uri` check, `/webhooks/x/../stripe`, `/webhooks//stripe`, `/webhooks/%73tripe` — or a console path such
# as `/sovereign/api/x/../../../webhooks/stripe` — would match here and reach the proxy in raw form. The fixed URI on
# `proxy_pass` sends exactly the webhook path. `Stripe-Signature` (like every client header) passes through
# unchanged. Bodies are capped at 1 MB here; the proxy itself refuses more than 128 KiB.
#
# 1) DNS (Cloudflare): a PROXIED (orange-cloud) `hooks` record to the Elastic IP; cache rule = Bypass for
#    hooks.vigilguard.net (AWS-DEPLOY.md §3). The security group stays Cloudflare-only.
# 2) Cert for the Cloudflare→origin hop (SSL mode Full (Strict)): Let's Encrypt
#    (`certbot certonly --nginx -d hooks.vigilguard.net`) or a Cloudflare Origin CA cert.
# 3) Install this file (edit server_name + cert paths), then: nginx -t && systemctl reload nginx
# 4) The proxy mounts the routes only with VIGIL_STRIPE_WEBHOOK_SPOOL + VIGIL_STRIPE_WEBHOOK_SECRET set
#    (GO-LIVE-quickstart.md §9b); unmounted, the proxy answers 404 and spools nothing.

server {
    listen 80;
    listen [::]:80;
    server_name hooks.vigilguard.net;
    # redirect to the literal host (not $host) so this block can't reflect an attacker-set Host.
    return 301 https://hooks.vigilguard.net$request_uri;   # force TLS (Stripe only ever calls https)
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.vigilguard.net;

    ssl_certificate     /etc/letsencrypt/live/hooks.vigilguard.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.vigilguard.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Cloudflare edge: restore the real client IP (the same ranges as vigil-public.nginx.conf; refresh both) ---
    # Trust CF-Connecting-IP ONLY from Cloudflare's published ranges, so a caller who reaches the origin directly
    # can never spoof it. This fixes the logged/forwarded client IP; the origin lock is the security group
    # (Cloudflare-only) + per-zone Authenticated Origin Pulls below.
    set_real_ip_from 173.245.48.0/20;     # Cloudflare IPv4 (https://www.cloudflare.com/ips-v4)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;      # Cloudflare IPv6 (https://www.cloudflare.com/ips-v6)
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;      # the single header Cloudflare sets to the true visitor IP

    # One host only, even if this block ever becomes the default server for 443.
    if ($host != "hooks.vigilguard.net") { return 421; }

    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Per-zone Authenticated Origin Pulls (AWS-DEPLOY.md §3 item 4a) — as on the public vhost ---------------
    # Uncomment once YOUR zone's origin-pull certificate is installed (left commented so `nginx -t` passes first).
    # ssl_client_certificate /etc/ssl/cloudflare/vigilguard-origin-pull.pem;   # YOUR zone's cert, not the shared CA
    # ssl_verify_client on;

    client_max_body_size 1m;

    location = /webhooks/stripe {
        if ($request_uri != "/webhooks/stripe") { return 404; }      # the RAW request line, byte-exact (see above)
        if ($request_method != POST) { return 404; }      # POST only
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8770/webhooks/stripe;   # fixed URI: exactly this path upstream
        proxy_set_header Host $host;                       # unchanged; the webhook routes are Host-ungated
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location = /webhooks/billing {
        if ($request_uri != "/webhooks/billing") { return 404; }      # the RAW request line, byte-exact (see above)
        if ($request_method != POST) { return 404; }      # POST only
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8770/webhooks/billing;   # fixed URI: exactly this path upstream
        proxy_set_header Host $host;                       # unchanged; the webhook routes are Host-ungated
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Everything else on this host: nothing here.
    location / {
        return 404;
    }
}
