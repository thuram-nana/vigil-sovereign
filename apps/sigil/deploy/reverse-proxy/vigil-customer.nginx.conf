# VIGIL CUSTOMER APP — nginx reverse proxy for the keyless tenant edge (custui), TLS via certbot
# =========================================================================================================
# `sigil serve-customer` serves the self-serve CUSTOMER app (`custui`) at 127.0.0.1:8734: signup/login,
# billing/invoices, authorized-asset ownership proof, and the tenant's oracle-confirmed assessment findings.
# That listener is NOT public — it binds loopback (or a private/tunnel IP) and FAILS CLOSED on a public bind.
# This nginx site is the only thing on a public port: it terminates TLS for the customer domain and forwards
# to custui over loopback.
#
# This is a SEPARATE ORIGIN from the operator cockpit (vigil.nginx.conf → the `vigil up` proxy on :8770) and
# the public marketing site (vigil-public.nginx.conf → pubui on :8735). Strongest cookie + CSRF isolation:
# the tenant app lives on its own hostname, so its `vigil_customer_session` cookie can never ride an operator
# or marketing request and vice-versa.
#
#   PRODUCTION ORIGIN TOPOLOGY (edit the hostnames to your own):
#     vigilguard.net         → vigil-public.nginx.conf → pubui   127.0.0.1:8735  (public marketing)
#     console.vigilguard.net → vigil.nginx.conf         → vigil up 127.0.0.1:8770 (operator cockpit; private)
#     app.vigilguard.net     → THIS file                → custui  127.0.0.1:8734  (tenant app)
#
# UNLIKE the public site, custui SETS A SESSION COOKIE and enforces an anti-CSRF / anti-DNS-rebinding gate on
# every POST (exact Host + Origin/Referer allowlist). So TWO things must line up or the app fails closed:
#   1) This vhost must forward the REAL Host and the browser Origin unchanged (done below).
#   2) custui's allowlist must contain the public host + origin. Start it with (or set in the env file):
#        sigil serve-customer --host 127.0.0.1 --port 8734 \
#          --allow-host app.vigilguard.net --allow-origin https://app.vigilguard.net
#      (equivalently $VIGIL_CUSTOMER_ALLOWED_HOSTS / $VIGIL_CUSTOMER_ALLOWED_ORIGINS — see
#       deploy/systemd/sigil-customer.service + deploy/customer.env.example). The edge also needs
#       $VIGIL_PROVISION_HOP_KEY to reach the sovereign provisioner over loopback (empty ⇒ signup/login fail
#       CLOSED). The edge holds NO owner key; the one key-holding process is the sovereign provisioner.
#
# In PRODUCTION the SPA is served at this origin's ROOT ("/"), so its relative asset/API refs resolve
# directly — the /customer same-origin mount (and its trailing-slash 301) is a DEV-only convenience on the
# `vigil up` proxy, not used here. custui already sets its own strict CSP ('self'; object-src none; img-src
# self data:) + nosniff + no-referrer + DENY-framing on every response; this edge only terminates TLS and
# adds HSTS. The app is hash-routed (no deep server routes) + fetch/JSON only (no Server-Sent Events), so no
# history-fallback or no-buffering locations are needed.
#
# 1) Start the edge (loopback; front it here): sigil serve-customer --host 127.0.0.1 --port 8734 \
#      --allow-host app.vigilguard.net --allow-origin https://app.vigilguard.net
# 2) Obtain a cert:  certbot certonly --nginx -d app.vigilguard.net
# 3) Install this file (edit server_name + cert paths), then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.vigilguard.net;
    # redirect to the literal canonical host (not $host) so this block can't reflect an attacker-set Host.
    return 301 https://app.vigilguard.net$request_uri;   # force TLS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.vigilguard.net;

    ssl_certificate     /etc/letsencrypt/live/app.vigilguard.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vigilguard.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # This tenant origin owns only itself; it does NOT assert includeSubDomains (the cockpit / marketing are
    # SEPARATE origins with their own — sometimes internal-CA — certs). Each origin owns its own HSTS policy.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Cloudflare edge (the production front door; see docs/runbooks/AWS-DEPLOY.md) -------------------
    # When Cloudflare proxies this origin (orange-cloud), the peer nginx sees is a Cloudflare edge IP, not the
    # visitor — and the edge's per-IP limits (login / sign-up throttles, the opt-in per-IP trial-grant limit)
    # would count EVERY visitor behind one Cloudflare IP as one client. Restore the REAL client IP from
    # CF-Connecting-IP, trusting that header ONLY from Cloudflare's published ranges (a caller reaching the
    # origin directly cannot spoof it; without Cloudflare no request comes from these ranges and $remote_addr
    # is unchanged). KEEP THIS LIST IDENTICAL to vigil-public.nginx.conf (a test pins it) and refresh both from
    # https://www.cloudflare.com/ips when it changes.
    set_real_ip_from 173.245.48.0/20;     # Cloudflare IPv4 (https://www.cloudflare.com/ips-v4)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;      # Cloudflare IPv6 (https://www.cloudflare.com/ips-v6)
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;      # the single header Cloudflare sets to the true visitor IP

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml
               application/manifest+json font/woff2;

    location / {
        proxy_pass http://127.0.0.1:8734;
        # The edge's anti-rebind gate matches on Host, and its CSRF gate matches on Origin/Referer — forward
        # both UNCHANGED (never rewrite them), and the real client IP for the edge's best-effort per-IP limiter.
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
