# The customer edge's upstream servers (included by vigil-customer.nginx.conf). Installed as
# /etc/nginx/vigil/customer-upstream.conf, owned by the user the edges run as: tools/deploy/edge-swap.sh rewrites it
# (the new port first) and reloads nginx before it stops the old edge. This is its resting content.
server 127.0.0.1:8734 max_fails=0;
server 127.0.0.1:8744 backup max_fails=0;
