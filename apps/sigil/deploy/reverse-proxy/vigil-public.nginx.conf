# VIGIL PUBLIC SITE — nginx reverse proxy for the keyless marketing/tools/trust/CVE site (TLS via certbot)
# =========================================================================================================
# `sigil serve-public` serves the PUBLIC site (`pubui`) at 127.0.0.1:8735: the landing page, the compare
# (/vs) pages, the tools hub + CVSS calculator, the trust center, support/privacy/cookies/careers/blog, and
# the read-only CVE browser (/cve + a read-only /api/cve over the local catalog). That listener is NOT public
# — it binds loopback (or a private/tunnel IP) and FAILS CLOSED on a public bind. This nginx site is the only
# thing on a public port: it terminates TLS for your PUBLIC domain and forwards to pubui over loopback.
#
# This is a SEPARATE ORIGIN from the operator cockpit (vigil.nginx.conf → the `vigil up` proxy on :8770) and
# from the customer app (custui on :8734). Nothing on this origin holds a key or sets a cookie — the public
# site is keyless and cookieless by construction — so there is no session here to protect and no shared-origin
# bleed to worry about. Keeping it on its own hostname is still the right production layout:
#
#   PRODUCTION ORIGIN TOPOLOGY (edit the hostnames to your own):
#     vigilguard.net         → THIS file          → pubui   127.0.0.1:8735   (public: everyone can see)
#     console.vigilguard.net → vigil.nginx.conf    → vigil up 127.0.0.1:8770  (operator cockpit; keep private
#                                                        or behind SSO/VPN — it is NOT a public face)
#     app.vigilguard.net     → the customer edge    → custui  127.0.0.1:8734  (tenant app; its own vhost — J2)
#
# 1) Start the public site (loopback; front it here):
#      sigil serve-public --host 127.0.0.1 --port 8735
#    (optionally populate the CVE catalog first:  sigil cve ingest  — the one standing outbound path, never
#     at page-request time.)
# 2) Obtain a cert:  certbot certonly --nginx -d vigilguard.net -d www.vigilguard.net
#    Behind Cloudflare (the production front door — docs/runbooks/AWS-DEPLOY.md): set the Cloudflare SSL mode
#    to Full (Strict) and this Let's Encrypt cert (or a Cloudflare Origin CA cert) secures the Cloudflare→
#    origin hop; Cloudflare terminates the visitor's TLS at its edge and re-encrypts to this origin.
# 3) Install this file (edit server_name + cert paths), then: nginx -t && systemctl reload nginx
#
# pubui already sets its own strict response headers (Content-Security-Policy 'self', X-Content-Type-Options
# nosniff, Referrer-Policy no-referrer, X-Frame-Options DENY) and Cache-Control on every response; this edge
# only terminates TLS and adds HSTS. There are no Server-Sent Events on this plane (static + read-only JSON,
# GET/HEAD only), so no streaming/no-buffering locations are needed.

server {
    listen 80;
    listen [::]:80;
    server_name vigilguard.net www.vigilguard.net;
    # redirect to the literal canonical host (not $host) so this block can't reflect an attacker-set Host.
    return 301 https://vigilguard.net$request_uri;   # force TLS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vigilguard.net;
    # Every `listen … ssl` server block needs its OWN certificate available at config-load time — even one
    # that only redirects — or `nginx -t` aborts with: no "ssl_certificate" is defined for the "listen … ssl"
    # directive. The SAN cert (certbot … -d vigilguard.net -d www.vigilguard.net) already covers www,
    # so reuse the same cert here; nginx must present it to complete the TLS handshake before it can 301.
    ssl_certificate     /etc/letsencrypt/live/vigilguard.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigilguard.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # canonicalize www → apex over TLS (single public URL for the marketing site).
    return 301 https://vigilguard.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vigilguard.net;

    ssl_certificate     /etc/letsencrypt/live/vigilguard.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigilguard.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Cloudflare edge (the production front door; see docs/runbooks/AWS-DEPLOY.md) -------------------
    # When Cloudflare proxies vigilguard.net (orange-cloud) to this EC2 origin, the peer nginx sees is a
    # Cloudflare edge IP, not the visitor. Restore the REAL client IP from CF-Connecting-IP — but trust that
    # header ONLY from Cloudflare's published ranges, so a caller who reaches the origin directly can never
    # spoof it. (If you are NOT using Cloudflare these are harmless: no request arrives from these ranges, so
    # $remote_addr is unchanged.) THE ORIGIN LOCK itself is the AWS security group (443/80 only from these
    # same ranges) + Cloudflare Authenticated Origin Pulls — both set up in AWS-DEPLOY.md; this block only
    # fixes the LOGGED/forwarded client IP. Refresh the list from https://www.cloudflare.com/ips when it
    # changes (deploy/aws/provision.sh pulls the SAME list for the security group).
    set_real_ip_from 173.245.48.0/20;     # Cloudflare IPv4 (https://www.cloudflare.com/ips-v4)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;      # Cloudflare IPv6 (https://www.cloudflare.com/ips-v6)
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;      # the single header Cloudflare sets to the true visitor IP

    # No includeSubDomains: this public site owns no subdomains, and the operator cockpit / customer app are
    # SEPARATE origins (often sibling subdomains with their own — sometimes internal-CA — certs) that must
    # manage their own HSTS. Asserting includeSubDomains here would pin every *.vigilguard.net to strict
    # HTTPS for a year and could HARD-BLOCK a private/VPN console behind an internal-CA cert. Each origin
    # owns its own HSTS policy; add includeSubDomains only if you control every subdomain with a public cert.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress text responses (a marketing site is mostly HTML/CSS/JS/SVG/JSON). pubui serves pre-set
    # Content-Type + Cache-Control; nginx just gzips the body.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml
               application/manifest+json font/woff2;

    location / {
        proxy_pass http://127.0.0.1:8735;
        proxy_set_header Host $host;                 # forward the real domain (logging/future host logic)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
