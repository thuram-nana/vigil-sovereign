# VIGIL COMMAND — nginx reverse proxy for the WHOLE unified UI (TLS via certbot)
# =============================================================================
# `vigil up` serves the unified UI at ONE origin and federates the two trust
# planes behind a self-contained reverse proxy (127.0.0.1:8770 → sigil cockpit
# 8733 / crucible api 8799 / crucible console 8787). None of those listeners is
# public — the three backends bind loopback and the vigil up proxy binds loopback
# (or a private/tunnel IP) and fails closed on a public bind. This nginx site is
# the only thing on a public port: it terminates TLS for your domain and forwards
# to the vigil up proxy over loopback (see REMOTE-HOSTING.md).
#
# 1) Bring the stack up so the backends trust the domain and the proxy binds loopback:
#      CRUCIBLE_API_KEY=... \
#      vigil up --domain vigil.example.com --host 127.0.0.1 --port 8770 --no-browser
# 2) Obtain a cert:  certbot certonly --nginx -d vigil.example.com
# 3) Install this file (edit server_name + cert paths), then: nginx -t && systemctl reload nginx
#
# CRITICAL: `proxy_set_header Host $host;` forwards the ORIGINAL domain through the
# vigil up proxy to each backend, whose anti-DNS-rebinding allowlist requires it.
# Do not send the upstream (127.0.0.1) as Host.

server {
    listen 80;
    listen [::]:80;
    server_name vigil.example.com;
    # redirect to the literal domain (not $host) so this block can't reflect an attacker-set Host.
    return 301 https://vigil.example.com$request_uri;   # force TLS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vigil.example.com;

    ssl_certificate     /etc/letsencrypt/live/vigil.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigil.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Server-Sent Events: no buffering, long-lived, HTTP/1.1 to the upstream. The vigil up proxy
    # already streams these; nginx must not re-buffer them.
    location = /sovereign/api/stream { proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }
    location = /offense/api/events { proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }
    location = /offense/api/blackboard { proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }

    # Everything else: the unified bundle + both federated read/action planes.
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;                # anti-rebind allowlist: forward the domain
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
