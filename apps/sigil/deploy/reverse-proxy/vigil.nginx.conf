# VIGIL COMMAND — nginx reverse proxy for the WHOLE unified UI (TLS via certbot)
# =============================================================================
# `vigil up` serves the unified UI at ONE origin and federates the two trust
# planes behind a self-contained reverse proxy (127.0.0.1:8770 → sigil cockpit
# 8733 / crucible api 8799 / crucible console 8787). None of those listeners is
# public — the three backends bind loopback and the vigil up proxy binds loopback
# (or a private/tunnel IP) and fails closed on a public bind. This nginx site is
# the only thing on a public port: it terminates TLS for your domain and forwards
# to the vigil up proxy over loopback (see REMOTE-HOSTING.md).
#
# 1) Bring the stack up so the backends trust the domain and the proxy binds loopback:
#      CRUCIBLE_API_KEY=... \
#      vigil up --domain console.vigilguard.net --host 127.0.0.1 --port 8770 --no-browser
# 2) Obtain a cert:  certbot certonly --nginx -d console.vigilguard.net
# 3) Install this file (edit server_name + cert paths), then: nginx -t && systemctl reload nginx
#
# CRITICAL: `proxy_set_header Host $host;` forwards the ORIGINAL domain through the
# vigil up proxy to each backend, whose anti-DNS-rebinding allowlist requires it.
# Do not send the upstream (127.0.0.1) as Host.

server {
    listen 80;
    listen [::]:80;
    server_name console.vigilguard.net;
    # redirect to the literal domain (not $host) so this block can't reflect an attacker-set Host.
    return 301 https://console.vigilguard.net$request_uri;   # force TLS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.vigilguard.net;

    ssl_certificate     /etc/letsencrypt/live/console.vigilguard.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.vigilguard.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- The ONE exception to the admin IP allow-list below: payment-provider webhooks ------------------------
    # Stripe (and Flutterwave, while that adapter is in use) deliver from their own servers, which are never on
    # your admin/VPN list, so EXACTLY `POST /webhooks/stripe` and `POST /webhooks/billing` are forwarded from any
    # source IP. Nothing else on this host is: every other path still meets the allow-list, and any other method
    # on these two paths gets 403 from `limit_except`.
    #
    # Why this is safe: the request body is untrusted and is never what credits an account.
    #   * The `vigil up` proxy verifies `Stripe-Signature` (HMAC-SHA256 over the raw body with the endpoint's
    #     signing secret, 300 s tolerance) and refuses anything else before it writes a byte; it only spools the
    #     delivery as an inert file (integration/vigil_integration/uiproxy.py `_webhooks_stripe`).
    #   * The billing drain re-verifies the same signature, then RE-FETCHES every Checkout Session / Invoice /
    #     Subscription from Stripe with the restricted API key; only those fetched objects, mapped through the
    #     owner catalog, can mint. No credit is ever taken from the webhook body.
    #   * `/webhooks/billing` (Flutterwave) has the same shape: a constant-time `verif-hash` check at the proxy,
    #     then a server-side transaction re-verify in the drain before any mint.
    # So a forged or replayed delivery is refused or inert whatever IP it comes from.
    #
    # Exact path only. `location =` matches the NORMALISED path, so the raw request line is checked as well:
    # `/webhooks/x/../stripe`, `/webhooks//stripe`, `/webhooks/%73tripe` or an added query string would normalise
    # onto this location and then be proxied in their raw form, so they get 404 instead. The fixed URI on
    # `proxy_pass` sends the upstream exactly this path. Host is forwarded as on the rest of this vhost, and
    # `Stripe-Signature` (like every client header) passes through unchanged. Bodies are capped at 1 MB here;
    # the proxy itself refuses more than 128 KiB.
    location = /webhooks/stripe {
        allow all;                                            # any source IP (replaces the server-level list here)
        limit_except POST { deny all; }                       # POST only
        if ($request_uri != "/webhooks/stripe") { return 404; }   # the raw request line, byte-exact
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8770/webhooks/stripe;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location = /webhooks/billing {
        allow all;                                            # any source IP (replaces the server-level list here)
        limit_except POST { deny all; }                       # POST only
        if ($request_uri != "/webhooks/billing") { return 404; }  # the raw request line, byte-exact
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8770/webhooks/billing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # --- The operator cockpit is NOT a public face (see docs/runbooks/AWS-DEPLOY.md §topology + §3) --------
    # Keep it off public DNS: create NO `console` A record (reach it via VPN / SSH local-forward / split-horizon
    # internal DNS). As defense-in-depth should a record ever leak — and because the AWS SG trusts ALL
    # Cloudflare ranges, so a record pointed here is reachable by any Cloudflare tenant — restrict this vhost
    # to your admin/VPN CIDR by UNCOMMENTING and setting the range below (left commented so this ships inert).
    # It covers every location in this server except the two webhook locations above, which set `allow all`.
    # allow 203.0.113.0/24;   # your admin / VPN CIDR (repeat for more)
    # deny all;

    # Server-Sent Events: no buffering, long-lived, HTTP/1.1 to the upstream. The vigil up proxy
    # already streams these; nginx must not re-buffer them.
    location = /sovereign/api/stream { proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }
    location = /offense/api/events { proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }
    location = /offense/api/blackboard { proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1;
        proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; }

    # Everything else: the unified bundle + both federated read/action planes.
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;                # anti-rebind allowlist: forward the domain
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
