# SIGIL cockpit — nginx reverse proxy (TLS via certbot / Let's Encrypt)
# =====================================================================
# The cockpit NEVER binds a public interface. It binds loopback (or a private
# WireGuard/Tailscale IP) and this proxy terminates TLS for your domain and
# forwards to it. The tunnel/proxy is the network boundary; the cockpit stays
# non-public and fails closed on a public bind (see REMOTE-HOSTING.md).
#
# 1) Run the cockpit privately, teaching it the domain it will be reached by:
#      SIGIL_UI_ALLOWED_HOSTS=cockpit.example.com \
#      SIGIL_UI_ALLOWED_ORIGINS=https://cockpit.example.com \
#      sigil serve --host 127.0.0.1 --port 8733
# 2) Obtain a cert:  certbot certonly --nginx -d cockpit.example.com
# 3) Install this file (edit the server_name + cert paths), then: nginx -t && systemctl reload nginx
#
# CRITICAL: `proxy_set_header Host $host;` forwards the ORIGINAL domain to the
# cockpit, which its anti-DNS-rebinding allowlist requires. Do not send the
# upstream (127.0.0.1) as Host.

server {
    listen 80;
    listen [::]:80;
    server_name cockpit.example.com;
    return 301 https://$host$request_uri;          # force TLS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cockpit.example.com;

    ssl_certificate     /etc/letsencrypt/live/cockpit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cockpit.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Server-Sent Events: no buffering, long-lived, HTTP/1.1 to the upstream.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8733;
        proxy_set_header Host $host;                # anti-rebind allowlist: forward the domain
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Read plane, owner-signed action plane, static assets.
    location / {
        proxy_pass http://127.0.0.1:8733;
        proxy_set_header Host $host;                # anti-rebind allowlist: forward the domain
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
