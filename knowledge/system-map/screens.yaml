# screens.yaml — the HUMAN source of truth for the VIGIL UI screen map (SIGIL reads the generated
# system-map.json). One entry per top-level screen in the unified UI's NAV (packages/vigil-ui/app.js).
#
# Each `id` MUST equal a NAV id AND a route() id in app.js — CI (tools/system-map/generate.py --check)
# fails the build if the sets diverge, so SIGIL's map can never drift from the real UI. `synonyms` are the
# spoken phrases SIGIL's voice navigation matches (S2); keep them lowercase, distinctive, and non-empty.
#
# Fields: id · label (UI text) · group (DO|MANAGE|LEARN) · owner (needs the owner plane) · plane (unified)
#         · description (what the screen is for) · synonyms (voice phrases → this screen)

screens:
  - id: home
    label: Home
    group: DO
    owner: false
    plane: unified
    description: The command dashboard — system status, quick actions, and where to go next.
    synonyms: [home, command, dashboard, start page, overview]

  - id: assess
    label: New Assessment
    group: DO
    owner: false
    plane: unified
    description: The wizard that launches a gated engagement against a URL, API, codebase, or infra target.
    synonyms: [new assessment, assessment, new scan, start a scan, new engagement, assess, test something]

  - id: chat
    label: Chat
    group: DO
    owner: false
    plane: unified
    description: Tell the agent in natural language what to test; it launches the same gated run and streams it here.
    synonyms: [chat, talk, ask, conversation, agent chat]

  - id: terminal
    label: Terminal
    group: DO
    owner: false
    plane: unified
    description: A governed local terminal — ask in English or type a command; the AI proposes, the allowlist and gate decide, you approve, and only local read-only commands run (every run signed).
    synonyms: [terminal, command line, shell, console, run a command, type a command, cli]

  - id: live
    label: Live
    group: DO
    owner: false
    plane: unified
    description: Watch an active or recent run stream live — its findings, tools, and events as they happen.
    synonyms: [live, live run, watch, stream, current run, running]

  - id: findings
    label: Findings
    group: DO
    owner: false
    plane: unified
    description: The confirmed findings and attack paths from your runs, oracle-graded.
    synonyms: [findings, results, bugs, vulnerabilities, issues, what did you find]

  - id: proof
    label: Proof Studio
    group: DO
    owner: false
    plane: unified
    description: Oracle-confirmed, signed, replayable exploit proofs — a FACT means an oracle re-fired over captured raw bytes.
    synonyms: [proof studio, poc, exploit, reproduction, mint, proof of pwn, replay, prove the bug]

  - id: report
    label: Report
    group: DO
    owner: false
    plane: unified
    description: A live, re-verified, proof-carrying client report — every finding re-checks its certificate offline.
    synonyms: [report, client, deliverable, deliverable pdf, certificate, portal, attestation]

  - id: fixes
    label: Fixes
    group: DO
    owner: false
    plane: unified
    description: Proposed fixes and patches for confirmed findings; each queues for your approval.
    synonyms: [fixes, patches, remediation, repairs, fix it]

  - id: defense
    label: Defense (AEGIS)
    group: DO
    owner: false
    plane: unified
    description: The defensive AEGIS side — detections, posture, and the managed gateway.
    synonyms: [defense, aegis, defend, protection, shield, blue team]

  - id: sessions
    label: Sessions
    group: MANAGE
    owner: false
    plane: unified
    description: Your permanent engagement sessions — open, rename, connect, and remove them; each has its own knowledge graph.
    synonyms: [sessions, session list, history, my sessions, engagements]

  - id: activity
    label: Activity
    group: MANAGE
    owner: false
    plane: unified
    description: Background activity across the system — running tasks and recent events.
    synonyms: [activity, background, tasks, jobs, whats running]

  - id: safety
    label: Approvals & Safety
    group: MANAGE
    owner: true
    plane: unified
    description: The owner approval queue and safety controls — approve a queued action or trip the kill-switch.
    synonyms: [safety, approvals, approve, approval queue, kill switch, stop everything]

  - id: charter
    label: Charter & Attestation
    group: MANAGE
    owner: true
    plane: unified
    description: Authorization + the who/when/what usage-attestation ledger; provision a loopback authority (a remote charter needs an out-of-band ceremony).
    synonyms: [charter, attestation, authorization, authority, ledger, provision, who, when, scope]

  - id: apikeys
    label: API Keys
    group: MANAGE
    owner: true
    plane: unified
    description: Enter and live-test the API keys and cloud/graph credentials the system needs.
    synonyms: [api keys, keys, credentials, secrets, connect neo4j, cloud credentials]

  - id: tools
    label: Tools
    group: MANAGE
    owner: false
    plane: unified
    description: The tool arsenal — what is installed, what each does, and on-demand provisioning.
    synonyms: [tools, arsenal, toolkit, install a tool]

  - id: brain
    label: Brain
    group: MANAGE
    owner: false
    plane: unified
    description: The reasoning brain — intelligence, memory, priors, and the capability catalog.
    synonyms: [brain, intelligence, reasoning, memory, catalog, capabilities]

  - id: compliance
    label: Compliance
    group: MANAGE
    owner: false
    plane: unified
    description: Map oracle-proven findings to OWASP / CWE / PCI-DSS / SOC 2 / ISO 27001 controls + MITRE ATT&CK.
    synonyms: [compliance, standards, owasp, cwe, pci, soc2, iso27001, attack, controls, mapping]

  - id: assurance
    label: Assurance
    group: MANAGE
    owner: false
    plane: unified
    description: Continuous proof / drift — diff the oracle-confirmed fact set between two runs (regressions vs fixes).
    synonyms: [assurance, drift, continuous, regression, delta, proof, diff]

  - id: settings
    label: Settings
    group: MANAGE
    owner: true
    plane: unified
    description: System settings — the AI model, effort, providers, and other configuration.
    synonyms: [settings, config, configuration, preferences, options]

  - id: trust
    label: Trust Center
    group: LEARN
    owner: false
    plane: unified
    description: VIGIL's signed, offline-verifiable certificates rendered as certificates — trust root, out-of-band fingerprint pin, and a live offline PASS/FAIL verification.
    synonyms: [trust center, certificates, certs, signed certificate, trust root, fingerprint pin, offline verify, verify certificate, provable, recall baseline, accuracy baseline]

  - id: manual
    label: Manual
    group: LEARN
    owner: false
    plane: unified
    description: The in-app manual — how the system works and how to use each feature.
    synonyms: [manual, help, docs, documentation, guide, how do i]

  - id: knowledge
    label: Knowledge Engine
    group: LEARN
    owner: false
    plane: unified
    description: The knowledge engine — an auto-updating vulnerability-intelligence feed (leads, never facts) and the defensive knowledge catalog.
    synonyms: [knowledge, knowledge engine, vulnerabilities, vuln feed, cve, vulnerability intelligence]
