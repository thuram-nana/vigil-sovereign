name: livefire

# THE GAP THIS CLOSES. The strongest evidence this repository produces — an engine-built argv, a real
# tool run against a live target, its bytes read by an engine reader, the planted weakness reported, and
# a negative control proven to have RUN and stayed silent — lived entirely in
# tools/livefire/tool_drivers_livefire.py, which NO workflow invoked. It was proven by a person running
# it by hand, once. Everything it guarded could regress green.
#
# Two jobs, because the table is not uniformly cheap:
#   * livefire-smoke — per PR. The rows whose tools apt-install in seconds AND drive cleanly: nmap and
#     both hydra rows (hydra carries the negative control proven to have RUN). ~3 minutes. REQUIRED.
#     nikto is deliberately NOT here — apt's is a 2011 build whose JSON output the engine cannot read,
#     and a working one needs an unverifiable-from-here source build; it runs nightly instead.
#   * livefire-full  — nightly + on demand. All ten rows; needs a JVM, three Go binaries and a nikto
#     from source, and takes up to ~70 minutes. Reports; never blocks a PR.
#
# The range needs NO docker, NO network and NO root: the `vulnapp` target is the repository's own
# stdlib HTTP app on loopback, and the harness starts its own in-process controls.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"        # nightly, for the full table
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated subset of rows to drive (blank = the whole table)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  livefire-smoke:
    name: livefire smoke (per-PR subset)
    # The nightly cron should not also run the smoke — the full job below covers it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: install the fast tools
        # ONLY tools that come from apt in seconds AND drive cleanly. nuclei/httpx/ffuf (Go) and zaproxy
        # (JVM) are deliberately NOT here — they belong to the nightly job, so a slow or flaky
        # third-party download can never block a pull request.
        #
        # NIKTO IS NOT HERE EITHER, and that is a deliberate move to the nightly job, not a dropped row.
        # apt ships nikto 1:2.1.5-3.1 — a 2011 release whose `-Format json` writes plain TEXT, which the
        # engine's reader correctly refuses. A working nikto (2.6.0, which drives end to end — measured
        # locally, engine-parsed=5 observations on the vulnerable target, silent on the control) is only
        # available from source, and this charter-restricted host cannot reach the network to VERIFY a
        # source pin before trusting it. A REQUIRED per-PR gate must not depend on an unverified
        # from-source build, so nikto joins the other provision-fragile tools in the non-blocking nightly
        # run, where a bad pin is a signal rather than a merge-blocker. The capability is proven; only its
        # fast-lane provisioning is unreliable, which is exactly the distinction this split already makes.
        run: sudo apt-get update && sudo apt-get install -y nmap hydra

      - name: install the engine's python deps
        run: |
          # W3-2: the engine's runtime deps come from the committed HASH LOCK so the live-fire runs
          # against the same tree it ships (CI once installed cryptography>=42 under a >=50 CVE floor).
          # vigil_core is first-party → editable --no-deps. No pytest here: this job drives the engine.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps

      - name: build the egress guard
        run: make -C tools/egress-guard

      - name: drive the subset against the loopback range
        id: drive
        env:
          # nmap + both hydra rows. hydra is here deliberately: its form-login row is the one that
          # proves a negative control ACTUALLY RAN (read from the target's own ledger), and that the
          # cracked credential reaches neither the observations nor the signed record.
          VIGIL_LIVEFIRE_ONLY: "nmap,hydra"
          VIGIL_LIVEFIRE_PYTHON: python
          # Record every connect the run makes. nmap is exempted by the guard itself (NO_NEW_PRIVS
          # would strip its cap_net_raw and it would silently report nothing) — see live/egress_guard.py.
          VIGIL_EGRESS_GUARD: "1"
          VIGIL_EGRESS_GUARD_LOG: ${{ github.workspace }}/livefire-egress.log
        run: bash tools/livefire/tool_drivers_livefire.sh

      - name: assert nothing left the host during the run
        # Only when the run actually happened. If an earlier step failed, the missing log is
        # expected, and a second error about it buries the real cause.
        if: always() && steps.drive.outcome != 'skipped'
        # ASSERTED, NOT MERELY PRINTED. Printing the log makes a run with blocked=17 byte-identically as
        # green as one with blocked=0 — which leaves the no-egress figure exactly what this program set
        # out to replace: a measurement a human has to read. The job fails if any non-loopback send was
        # refused, because on a loopback-only range there is no legitimate reason for one.
        run: |
          log="${{ github.workspace }}/livefire-egress.log"
          if [ ! -s "$log" ]; then
            echo "::error::no guard log — the egress guard did not run, so nothing was measured"
            exit 1
          fi
          cat "$log"
          if grep -q 'BLOCKED' "$log"; then
            echo "::error::a tool attempted to leave the host during the live-fire run"
            exit 1
          fi
          echo "no non-loopback send was attempted by any guarded tool"

  livefire-full:
    name: livefire full table (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"

      - name: install the apt tools
        # nikto deliberately NOT from apt — see the smoke job: noble's 2.1.5 predates JSON output and
        # silently writes text, so the engine's reader cannot consume it.
        run: sudo apt-get update && sudo apt-get install -y nmap hydra sqlmap wapiti libnet-ssleay-perl

      - name: install a nikto the engine can actually drive
        # Pinned to a COMMIT on main, not the 2.5.0 RELEASE TAG. The first CI run of this branch pinned
        # 2.5.0 and it wrote no usable JSON at all (empty report -> "Expecting value: line 1 column 1");
        # the JSON output was repaired after that release. This SHA is main HEAD (2026-07-31), which
        # reports the same "2.6.0 (LW 2.5)" version string as the Kali build that drives end to end
        # locally. It is NOT verified on this host — the charter forbids the egress a local clone needs —
        # which is exactly why nikto rides this NON-BLOCKING nightly job and not the required per-PR gate.
        run: |
          sudo git clone --filter=blob:none https://github.com/sullo/nikto /opt/nikto
          sudo git -C /opt/nikto checkout d5067406bc0902f8174cb5f8d595f637951974ce
          printf '#!/bin/sh\nexec /opt/nikto/program/nikto.pl "$@"\n' | sudo tee /usr/local/bin/nikto >/dev/null
          sudo chmod +x /usr/local/bin/nikto
          nikto -Version | head -2
          ver="$(nikto -Version 2>/dev/null | sed -n 's/^Nikto \([0-9][0-9.]*\).*/\1/p' | head -1)"
          major="${ver%%.*}"; minor="$(printf '%s' "${ver#*.}" | cut -d. -f1)"
          if [ -z "$ver" ] || [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 6 ]; }; then
            echo "::error::nikto ${ver:-unknown} is below 2.6 - the 2.5.0 release's JSON output is broken"
            exit 1
          fi

      - name: install the Go tools (pinned)
        # Pinned versions, not @latest: a live-fire whose tool set changes underneath it cannot be
        # compared to the run before it.
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.7 || echo "nuclei install failed"
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.9   || echo "httpx install failed"
          go install github.com/ffuf/ffuf/v2@v2.1.0                        || echo "ffuf install failed"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: install the engine's python deps
        run: |
          # W3-2: the engine's runtime deps come from the committed HASH LOCK so the live-fire runs
          # against the same tree it ships (CI once installed cryptography>=42 under a >=50 CVE floor).
          # vigil_core is first-party → editable --no-deps. No pytest here: this job drives the engine.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps

      - name: build the egress guard
        run: make -C tools/egress-guard

      - name: drive the table against the loopback range
        id: drive
        env:
          VIGIL_LIVEFIRE_ONLY: ${{ github.event.inputs.only }}
          VIGIL_LIVEFIRE_PYTHON: python
          # A tool that is absent cannot be proven, and this job must not report a SKIP as a pass. Only
          # zaproxy is acknowledged: it needs a full JVM install this job does not do. Everything else
          # is expected to be present, and a missing one FAILS — which is the honest outcome.
          VIGIL_LIVEFIRE_ALLOW_MISSING: "zaproxy"
          VIGIL_EGRESS_GUARD: "1"
          VIGIL_EGRESS_GUARD_LOG: ${{ github.workspace }}/livefire-egress.log
        run: bash tools/livefire/tool_drivers_livefire.sh

      - name: assert nothing left the host during the run
        # Only when the run actually happened. If an earlier step failed, the missing log is
        # expected, and a second error about it buries the real cause.
        if: always() && steps.drive.outcome != 'skipped'
        # Same rule as the smoke job: on a loopback-only range a refused non-loopback send means a tool
        # tried to leave, and printing that is not the same as failing on it.
        run: |
          log="${{ github.workspace }}/livefire-egress.log"
          if [ ! -s "$log" ]; then
            echo "::error::no guard log — the egress guard did not run, so nothing was measured"
            exit 1
          fi
          cat "$log"
          if grep -q 'BLOCKED' "$log"; then
            echo "::error::a tool attempted to leave the host during the live-fire run"
            exit 1
          fi
          echo "no non-loopback send was attempted by any guarded tool"

  # ===========================================================================================
  # W11-2 (#483): the three live-fire scripts that no workflow referenced, wired as scheduled
  # jobs that ASSERT ON RESULTS (a grepped success sentinel, not merely a zero exit) and FAIL
  # CLOSED on a missing required tool (tools/livefire/require_tools.py — proven in required CI by
  # integration/tests/test_livefire_require_tools.py). Nightly + on demand, never blocking a PR.
  # ===========================================================================================

  livefire-range:
    name: livefire range (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: preflight — a MISSING required tool FAILS this job (W11-2, not tolerated)
        # The negative control for this gate is asserted in required CI: remove a required tool and
        # require_tools.py exits non-zero. Here it guards the run for real.
        run: python3 tools/livefire/require_tools.py docker python3 git

      - name: source range — deterministic, no docker, and its content-id match is a RESULT assertion
        # `up src` dies non-zero on any fingerprint drift; the status grep asserts the recorded content
        # ids actually matched, rather than trusting the exit code alone.
        run: |
          bash tools/livefire/range.sh up src
          bash tools/livefire/range.sh status | tee range-status.log
          grep -q 'content ids match the manifest' range-status.log \
            || { echo "::error::the source range content ids did not match the manifest"; exit 1; }

      - name: bring the container range up and prove each planted weakness (differential)
        # `range.sh verify` runs each probe next to its negative control; it dies non-zero unless the
        # planted weakness fired AND the control stayed silent. This is the real live-fire.
        run: |
          bash tools/livefire/range.sh up all
          bash tools/livefire/range.sh verify | tee range-verify.log

      - name: ASSERT on the differential result, not just the exit code
        run: |
          grep -q 'every probed target demonstrated its planted weakness, and every control stayed silent' \
            range-verify.log \
            || { echo "::error::range verify did not reach its all-weaknesses-present success sentinel"; exit 1; }

      - name: tear the range down (leave the runner clean)
        if: always()
        run: bash tools/livefire/range.sh down || true

  livefire-k8s-rbac:
    name: livefire k8s RBAC (nightly)
    # E4: the Kubernetes-RBAC live-fire against a REAL throwaway k3s cluster this job stands up and
    # destroys. RESIDUAL: the real-cluster run on a hosted runner is not verifiable from the
    # charter-restricted build host; the fail-closed preflight guarding it IS proven in required CI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: preflight — a MISSING required tool FAILS this job (W11-2, not tolerated)
        run: python3 tools/livefire/require_tools.py docker python3

      - name: install the engine's python deps (hash-locked; adjudicates the real API bytes)
        run: |
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps

      - name: live-fire the k8s RBAC oracle against real cluster evidence, asserting on results
        env:
          # The deps are installed into the runner's interpreter above, so no offense venv is needed.
          VIGIL_LIVEFIRE_NO_VENV: "1"
        run: |
          bash tools/livefire/k8s_rbac_livefire.sh | tee k8s-rbac.log
          grep -q 'All checks held against real cluster evidence.' k8s-rbac.log \
            || { echo "::error::k8s RBAC live-fire did not reach its all-checks-held success sentinel"; exit 1; }

  livefire-secret-github:
    name: livefire exposed-secret validity (nightly)
    # E5 github_pat row against the REAL api.github.com. RESIDUAL: it needs an operator GitHub PAT;
    # there is none in default CI (the default GITHUB_TOKEN is an app-installation token and cannot
    # authenticate GET /user). With no PAT this is an honest reported SKIP on the credential — never on
    # a missing tool: `gh` being absent still FAILS the preflight below.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: preflight — gh MUST be present; a missing tool FAILS this job (W11-2, not tolerated)
        run: python3 tools/livefire/require_tools.py gh python3

      - name: install the engine's python deps (hash-locked; adjudicates the real 200/401)
        run: |
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps

      - name: live-fire exposed-secret validity against the real api.github.com, asserting on results
        env:
          VIGIL_LIVEFIRE_NO_VENV: "1"
          # An operator PAT with read:user. Absent by default => the run is an honest credential SKIP.
          GH_TOKEN: ${{ secrets.VIGIL_LIVEFIRE_GH_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::no VIGIL_LIVEFIRE_GH_PAT secret is configured — the exposed-secret live-fire"
            echo "needs an operator PAT (RESIDUAL). The preflight above already proved gh is present;"
            echo "skipping the provider run rather than fabricating a result."
            exit 0
          fi
          bash tools/livefire/secret_github_livefire.sh | tee secret-github.log
          grep -q 'All checks held against a real GitHub credential' secret-github.log \
            || { echo "::error::exposed-secret live-fire did not reach its all-checks-held success sentinel"; exit 1; }
