name: livefire

# THE GAP THIS CLOSES. The strongest evidence this repository produces — an engine-built argv, a real
# tool run against a live target, its bytes read by an engine reader, the planted weakness reported, and
# a negative control proven to have RUN and stayed silent — lived entirely in
# tools/livefire/tool_drivers_livefire.py, which NO workflow invoked. It was proven by a person running
# it by hand, once. Everything it guarded could regress green.
#
# Two jobs, because the table is not uniformly cheap:
#   * livefire-smoke — per PR. The rows whose tools apt-install in seconds (nmap, hydra x2, nikto).
#     ~3 minutes. This is the one that should be a REQUIRED check.
#   * livefire-full  — nightly + on demand. All ten rows; needs a JVM and three Go binaries and takes
#     up to ~70 minutes. Reports; never blocks a PR.
#
# The range needs NO docker, NO network and NO root: the `vulnapp` target is the repository's own
# stdlib HTTP app on loopback, and the harness starts its own in-process controls.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"        # nightly, for the full table
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated subset of rows to drive (blank = the whole table)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  livefire-smoke:
    name: livefire smoke (per-PR subset)
    # The nightly cron should not also run the smoke — the full job below covers it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install the fast tools
        # Only tools that come from apt in seconds. nuclei/httpx/ffuf (Go) and zaproxy (JVM) are
        # deliberately NOT here — they belong to the nightly job, so a slow or flaky third-party
        # download can never block a pull request.
        run: sudo apt-get update && sudo apt-get install -y nmap hydra libnet-ssleay-perl

      - name: install a nikto the engine can actually drive
        # NOT apt's. Ubuntu noble ships nikto 1:2.1.5-3.1 — a 2011 release that predates JSON output
        # entirely: it ACCEPTS `-Format json`, ignores it, and writes plain text. Measured on the first
        # CI run of this job: the tool ran, exited 0, produced 1449 bytes, and the engine's reader
        # correctly refused them ("nikto report is not valid JSON"). Kali ships 2.6.0, which is why this
        # could never fail locally.
        #
        # A tool that cannot emit the format the engine reads is not a driveable tool, so the answer is
        # to provide one that can rather than to drop the row and call the subset proven. Pinned to a
        # tag: a live-fire whose tool changes underneath it cannot be compared to the run before it.
        run: |
          sudo git clone --depth 1 --branch 2.5.0 https://github.com/sullo/nikto /opt/nikto
          printf '#!/bin/sh\nexec /opt/nikto/program/nikto.pl "$@"\n' | sudo tee /usr/local/bin/nikto >/dev/null
          sudo chmod +x /usr/local/bin/nikto
          # A VERSION FLOOR, not a bespoke scan. The failure this guards against is precise and it is a
          # VERSION fact: JSON output arrived in the 2.5 line, so 2.1.5 accepts the flag and writes text.
          # Asserting the version states exactly that, in one line, and cannot disagree with the row.
          #
          # I tried the other thing first and it was a mistake worth recording: a hand-written probe that
          # ran nikto itself and parsed the result. It failed twice for reasons that had nothing to do
          # with the capability — first aimed at a closed port (nikto emitted the bare closing bytes `]}`
          # of a report with no host to describe), then with a short -maxtime (nikto writes its report at
          # the END, so it exited 0 having written nothing). That is a SECOND implementation of "can the
          # engine drive nikto", free to disagree with the live-fire row that already answers it — the
          # same error as writing a second bwrap check instead of calling the test's own predicate.
          nikto -Version | head -2
          ver="$(nikto -Version 2>/dev/null | sed -n 's/^Nikto \([0-9][0-9.]*\).*/\1/p' | head -1)"
          major="${ver%%.*}"; minor="$(printf '%s' "${ver#*.}" | cut -d. -f1)"
          if [ -z "$ver" ] || [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::nikto ${ver:-unknown} is below 2.5 - it accepts -Format json but writes TEXT, which the engine reader cannot consume (apt 2.1.5 is exactly this case)"
            exit 1
          fi
          echo "nikto $ver supports -Format json — the engine's reader can consume its report"

      - name: install the engine's python deps
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging

      - name: build the egress guard
        run: make -C tools/egress-guard

      - name: drive the subset against the loopback range
        id: drive
        env:
          # nmap + both hydra rows. hydra is here deliberately: its form-login row is the one that
          # proves a negative control ACTUALLY RAN (read from the target's own ledger), and that the
          # cracked credential reaches neither the observations nor the signed record.
          VIGIL_LIVEFIRE_ONLY: "nmap,hydra,nikto"
          VIGIL_LIVEFIRE_PYTHON: python
          # Record every connect the run makes. nmap is exempted by the guard itself (NO_NEW_PRIVS
          # would strip its cap_net_raw and it would silently report nothing) — see live/egress_guard.py.
          VIGIL_EGRESS_GUARD: "1"
          VIGIL_EGRESS_GUARD_LOG: ${{ github.workspace }}/livefire-egress.log
        run: bash tools/livefire/tool_drivers_livefire.sh

      - name: assert nothing left the host during the run
        # Only when the run actually happened. If an earlier step failed, the missing log is
        # expected, and a second error about it buries the real cause.
        if: always() && steps.drive.outcome != 'skipped'
        # ASSERTED, NOT MERELY PRINTED. Printing the log makes a run with blocked=17 byte-identically as
        # green as one with blocked=0 — which leaves the no-egress figure exactly what this program set
        # out to replace: a measurement a human has to read. The job fails if any non-loopback send was
        # refused, because on a loopback-only range there is no legitimate reason for one.
        run: |
          log="${{ github.workspace }}/livefire-egress.log"
          if [ ! -s "$log" ]; then
            echo "::error::no guard log — the egress guard did not run, so nothing was measured"
            exit 1
          fi
          cat "$log"
          if grep -q 'BLOCKED' "$log"; then
            echo "::error::a tool attempted to leave the host during the live-fire run"
            exit 1
          fi
          echo "no non-loopback send was attempted by any guarded tool"

  livefire-full:
    name: livefire full table (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: install the apt tools
        # nikto deliberately NOT from apt — see the smoke job: noble's 2.1.5 predates JSON output and
        # silently writes text, so the engine's reader cannot consume it.
        run: sudo apt-get update && sudo apt-get install -y nmap hydra sqlmap wapiti libnet-ssleay-perl

      - name: install a nikto the engine can actually drive
        run: |
          sudo git clone --depth 1 --branch 2.5.0 https://github.com/sullo/nikto /opt/nikto
          printf '#!/bin/sh\nexec /opt/nikto/program/nikto.pl "$@"\n' | sudo tee /usr/local/bin/nikto >/dev/null
          sudo chmod +x /usr/local/bin/nikto
          nikto -Version | head -2
          ver="$(nikto -Version 2>/dev/null | sed -n 's/^Nikto \([0-9][0-9.]*\).*/\1/p' | head -1)"
          major="${ver%%.*}"; minor="$(printf '%s' "${ver#*.}" | cut -d. -f1)"
          if [ -z "$ver" ] || [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::nikto ${ver:-unknown} is below 2.5 - it writes TEXT for -Format json"
            exit 1
          fi

      - name: install the Go tools (pinned)
        # Pinned versions, not @latest: a live-fire whose tool set changes underneath it cannot be
        # compared to the run before it.
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.3.7 || echo "nuclei install failed"
          go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.9   || echo "httpx install failed"
          go install github.com/ffuf/ffuf/v2@v2.1.0                        || echo "ffuf install failed"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: install the engine's python deps
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging

      - name: build the egress guard
        run: make -C tools/egress-guard

      - name: drive the table against the loopback range
        id: drive
        env:
          VIGIL_LIVEFIRE_ONLY: ${{ github.event.inputs.only }}
          VIGIL_LIVEFIRE_PYTHON: python
          # A tool that is absent cannot be proven, and this job must not report a SKIP as a pass. Only
          # zaproxy is acknowledged: it needs a full JVM install this job does not do. Everything else
          # is expected to be present, and a missing one FAILS — which is the honest outcome.
          VIGIL_LIVEFIRE_ALLOW_MISSING: "zaproxy"
          VIGIL_EGRESS_GUARD: "1"
          VIGIL_EGRESS_GUARD_LOG: ${{ github.workspace }}/livefire-egress.log
        run: bash tools/livefire/tool_drivers_livefire.sh

      - name: assert nothing left the host during the run
        # Only when the run actually happened. If an earlier step failed, the missing log is
        # expected, and a second error about it buries the real cause.
        if: always() && steps.drive.outcome != 'skipped'
        # Same rule as the smoke job: on a loopback-only range a refused non-loopback send means a tool
        # tried to leave, and printing that is not the same as failing on it.
        run: |
          log="${{ github.workspace }}/livefire-egress.log"
          if [ ! -s "$log" ]; then
            echo "::error::no guard log — the egress guard did not run, so nothing was measured"
            exit 1
          fi
          cat "$log"
          if grep -q 'BLOCKED' "$log"; then
            echo "::error::a tool attempted to leave the host during the live-fire run"
            exit 1
          fi
          echo "no non-loopback send was attempted by any guarded tool"
