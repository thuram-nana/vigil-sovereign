# Live-reality pin: the branch protection on `main` must match the committed policy.
#
# The offline test docs/tests/test_required_checks_canonical.py proves the COMMITTED artifacts agree
# with each other. This job proves the LIVE GitHub settings agree with them — it is the pin that
# catches "someone turned protection off in the UI", or edited the required-check set by hand.
#
# It reads repos/thuram-nana/vigil-sovereign/branches/main/protection and FAILS if:
#   - protection is absent (the API returns 404), or
#   - required_status_checks.contexts != .github/required-status-checks.txt (compared as a set), or
#   - required_status_checks.strict is not true, or
#   - force-pushes or branch deletions are allowed.
#
# TOKEN. Reading branch protection needs "Administration: read". `administration` is NOT a grantable
# GITHUB_TOKEN permission scope, so the default token CANNOT read it — this job requires a fine-grained
# PAT with Administration:read in the repo secret BRANCH_PROTECTION_TOKEN. Without that secret the job
# is a clean no-op (armed=false); it cannot verify anything, and must not be promoted to required.
#
# This workflow is intentionally NOT added to the required-status-check set by the change that
# introduces it: a check can only be made required once it is on `main` and reporting on PRs, AND —
# for this one — once BRANCH_PROTECTION_TOKEN exists so it actually verifies rather than no-ops.
# Promoting it is a later, deliberate governance step (tools/governance/require-checks.sh + canonical).
name: branch-protection-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily — catches an out-of-band UI change to protection
  workflow_dispatch: {}

permissions:
  contents: read
  # NOTE: `administration` is NOT a grantable GITHUB_TOKEN permission scope, so the default token can
  # never read branch protection. This job therefore requires a fine-grained PAT with
  # "Administration: read" in the repo secret BRANCH_PROTECTION_TOKEN. Without it the job is a clean
  # no-op (it cannot verify), and it must not be promoted to a required check until that secret exists.

concurrency:
  group: branch-protection-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: branch protection matches the committed policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
      REPO: thuram-nana/vigil-sovereign
      BRANCH: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: skip cleanly when no admin-scoped token is configured
        id: gate
        env:
          PAT: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          if [ -z "${PAT}" ]; then
            echo "::notice::BRANCH_PROTECTION_TOKEN is not set. The default GITHUB_TOKEN cannot read branch protection (no 'administration' scope exists for it), so this live-reality pin is INERT. Add a fine-grained PAT with Administration:read as the repo secret BRANCH_PROTECTION_TOKEN to arm it, then promote it to a required check. The offline test (docs/tests/test_required_checks_canonical.py) still pins the committed artifacts."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: read live branch protection
        id: read
        if: steps.gate.outputs.armed == 'true'
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/branches/${BRANCH}/protection" > protection.json 2> gh-err.txt; then
            echo "read protection.json ($(wc -c < protection.json) bytes)"
          else
            echo "::error::could not read branch protection for ${REPO}@${BRANCH}."
            echo "----- gh stderr -----"; cat gh-err.txt
            if grep -qiE '404|not found|not protected' gh-err.txt; then
              echo '::error::branch protection appears ABSENT (404). main is unprotected — this is the regression this job exists to catch.'
            else
              echo "::error::the token may lack Administration:read. Set the BRANCH_PROTECTION_TOKEN secret to a PAT with Administration:read, or grant the default token that permission."
            fi
            exit 1
          fi

      # The comparison logic lives in tools/governance/branch_protection_check.py (NOT inline here), so
      # the exact code this job runs is unit-tested offline by docs/tests/test_branch_protection_verify.py
      # — including the negative control that dropping a required check from the committed policy makes
      # the compare fail. A copy inline could green-wash; the extracted module is the single source.
      - name: compare live settings against the committed canonical policy
        if: steps.gate.outputs.armed == 'true'
        run: |
          set -euo pipefail
          python3 tools/governance/branch_protection_check.py protection.json .github/required-status-checks.txt
