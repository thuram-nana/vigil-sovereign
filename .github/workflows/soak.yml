name: soak

# W11-6 (#487). THE GAP THIS CLOSES. `eval/soak.py` measured a single scan's scale metrics and a
# determinism fingerprint, but nothing drove SUSTAINED load or watched memory over a long run — calling
# that a "soak" was itself a claim problem. The soak now has two honestly-split halves:
#
#   * the FAST, DETERMINISTIC core — the leak detector with its artificially-leaking-fixture NEGATIVE
#     CONTROL, and a SCALED sustained run against a deliberately conservative throughput floor — rides
#     the REQUIRED `CRUCIBLE eval + benchmark corpus` job on every PR (framework/v2/eval/tests/
#     test_soak_leak.py). It is genuinely falsifiable: a broken detector or an order-of-magnitude
#     throughput regression turns that required job red.
#
#   * THIS workflow is the OTHER half: the FULL multi-minute sustained soak at the SLA throughput floor
#     over a long run, which is too slow for a per-PR runner. It runs on a schedule (and on demand), is
#     NOT a required status check, and reports rather than blocks a PR — the same smoke-vs-nightly split
#     livefire.yml already makes. It is honestly labelled "(nightly)" and enumerated in
#     docs/tests/test_required_checks_canonical.py's KNOWN_NONPR_ADVISORY with this reason.
#
# The run needs NO docker, NO network and NO root: the target is this module's own stdlib HTTP app bound
# to 127.0.0.1 (framework/v2/eval/soak.py::serve_soak). `python3 -m framework.v2.eval.soak --sustained`
# exits non-zero — turning this job red — if the documented throughput floor is breached, a memory leak
# is detected across the run, or the scan fingerprint diverges across iterations.
#
# ── SECOND JOB: web-liveness-volume ───────────────────────────────────────────────────────────────
# Same shape, same reason, a different suite. The HexStrike W2 liveness regressions are STATISTICAL: a
# false-FACT class that fires 2.3% of the time is invisible to a one-run test (it passes ~62% of a
# 20-iteration test), so the regressions that ended the endpoint_liveness FACT are asserted over 80-300
# live loopback re-drives each. Those loops are ~25 minutes; carried on the per-PR "integration two-env
# boundary (P5)" job they pushed it past GitHub's 45m0s hard maximum and it was CANCELED
# (run 36270471752, 45m23s) — taxing every future PR in the repository.
#
# So the same honest split applies. The per-PR leg keeps every CORRECTNESS and SAFETY property plus a
# low-run WIRING twin of each statistical test (`-m "not volume"` in ci.yml); THIS job runs the
# statistical half nightly at its FULL, UNREDUCED counts (`-m volume`). Nothing is dropped and nothing
# is watered down: integration/tests/test_ci_volume_tests_run_nightly.py fails the build if a
# volume-marked test is not covered here, and the step below fails this job if the volume tests SKIP
# rather than run — a skipped proof and a passing proof are the same colour on a dashboard.

on:
  schedule:
    - cron: "0 4 * * *"        # nightly, 04:00 UTC (distinct from livefire 03:00 and supply-chain 06:00)
  workflow_dispatch:
    inputs:
      iterations:
        description: "minimum sustained iterations (blank = 200)"
        required: false
        default: "200"
      min_duration_s:
        description: "minimum wall-clock seconds of sustained load (blank = 180)"
        required: false
        default: "180"
      floor_rps:
        description: "documented throughput floor in audit-requests/sec (blank = the module default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak-full:
    name: soak full run (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install the engine's python deps
        run: |
          # W3-2: the engine's runtime deps come from the committed HASH LOCK so the soak runs against
          # the same tree it ships. vigil_core is first-party -> editable --no-deps. No pytest here: this
          # job drives the engine directly, not a test suite.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps

      - name: drive the full sustained soak (throughput floor + leak detection)
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
          # A real multi-minute soak: at least ITER iterations AND at least DURATION seconds of load.
          ITER: ${{ github.event.inputs.iterations || '200' }}
          DURATION: ${{ github.event.inputs.min_duration_s || '180' }}
          FLOOR: ${{ github.event.inputs.floor_rps }}
        run: |
          set -euo pipefail
          floor_arg=""
          if [ -n "${FLOOR:-}" ]; then floor_arg="--floor-rps ${FLOOR}"; fi
          # The module default floor is SUSTAINED_THROUGHPUT_FLOOR_RPS; --sustained defaults endpoints to
          # 8 (a soak drives DURATION, not breadth). Exits non-zero on a floor breach, a detected leak, or
          # a determinism divergence, which fails this job.
          python3 -m framework.v2.eval.soak --sustained \
            --iterations "${ITER}" --min-duration-s "${DURATION}" ${floor_arg}

  web-liveness-volume:
    name: web-liveness volume regressions (nightly)
    runs-on: ubuntu-latest
    # ~400 tool-leg runs + ~1100 direct re-drives against loopback servers. Measured ~33 min locally;
    # generous headroom, and it blocks no PR.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install the offense-leg deps (identical to the required P5 job)
        run: |
          # Byte-for-byte the install the "integration two-env boundary (P5)" job does, so the nightly
          # exercises the SAME tree the per-PR leg does: runtime from the committed HASH LOCK, vigil_core
          # editable --no-deps, pytest from the pinned CI toolchain lock.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt

      - name: run the VOLUME statistical regressions (full, unreduced run counts)
        run: |
          set -euo pipefail
          # The offense env, identical to ci.yml's offense leg: `framework` (engine/crucible) and
          # `vigil_gateway` (gateway) must both be importable or every test in the file importorskips —
          # which is exactly what the assertion step below refuses to let pass silently.
          # --strict-markers: a typo'd marker is an ERROR here, never a silently-empty selection.
          PYTHONPATH=integration:engine/crucible:gateway python -m pytest \
            integration/tests/test_web_liveness.py \
            -m volume -q -rs --strict-markers -p no:cacheprovider \
            --junit-xml="${RUNNER_TEMP:-/tmp}/volume-junit.xml"

      - name: the VOLUME regressions MUST have actually executed (a skipped proof fails this job)
        # `pytest -m volume` exits 0 when every test importorskips, and 0 when the marker selects
        # nothing after a rename — both would leave this nightly green having proved nothing, the same
        # "skipped proof == passing proof" hole assert_boundary_proof_ran.py closes for the P5 job. This
        # reads the JUnit report and fails on zero collected, on any skip, and on a count that has
        # fallen below the floor the script pins.
        run: python .github/scripts/assert_volume_tests_ran.py "${RUNNER_TEMP:-/tmp}/volume-junit.xml"
