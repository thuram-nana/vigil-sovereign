# release — sign the BUILD, not only the product.
#
# WHY THIS EXISTS. Everywhere else in this repository the *product* signs what it emits:
# findings, remediation certificates, the audit spine. Until now the *build of the product*
# signed nothing — docs/SUPPLY-CHAIN.md said so in as many words. An operator who pulled a
# `vigil-core` wheel had a hash lock proving the wheel had not changed since it was locked, and
# no way at all to prove WHO built it or FROM WHAT. This workflow closes that: every release
# artifact leaves here carrying (1) a Sigstore/cosign signature, (2) an SLSA build-provenance
# attestation, and (3) a PEP 740 attestation for the wheel — each independently verifiable by a
# third party, OFFLINE, from the Sigstore bundle alone (the Rekor inclusion proof travels inside
# it, so no call home is needed to check it).
#
# SIGNED SBOMS, ATTACHED DURABLY (W3-5 #428). This workflow also generates the CycloneDX SBOMs for
# both shipped dependency closures (offense + sovereign), cross-checks each against its hash-pinned
# lock with the SAME check the A14 gate runs (bin/verify-supply-chain.sh), cosign-signs each with the
# SAME keyless primitive as the wheel, and ATTACHES them to the GitHub Release. A release asset does
# not expire with CI artifact retention, so — unlike the 90-day `a14-sbom-cyclonedx` CI artifact that
# was the only bill of materials before — a deployed artifact now has a signed, retrievable SBOM for
# as long as the release exists. The signing scheme is NOT new: it is cosign, exactly as used for the
# wheel above (a vigil_core Ed25519/DSSE signature would need a long-lived key on the runner, which is
# the property keyless OIDC signing exists to avoid).
#
# WHEN IT RUNS. Tag push only (`v*`). It does NOT run on pull requests, so it will not report on
# the PR that introduces it — that is expected. Its SHAPE is asserted offline instead, by
# integration/tests/test_release_provenance.py and integration/tests/test_release_sbom.py, which run
# in the required "integration two-env boundary (P5)" job on every PR. The workflow is ADVISORY: it is
# not in .github/required-status-checks.txt, because a required check must be producible by a
# pull_request-triggered job and a tag-triggered one never is.
#
# ACTIONS ARE PINNED TO FULL COMMIT SHAS. A `@v4` tag is a mutable pointer on someone else's
# repository, executing with this workflow's token. The test asserts every `uses:` here is a
# 40-hex SHA.

name: release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; the one job that needs to mint OIDC-backed signatures widens it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Build-time tooling, version-pinned. NOT added to any runtime requirements spec: a build
  # backend and an attestation signer are not part of the deployed attack surface.
  BUILD_VERSION: "1.5.0"
  PYPI_ATTESTATIONS_VERSION: "0.0.30"
  # SBOM generator (W3-5 #428). Same pins the A14 supply-chain gate uses, so the SBOM attached to a
  # RELEASE is byte-generated by the identical toolchain that the PR gate cross-checks against the
  # lock. Kept out of every runtime spec for the same reason as the rest of this block.
  PIP_TOOLS_VERSION: "7.6.1"
  CYCLONEDX_VERSION: "7.3.1"
  # The single package with a clean, registry-shippable wheel (hatchling, no native ext).
  PACKAGE_DIR: "packages/core/vigil_core"

jobs:
  build-sign-attest:
    name: build, sign and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write so the signed SBOMs (and their cosign bundles) can be attached to the GitHub
      # RELEASE as assets — the durable, retention-independent store that replaces the 90-day CI
      # artifact this workflow also keeps (W3-5 #428). Release assets do not expire with CI retention.
      contents: write
      # OIDC: keyless cosign signing, the PEP 740 signer, and attest-build-provenance all mint a
      # short-lived Sigstore identity from this token. No long-lived key touches the runner.
      id-token: write
      # attest-build-provenance writes the SLSA statement to the GitHub attestations API.
      attestations: write
    steps:
      # Actions are third-party code running with this workflow's token — pinned to full SHAs.
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: setup python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: build wheel + sdist
        run: |
          python -m pip install --upgrade "build==${BUILD_VERSION}"
          python -m build --outdir dist "${PACKAGE_DIR}"
          echo "built artifacts:"
          ls -l dist/

      # (0) SBOMs for the shipped dependency closures, generated INTO dist/ so the SLSA provenance,
      # cosign signature and release attachment below all cover them exactly like the wheel (W3-5
      # #428). This is the SAME generation + cross-check the A14 gate runs on every PR
      # (bin/verify-supply-chain.sh): cyclonedx-py emits the SBOM from the hash-pinned lock and the
      # verifier cross-checks it against that lock component-for-component, so an SBOM that dropped a
      # shipped component fails HERE, before anything is signed. Two SBOMs because the product ships
      # two independent closures (offense + sovereign, FATAL-2). The offense verify runs from
      # engine/crucible (its canonical CWD); the sovereign one from the repo root, via env overrides.
      - name: install pinned SBOM tooling
        run: |
          python -m pip install \
            "pip-tools==${PIP_TOOLS_VERSION}" \
            "cyclonedx-bom==${CYCLONEDX_VERSION}"
          pip-compile --version
          cyclonedx-py --version

      - name: generate + cross-check the release SBOMs (against the hash-pinned locks)
        run: |
          set -euo pipefail
          mkdir -p dist
          root="$PWD"
          # offense closure (engine/crucible/framework/v2/requirements.lock.txt)
          ( cd engine/crucible
            bash bin/verify-supply-chain.sh \
              --sbom-out="${root}/dist/sbom-offense.cdx.json" )
          # sovereign closure (infra/supply-chain/sovereign.lock.txt)
          REQ_IN=infra/supply-chain/sovereign.in \
          REQ_LOCK=infra/supply-chain/sovereign.lock.txt \
            bash engine/crucible/bin/verify-supply-chain.sh \
              --sbom-out="${root}/dist/sbom-sovereign.cdx.json"
          echo "release SBOMs generated + cross-checked against their locks:"
          ls -l dist/*.cdx.json

      # (2) SLSA build provenance over EVERY artifact this run produced (wheels, sdist AND the SBOMs
      # generated just above). The subject is the sha256 of each file, so the attestation is bound to
      # these exact bytes.
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: "dist/*"

      # (1) Sigstore/cosign keyless signature for every artifact, emitted as an offline-
      # verifiable bundle (certificate + signature + Rekor inclusion proof in one file).
      - name: install cosign
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: cosign sign every artifact (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # Sign the distributions AND the SBOMs with the SAME keyless primitive (W3-5 #428): the
          # SBOM travels with its own offline-verifiable *.cosign.bundle, so an SBOM downloaded from
          # a release years later is verifiable air-gapped exactly like the wheel it describes.
          for f in dist/*.whl dist/*.tar.gz dist/*.cdx.json; do
            [ -e "$f" ] || continue
            echo "signing: $f"
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done

      # (3) PEP 740 attestation for every wheel (and the sdist too). `.publish.attestation`
      # files are the exact objects PyPI stores and serves for third-party verification.
      - name: PEP 740 attestations
        run: |
          python -m pip install "pypi-attestations==${PYPI_ATTESTATIONS_VERSION}"
          python -m pypi_attestations sign dist/*.whl dist/*.tar.gz
          echo "attestations produced:"
          ls -l dist/*.publish.attestation

      # A verification script that verifies the artifacts THIS run just produced — the offline
      # cosign check plus a NEGATIVE CONTROL proving a tampered artifact is rejected. It ALSO verifies
      # each SBOM's signature offline and re-runs the component cross-check against the SBOM BYTES that
      # are about to be attached, with its own omit-a-component negative control (W3-5 #428).
      - name: verify signatures + attestations (offline) + tamper negative control
        run: bash .github/scripts/verify-release-artifacts.sh dist

      # DURABLE, retention-independent store for the signed SBOMs (W3-5 #428). The defect this closes
      # is that the only bill of materials lived in a 90-day CI artifact; a GitHub RELEASE asset does
      # not expire with CI retention, so a deployed artifact has a retrievable, signed SBOM for as long
      # as the release exists. `gh` is first-party and pre-installed, so no third-party action is
      # pinned here. `create ... || true` tolerates a release a maintainer already made from the tag
      # (the UI path); `upload --clobber` then attaches/refreshes the assets idempotently.
      - name: attach signed SBOMs to the GitHub Release (durable)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.cdx.json dist/*.cdx.json.cosign.bundle)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no SBOM assets to attach — the SBOM generation step did not run" >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes "Automated release ${TAG}. Signed SBOMs attached (W3-5)." --verify-tag || true
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "attached to release ${TAG}:"
          printf '  %s\n' "${assets[@]}"

      - name: upload signed artifacts + attestations
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: vigil-release-signed
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.cosign.bundle
            dist/*.publish.attestation
          if-no-files-found: error
          retention-days: 90

  # OPT-IN actual publish. Gated on a repository variable so a tag push does NOT try to upload
  # to PyPI until a maintainer has configured Trusted Publishing (OIDC) for the project. When
  # enabled, gh-action-pypi-publish attaches PEP 740 attestations at upload time as well.
  publish-pypi:
    name: publish to PyPI (opt-in, trusted publishing)
    needs: build-sign-attest
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: download built artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: vigil-release-signed
          path: dist
      - name: strip signature side-cars (only distributions are uploaded)
        # The cosign bundle is not a distribution; the pre-generated PEP 740 attestations are
        # removed too so gh-action-pypi-publish generates its own at upload time (attestations: true).
        # The SBOMs (and their bundles) are release assets, not distributions — remove them so the
        # publisher only ever sees *.whl / *.tar.gz (W3-5 #428).
        run: rm -f dist/*.cosign.bundle dist/*.publish.attestation dist/*.cdx.json
      - name: publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist
          repository-url: ${{ vars.PYPI_REPOSITORY_URL }}
          skip-existing: true
