# A14 — supply-chain / packaging hardening gate.
#
# WHY A SEPARATE WORKFLOW. The jobs in ci.yml prove the SYSTEM behaves. This one proves the
# INPUTS to that system are the ones we chose: the base images, the third-party wheels, and
# the transitive tree underneath them. Those are the parts an attacker can change without
# touching this repository at all.
#
# WHAT RUNS WHERE. Everything that needs egress runs here, because it has to: hash-locking
# resolves against PyPI, the vulnerability DB is downloaded, base-image digests are resolved
# from a registry, and (W3-7 #430) the first-party gateway image is BUILT and `trivy image`-scanned
# — a built image can only be scanned where a docker daemon and network exist. The STATIC half —
# "is the result of that work committed, complete, and still meaningful?" — is in
# integration/tests/test_supply_chain.py, so it also runs in the ordinary `integration` job and holds
# even on a runner with no network.
#
# THRESHOLD (see docs/SUPPLY-CHAIN.md for the full policy):
#   HIGH + CRITICAL  -> BLOCK the pull request.
#   MEDIUM and below -> reported in full, advisory.
# The threshold was CRITICAL-only for as long as a known HIGH sat in the vendored strix tree
# (aiohttp, pyasn1 and cryptography); those are bumped (W3-9, issue #432) and the tree now
# scans clean at HIGH, so the gate blocks HIGH as well as CRITICAL. A gate whose allow-list
# has to grow without limit to stay green is theatre; blocking HIGH+CRITICAL and reporting the
# rest keeps meaning something. Every suppression in .trivyignore carries a written
# justification, and a test enforces that.
#
# ADVISORY-BY-DESIGN steps: base-image drift and the full MEDIUM-and-below report. Upstream
# retagging or publishing an advisory is not a defect in the change under review, and a gate
# that goes red for reasons the author cannot fix is a gate that gets switched off.

name: a14-supply-chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Build-time tooling, version-pinned. Deliberately NOT in either requirements.in: adding a
  # locker and an SBOM generator to a RUNTIME spec expands the deployed attack surface
  # without expanding the runtime feature set.
  PIP_TOOLS_VERSION: "7.6.1"
  CYCLONEDX_VERSION: "7.3.1"
  # Scanner, pinned by version AND by the sha256 of the release tarball. Installing a
  # security scanner via `curl | sh` from an unpinned URL would be its own supply-chain hole.
  TRIVY_VERSION: "0.73.0"
  TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    name: A14 supply-chain gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are themselves third-party code executing with this workflow's token, so they
      # are pinned to full commit SHAs, not to mutable tags. A test asserts this stays true.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The locks are Python-minor specific (markers and the resolved set both depend on
          # it), so this MUST match the PIN_PY in bin/verify-supply-chain.sh.
          python-version: "3.13"

      - name: install pinned build-time tooling
        run: |
          python -m pip install --upgrade pip
          # pip-tools + cyclonedx-bom are this gate's OWN build tooling (they regenerate/verify the
          # locks and SBOMs); they are exact-pinned by env var. pytest — the harness that runs this
          # file's own static checks — comes from the committed CI toolchain hash lock (W3-2), so even
          # the supply-chain gate resolves nothing fresh.
          python -m pip install \
            "pip-tools==${PIP_TOOLS_VERSION}" \
            "cyclonedx-bom==${CYCLONEDX_VERSION}"
          python -m pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
          pip-compile --version
          cyclonedx-py --version

      # ------------------------------------------------------------------------------
      # 1. Base images — a tag is a mutable pointer.
      # ------------------------------------------------------------------------------

      - name: base images are digest-pinned (offline)
        run: python3 infra/supply-chain/image_pins.py --check

      # NEGATIVE CONTROL for the drift gate below, and it runs FIRST on purpose. The gate passes when
      # every resolvable pin is up-to-date — the right outcome, but indistinguishable from a drift check
      # that silently resolves nothing. So point the EXACT blocking config at a fixture whose registry IS
      # resolvable (Docker Hub `library/python:3.13-slim`) but whose pinned digest is deliberately WRONG,
      # and require it to FAIL. If it passes, the gate is a no-op and this job says so instead of a green
      # tick. The fixture lives outside the repo tree so the real drift scan never sees it. (The pure drift
      # logic has an OFFLINE negative control in integration/tests/test_supply_chain.py too — this is the
      # live, end-to-end proof against the real Docker Hub resolver.)
      - name: negative control — a deliberately drifted resolvable pin turns the drift gate red
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/a14-drift-negctl
          printf 'FROM python:3.13-slim@sha256:%064d\n' 0 > /tmp/a14-drift-negctl/Dockerfile
          set +e
          python3 infra/supply-chain/image_pins.py --root /tmp/a14-drift-negctl --drift --fail-on-drift
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED — the drift gate exited 0 on a fixture with a KNOWN-wrong digest on a resolvable (Docker Hub) registry. Resolvable drift is not being enforced; the gate below is a no-op. Do not merge."
            exit 1
          fi
          echo "negative control OK — the drift gate exits ${rc} on a deliberately drifted resolvable pin."

      # THE DRIFT REPORT (W3-8, issue #431; posture updated — pinned-base drift is ADVISORY). Three-valued,
      # not two: a pin on a registry the resolver CAN query (Docker Hub) that has MOVED is resolvable drift;
      # a pin on any other registry is an explicit UNKNOWN, written to the job summary ($GITHUB_STEP_SUMMARY)
      # and NEVER a silent `??` pass.
      #
      # POSTURE: resolvable drift on an already-digest-pinned base is ADVISORY here (surfaced, NOT blocking) —
      # this step runs `--drift` WITHOUT `--fail-on-drift`. The digest pin already guarantees a reproducible
      # build (a moved TAG does not change the bytes that ship), so blocking every open PR on upstream tag
      # movement is toil, not signal. Drift stays fully visible — this report, the $GITHUB_STEP_SUMMARY block,
      # and the scheduled-supply-chain-scan job — and pins are re-advanced DELIBERATELY on a cadence (read the
      # upstream changelog first).
      #
      # WHAT STILL BLOCKS: an UNPINNED image — the `--check` step above — which is the real supply-chain
      # guarantee (content-addressed reproducibility). The `--fail-on-drift` MECHANISM is retained and proven
      # live by the negative-control step above; a stricter operator can re-add `--fail-on-drift` here (or
      # `--fail-on-unknown`) to make drift block again.
      - name: base-image drift — resolvable drift is ADVISORY (unpinned still blocks); UNKNOWN reported (W3-8)
        if: always()
        run: python3 infra/supply-chain/image_pins.py --drift

      # ------------------------------------------------------------------------------
      # 2. Dependency locks. Regeneration comes FIRST and its output is uploaded
      #    unconditionally, so that when the drift check fails the very next step, the
      #    correct file to commit is already an artifact of the failing run.
      # ------------------------------------------------------------------------------

      - name: regenerate both locks (harvestable artifact)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _a14_locks
          root="$PWD"
          # regen <cwd> <in-relative-to-cwd> <committed-relative-to-cwd> <out-abs>
          #
          # The CWD is a parameter, and it MATTERS: pip-compile's `# via -r <path>`
          # annotations are written relative to the directory it ran in, so regenerating the
          # same lock from a different directory produces a byte-different file and a
          # spurious "stale lock" failure. Each lock therefore has ONE canonical CWD — the
          # one its own documented regeneration command assumes — and both the regeneration
          # here and the verifier below use it.
          regen() {
            local cwd="$1" src="$2" committed="$3" out="$4"
            ( cd "$cwd"
              # Seed from the committed lock when one exists: without --upgrade, pip-compile
              # keeps pins that still satisfy the input, so a later diff means "the .in file
              # changed", not "someone published to PyPI today".
              if [ -f "$committed" ]; then cp "$committed" "$out"; fi
              pip-compile --quiet --generate-hashes --no-header --strip-extras \
                          --output-file="$out" "$src" )
            echo "::group::$out ($(grep -cE '^[A-Za-z0-9._-]+==' "$out") pinned requirements)"
            cat "$out"
            echo "::endgroup::"
          }
          # offense: canonical CWD is engine/crucible (see framework/v2/requirements.in).
          regen "$root/engine/crucible" \
                framework/v2/requirements.in \
                framework/v2/requirements.lock.txt \
                "$root/_a14_locks/requirements.lock.txt"
          # sovereign: canonical CWD is the repo root (see infra/supply-chain/sovereign.in).
          regen "$root" \
                infra/supply-chain/sovereign.in \
                infra/supply-chain/sovereign.lock.txt \
                "$root/_a14_locks/sovereign.lock.txt"

      - name: upload regenerated locks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a14-regenerated-locks
          path: _a14_locks/
          if-no-files-found: warn

      # bin/verify-supply-chain.sh had ZERO callers before A14 — a verification script nothing
      # runs verifies nothing. This is its caller of record. It checks: the .in resolves; the
      # lock is present, hash-pinned and not a placeholder; the lock is current w.r.t. the .in;
      # and a CycloneDX SBOM regenerated from the lock agrees with it component-for-component.
      - name: verify OFFENSE lock (engine/crucible) + SBOM cross-check
        working-directory: engine/crucible
        run: |
          bash bin/verify-supply-chain.sh \
            --report-upgrades \
            --sbom-out=../../_a14_sbom/sbom-offense.cdx.json

      # verify-supply-chain.sh above cross-checks a per-run TEMP SBOM against the lock; it never
      # reads the committed framework/v2/sbom.json. That committed SBOM was a hand-written
      # scaffold (a "0000-00-00T00:00:00Z" timestamp, a "scaffold (operator regenerates...)"
      # tool name, dependency RANGES instead of resolved pins) for the repo's whole history,
      # while SECURITY.md claimed it was drift-checked. gen_sbom.py regenerates it from the lock
      # (stdlib only — no cyclonedx-bom needed on the runner); --check re-derives it and fails if
      # the committed file drifts from the lock or still carries the scaffold sentinel/zero
      # timestamp, so it can never silently rot back into a placeholder.
      - name: committed OFFENSE sbom.json matches the lock (no scaffold regression)
        working-directory: engine/crucible
        run: python3 -m framework.v2.tools.gen_sbom --check

      # The two SBOMs above describe the Python DEPENDENCY closure. The Strix offense-agent
      # runs targets inside a CONTAINER image (vigil/strix-sandbox:local, ~1000 deb packages plus
      # a Go/npm/pip/pipx/binary toolchain) that had no SBOM at all (S5; Part III requires
      # dependency AND container SBOMs). gen_image_sbom.py introspects the BUILT image and commits
      # infra/supply-chain/sbom-strix-sandbox.cdx.json — committed, not per-run regenerated,
      # because the 7GB image is not in git and cannot be rebuilt on a PR runner. --check is the
      # OFFLINE drift guard: it ties the committed SBOM to the Dockerfile hash, the base-image
      # FROM ref and the STRIX_IMAGE runtime ref, so a Dockerfile change that is not accompanied by
      # a regenerated SBOM fails the build. Regenerate with `python3 infra/supply-chain/gen_image_sbom.py`
      # (needs docker + the built image; see docs/SUPPLY-CHAIN.md § 3a).
      - name: committed Strix sandbox image SBOM is present and current (offline drift guard)
        if: always()
        run: python3 infra/supply-chain/gen_image_sbom.py --check

      # Same implementation, different pair. env-sovereign and env-offense must never share an
      # interpreter (FATAL-2), so they cannot share a resolution either — hence two locks.
      - name: verify SOVEREIGN lock (vigil_core + apps/sigil) + SBOM cross-check
        env:
          REQ_IN: infra/supply-chain/sovereign.in
          REQ_LOCK: infra/supply-chain/sovereign.lock.txt
        run: |
          bash engine/crucible/bin/verify-supply-chain.sh \
            --report-upgrades \
            --sbom-out=_a14_sbom/sbom-sovereign.cdx.json

      # ------------------------------------------------------------------------------
      # 3. The hashes have to actually WORK. A lock full of hashes that pip rejects is a
      #    document, not a control. `--require-hashes` makes pip refuse the entire file if
      #    any requirement is unpinned or any artifact's digest does not match.
      # ------------------------------------------------------------------------------

      - name: prove `pip install --require-hashes` succeeds (offense lock) + record resolved vs lock
        run: |
          set -euo pipefail
          python -m venv /tmp/a14-offense
          /tmp/a14-offense/bin/pip install --require-hashes \
            -r engine/crucible/framework/v2/requirements.lock.txt
          /tmp/a14-offense/bin/python -c "import pydantic, httpx, cryptography, packaging; print('offense lock installs under --require-hashes')"
          # W3-2 acceptance: RECORD the resolved versions and COMPARE them to the committed lock.
          # --require-hashes already forces resolved==locked (pip installs exactly the pinned ==),
          # so this is the belt-and-braces assertion of that invariant: it FAILS loudly if the CI
          # environment ever diverges from the lock (e.g. a pre-installed runner package shadowing it).
          /tmp/a14-offense/bin/pip freeze > /tmp/a14-offense-resolved.txt
          echo "::group::offense — resolved (pip freeze) vs lock, per pinned package"
          python .github/scripts/compare_resolved_to_lock.py \
            engine/crucible/framework/v2/requirements.lock.txt /tmp/a14-offense-resolved.txt
          echo "::endgroup::"

      - name: prove `pip install --require-hashes` succeeds (sovereign lock)
        run: |
          set -euo pipefail
          python -m venv /tmp/a14-sovereign
          /tmp/a14-sovereign/bin/pip install --require-hashes \
            -r infra/supply-chain/sovereign.lock.txt
          /tmp/a14-sovereign/bin/python -c "import cryptography, pydantic, qdrant_client; print('sovereign lock installs under --require-hashes')"

      - name: prove `pip install --require-hashes` succeeds (ci-tooling lock, W3-2)
        run: |
          set -euo pipefail
          python -m venv /tmp/a14-tooling
          /tmp/a14-tooling/bin/pip install --require-hashes \
            -r infra/supply-chain/ci-tooling.lock.txt
          /tmp/a14-tooling/bin/python -c "import pytest, pytest_asyncio; print('ci-tooling lock installs under --require-hashes')"
          /tmp/a14-tooling/bin/ruff --version
          /tmp/a14-tooling/bin/mypy --version

      # W3-10 (issue #433): the PEP 517 BUILD backends are hash-locked too. Prove the lock installs under
      # --require-hashes (which refuses the whole file if a single line is unpinned/unhashed) and that the
      # backends actually import — envs/build_envs.sh installs exactly this, then builds every member with
      # --no-build-isolation so no backend is ever fetched fresh under isolation.
      - name: prove `pip install --require-hashes` succeeds (build-backends lock, W3-10)
        run: |
          set -euo pipefail
          python -m venv /tmp/a14-backends
          /tmp/a14-backends/bin/pip install --require-hashes \
            -r infra/supply-chain/build-backends.lock.txt
          /tmp/a14-backends/bin/python -c "import hatchling, setuptools, wheel, setuptools_rust, editables; print('build-backends lock installs under --require-hashes')"

      # W3-10 (issue #433): the NON-PYTHON locks are verified, not merely scanned. This is the LIVE,
      # authoritative regenerate-and-diff — `uv lock --check` (on a copy outside the uv workspace, the
      # same trick gen-strix-lock.sh uses) for vendor/strix/uv.lock, and `cargo metadata --locked` for
      # apps/sigil/kernel/Cargo.lock — each exits non-zero if regenerating the lock would change it.
      # The OFFLINE half (every direct dep is pinned in its lock) runs with no toolchain in the required
      # integration + A14 jobs via integration/tests/test_supply_chain.py. cargo ships on ubuntu-latest;
      # uv is version-pinned so the check resolves against the same uv that produced the committed lock.
      - name: install pinned uv (for the uv.lock regenerate-check)
        run: python -m pip install "uv==0.11.29"

      - name: non-Python locks are current (uv.lock + Cargo.lock regenerate-and-diff, W3-10)
        run: python3 infra/supply-chain/verify_native_locks.py --regenerate-check

      - name: upload SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a14-sbom-cyclonedx
          path: _a14_sbom/
          if-no-files-found: warn

      # ------------------------------------------------------------------------------
      # 4. Vulnerability scan.
      # ------------------------------------------------------------------------------

      - name: install trivy (version- and sha256-pinned)
        if: always()
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: cache the trivy vulnerability DB
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ env.TRIVY_VERSION }}-

      # Full picture first, always, so the log shows what is being ACCEPTED as well as what is
      # being blocked. MEDIUM and below are reported, not enforced (see the threshold note
      # above); HIGH and CRITICAL are enforced by the gate at the end of this section.
      #
      # --file-patterns is load-bearing, not tuning. Trivy's pip analyzer matches by FILENAME,
      # so out of the box it scans apps/sigil/requirements.txt but silently skips
      # `*.lock.txt` — which is to say, it skipped both of the locks this job exists to
      # produce. A gate that does not scan the artifacts the change adds is hollow.
      - name: vulnerability report — full picture (ADVISORY, never blocks)
        if: always()
        continue-on-error: true
        run: |
          trivy fs --scanners vuln \
            --file-patterns 'pip:.*\.lock\.txt$' \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 0 \
            --no-progress \
            .

      # NEGATIVE CONTROL, and it runs BEFORE the gate on purpose.
      #
      # The gate below passes with an EMPTY allow-list, because this tree has no HIGH or
      # CRITICAL findings. That is the right outcome, but it is indistinguishable from a
      # misconfigured scanner that reports nothing — a typo in a flag, a scanner that silently
      # found no files, a severity string that matches nothing. So: run the EXACT blocking
      # configuration against fixtures with KNOWN findings and require it to FAIL. If it
      # passes, the gate is a no-op and this job says so instead of shipping a green tick. The
      # fixtures live outside the repo so the real scan never sees them.
      #
      # TWO fixtures, because the threshold moved from CRITICAL-only to HIGH+CRITICAL (W3-9,
      # issue #432) and the control has to prove the RAISE, not just that the scanner fires:
      #   1. a known-CRITICAL fixture — the blocking config must fail on it (as before);
      #   2. a HIGH-only fixture (pyasn1==0.6.3: trivy reports 3 HIGH, 0 CRITICAL, fixed in
      #      0.6.4 — exactly the class this PR bumped out of the vendored tree). The gate
      #      severity (HIGH,CRITICAL) must FAIL on it, AND the OLD severity (CRITICAL-only)
      #      must PASS on it. That pair is the proof that a HIGH now blocks where it did not
      #      before — a plain "scanner fires on CRITICAL" control cannot distinguish the two.
      - name: negative control — prove the blocking configuration actually fires
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/a14-negative-control /tmp/a14-negative-control-high
          printf 'pyyaml==5.3.1\npillow==8.2.0\n' > /tmp/a14-negative-control/requirements.txt
          printf 'pyasn1==0.6.3\n' > /tmp/a14-negative-control-high/requirements.txt

          # (1) known-CRITICAL fixture: the blocking config MUST fail.
          set +e
          trivy fs --scanners vuln \
            --file-patterns 'pip:.*\.lock\.txt$' \
            --severity HIGH,CRITICAL \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
            --exit-code 1 \
            --no-progress \
            /tmp/a14-negative-control
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED — the blocking trivy configuration exited 0 on a fixture with known-CRITICAL packages. The gate below cannot fail, so its green tick means nothing. Fix the scanner configuration; do not merge."
            exit 1
          fi
          echo "negative control (1/2) OK — the blocking configuration exits ${rc} on known-CRITICAL input."

          # (2a) HIGH-only fixture at the GATE severity: MUST fail (a HIGH blocks now).
          set +e
          trivy fs --scanners vuln \
            --file-patterns 'pip:.*\.lock\.txt$' \
            --severity HIGH,CRITICAL \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
            --exit-code 1 \
            --no-progress \
            /tmp/a14-negative-control-high
          rc_high=$?
          set -e
          if [ "$rc_high" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED — the HIGH+CRITICAL gate exited 0 on a fixture with a known-HIGH package (pyasn1==0.6.3). The raise to HIGH is not being enforced. Do not merge."
            exit 1
          fi

          # (2b) SAME HIGH-only fixture at the OLD CRITICAL-only severity: MUST pass. This is
          # what proves the finding is HIGH, not CRITICAL — i.e. the pre-W3-9 gate would have
          # let it through, and the raise is doing real work.
          set +e
          trivy fs --scanners vuln \
            --file-patterns 'pip:.*\.lock\.txt$' \
            --severity CRITICAL \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
            --exit-code 1 \
            --no-progress \
            /tmp/a14-negative-control-high
          rc_crit=$?
          set -e
          if [ "$rc_crit" -ne 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED — the CRITICAL-only config did NOT exit 0 on the HIGH-only fixture; the fixture is no longer HIGH-not-CRITICAL, so it cannot demonstrate the raise. Pick a fresh HIGH-only fixture."
            exit 1
          fi
          echo "negative control (2/2) OK — HIGH-only fixture FAILS at HIGH,CRITICAL (rc=${rc_high}) and PASSES at CRITICAL-only (rc=${rc_crit}): the raise to HIGH blocks a finding the old gate missed."

      # THE GATE. A non-zero exit here fails the job and blocks the pull request.
      - name: vulnerability GATE — HIGH + CRITICAL block
        if: always()
        run: |
          trivy fs --scanners vuln \
            --file-patterns 'pip:.*\.lock\.txt$' \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --no-progress \
            .

      # ------------------------------------------------------------------------------
      # 4a. Container IMAGE scan (W3-7 #430).
      #
      # `trivy fs` above scans the SOURCE tree; it never scans a BUILT image, so the OS-package layer
      # of the image that actually ships was never looked at. This section BUILDS the first-party
      # gateway image, tags it by its CONTENT ADDRESS (so a stale image is detectable by tag alone —
      # the same digest `vigil services up` and the #511 runtime check use), and `trivy image`-scans it
      # at the SAME HIGH+CRITICAL threshold as the filesystem gate. `--ignore-unfixed` is the one
      # deliberate difference: an unfixable CVE in the upstream base is not a defect the author can fix
      # under a red build (the exact way an image gate gets switched off), while a FIXABLE HIGH/CRITICAL
      # — where bumping the pinned base is the remedy — still blocks.
      # ------------------------------------------------------------------------------

      - name: build the gateway image (content-addressed tag)
        if: always()
        run: |
          set -euo pipefail
          # The tag encodes a sha256 of the build context, so a source change flips the tag and an
          # unchanged context yields the same tag — a stale image is detectable BY TAG ALONE (#430).
          TAG="$(python3 infra/supply-chain/image_pins.py --context-tag)"
          echo "GATEWAY_IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "building ${TAG} from ./gateway"
          docker build -t "${TAG}" gateway
          docker image inspect "${TAG}" --format 'built {{.RepoTags}} id={{.Id}}'

      # NEGATIVE CONTROL, before the image gate, exactly as the filesystem gate has one. Build a tiny
      # image carrying a deliberately vulnerable layer (a requirements.txt trivy's image analyzer reads,
      # pinned to the same known-CRITICAL packages the fs control uses, both FIXED upstream so
      # --ignore-unfixed still reports them) and require the EXACT blocking `trivy image` config to
      # FAIL on it. If it passes, the image gate below is a no-op and this job says so. The fixture
      # lives OUTSIDE the repo so the real scan never sees it, and reuses the already-pulled gateway
      # base so it needs no extra registry pull.
      - name: negative control — prove the image scan configuration actually fires
        if: always()
        run: |
          set -euo pipefail
          # Reuse the gateway's own pinned base (already pulled by the build step) so the fixture needs
          # no extra registry pull. grep/cut, not a heredoc: an un-indented heredoc body breaks the YAML
          # block scalar this step lives in.
          BASE="$(grep -oE 'ARG PYTHON_BASE=\S+' gateway/Dockerfile | head -1 | cut -d= -f2-)"
          if [ -z "${BASE}" ]; then echo "::error::could not read PYTHON_BASE from gateway/Dockerfile"; exit 1; fi
          mkdir -p /tmp/a14-image-negative-control
          printf 'pyyaml==5.3.1\npillow==8.2.0\n' > /tmp/a14-image-negative-control/requirements.txt
          # Build the fixture Dockerfile with printf (no heredoc: an indented closing token inside a
          # YAML block scalar is a foot-gun). A copied requirements.txt is a vulnerable image LAYER the
          # trivy image analyzer reads.
          printf 'FROM %s\nCOPY requirements.txt /app/requirements.txt\n' "${BASE}" \
            > /tmp/a14-image-negative-control/Dockerfile
          docker build -t vigil-a14-image-negctl:local /tmp/a14-image-negative-control
          set +e
          trivy image --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
            --exit-code 1 \
            --no-progress \
            vigil-a14-image-negctl:local
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::NEGATIVE CONTROL FAILED — the blocking \`trivy image\` configuration exited 0 on an image carrying known-CRITICAL packages. The image gate below cannot fail, so its green tick means nothing. Do not merge."
            exit 1
          fi
          echo "image negative control OK — the blocking config exits ${rc} on a known-vulnerable image."

      # THE IMAGE GATE. A non-zero exit here fails the job and blocks the pull request.
      - name: image vulnerability GATE — HIGH + CRITICAL (fixable) block
        if: always()
        run: |
          set -euo pipefail
          : "${GATEWAY_IMAGE_TAG:?the gateway image build step did not run}"
          trivy image --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --no-progress \
            "${GATEWAY_IMAGE_TAG}"

      # The Strix sandbox image (~7GB Kali + ~1000 deb packages) cannot be BUILT on a PR runner, so it
      # cannot be `trivy image`-scanned here. Its committed CycloneDX SBOM (infra/supply-chain/
      # sbom-strix-sandbox.cdx.json, drift-guarded offline against the Dockerfile) enumerates that
      # OS-package layer, and `trivy sbom` scans those purls — a real scan of the layer that ships,
      # short of a live image build. ADVISORY on purpose: a security-testing distro carries findings the
      # author cannot fix, so blocking on it would switch the gate off. A live `trivy image` build of
      # this image is a self-hosted/large-runner follow-up (see docs/SUPPLY-CHAIN.md §4a).
      - name: Strix sandbox image SBOM scan (ADVISORY — the layer that ships, via its SBOM)
        if: always()
        continue-on-error: true
        run: |
          trivy sbom \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 0 \
            --no-progress \
            infra/supply-chain/sbom-strix-sandbox.cdx.json

      # ------------------------------------------------------------------------------
      # 5. The static assertions, run here too so this one job is a self-contained
      #    statement of the A14 posture. `if: always()` so a failure earlier still tells
      #    the author everything that is wrong, not just the first thing.
      # ------------------------------------------------------------------------------

      - name: static A14 assertions
        if: always()
        run: python -m pytest integration/tests/test_supply_chain.py -q
