# Pre-commit gate, mirrored into CI (W2-5, #422).
#
# The .pre-commit-config.yaml hooks run locally on `git commit`, but a developer can bypass them with
# `git commit --no-verify`. This workflow re-runs the SAME hooks on the pull request, where they cannot
# be skipped — so the local hook is a convenience, not the only line of defence. It is ADVISORY: it is
# deliberately NOT in .github/required-status-checks.txt (that set is governed by W0-1/#396 and W0-2/
# #397 and stays byte-identical here). Third-party Actions are pinned to a commit SHA.
name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit hooks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.13"

      # System tools the LOCAL hooks shell out to (mypy + its sigil import deps, yamllint, pytest),
      # plus pre-commit itself. The remote hook repos (pre-commit-hooks, ruff, gitleaks) are fetched
      # and built by pre-commit into their own isolated environments.
      - name: install pre-commit + the tools the local hooks invoke
        run: |
          # W3-2: runtime deps from the committed HASH LOCK (== the shipped tree; CI once installed
          # cryptography>=42 under a >=50 CVE floor); pytest+mypy from the pinned CI toolchain lock.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
          # yamllint + pre-commit orchestrate the hook run itself (not the tested tree); they are the
          # only CI-only tools not in a committed lock — pre-commit fetches ruff/gitleaks into its own
          # isolated envs, so pinning them here would not change what those hooks run.
          pip install yamllint pre-commit

      # POSITIVE PATH — every hook must be green on the tree. This is the check a `--no-verify` commit
      # cannot escape.
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure --color always

      # The gitleaks pre-commit hook scans STAGED changes (right for a commit; on a fresh CI checkout
      # nothing is staged). This step adds the FULL-TREE secret scan the hook cannot do here, using the
      # pinned release binary verified against its published SHA-256. Green on the current tree.
      - name: full-tree secret scan (gitleaks over the whole repo)
        run: |
          set -euo pipefail
          # Pinned to the SAME gitleaks version + invocation the dedicated security-scan.yml gate uses
          # (8.28.0, `detect --no-git`): the older 8.21.2 `dir` subcommand does not honour the
          # `[[allowlists]]` path scoping in .gitleaks.toml and reported the 51 example-fixture secrets
          # the allowlist exists to suppress. Verified: 8.28.0 `detect --no-git` finds no leaks on the tree.
          ver="8.28.0"
          sha="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          echo "${sha}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git -s . -c .gitleaks.toml --redact --exit-code 1 --no-banner

      # NEGATIVE CONTROLS — prove each gate is not a no-op by feeding it deliberately-bad input through
      # the REAL hook and asserting rejection, then cleaning up. If a hook waves the bad input through,
      # the step fails. `if <hook>; then <hook passed bad input>` is the failure branch.
      #
      # NOTE (gitleaks): the gitleaks not-a-no-op proof AND the allowlist-scope proof are covered
      # authoritatively by .github/workflows/security-scan.yml (#420, W2-3) — it plants a secret in
      # shipped source (must be CAUGHT) and the same secret under a tests/ path (must be ALLOWLISTED),
      # both with the sha256-pinned 8.28.0 binary via `gitleaks detect --no-git`. We deliberately do NOT
      # re-run those two controls through `pre-commit run gitleaks` here: the pre-commit hook's own gitleaks
      # version drives catch-vs-allowlist behaviour, so duplicating the control here would couple this
      # workflow to the hook's pinned version rather than to the config under test. The full-tree scan above
      # (same 8.28.0 binary + config as the gate) is the belt-and-suspenders check for THIS workflow.

      - name: negative control — ruff rejects an undefined name (F821)
        run: |
          set -e
          printf 'def _neg():\n    return undefined_symbol_xyz\n' > apps/sigil/sigil/_negctl_ruff.py
          if pre-commit run ruff --files apps/sigil/sigil/_negctl_ruff.py; then
            echo "::error::negative control FAILED — ruff did not catch F821"; rm -f apps/sigil/sigil/_negctl_ruff.py; exit 1
          fi
          rm -f apps/sigil/sigil/_negctl_ruff.py
          echo "OK: undefined name was rejected"

      - name: negative control — workflow-lint rejects a malformed workflow (duplicate key)
        run: |
          set -e
          printf 'name: bad\non: push\non: pull_request\njobs:\n  a:\n    runs-on: ubuntu-latest\n' > .github/workflows/_negctl.yml
          if pre-commit run workflow-lint --files .github/workflows/_negctl.yml; then
            echo "::error::negative control FAILED — workflow-lint did not catch a duplicate key"; rm -f .github/workflows/_negctl.yml; exit 1
          fi
          rm -f .github/workflows/_negctl.yml
          echo "OK: malformed workflow was rejected"
