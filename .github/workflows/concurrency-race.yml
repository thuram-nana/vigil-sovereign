# Concurrency race detection — the HEAVY, scheduled counterpart to the per-PR concurrency stress (W11-5 #486).
#
# WHAT RUNS ON A PR (required, deterministic, elsewhere):
#   * `SIGIL governor gates` runs apps/sigil/tests/test_spine_concurrency_stress.py (two engagements on one
#     spine + the DETERMINISTIC C-1/#392 interleaving + a genuine-loss negative control) and a shell-loop
#     REPEAT stress that records outcomes into a flake ledger. pytest-xdist/pytest-repeat are NOT in the
#     pinned hash-lock, so repetition there is plugin-free.
#   * `WARDEN Rust kernel` runs `cargo test` (incl. concurrent_appends_get_unique_contiguous_seqs).
#
# WHAT RUNS HERE (scheduled / manual — NOT a required check, deliberately, because it is heavy and needs
# network to install a nightly toolchain + sanitizer runtime):
#   * tsan-warden-kernel — the Rust WARDEN kernel concurrency tests under ThreadSanitizer (a real DATA-RACE
#     detector; `cargo test` alone cannot see a data race, only an observable wrong result). This is the
#     genuinely-heavy half the shared spec says to split out and label honestly: it is wired here, it is
#     NOT claimed to run on every PR, and it was NOT validated in the author's offline sandbox (no network
#     for the nightly + rust-src + compiler-rt install) — see docs/decisions/W11-5-*.md.
#   * python-heavy-stress — the two-engagement spine stress at high iteration/repeat counts, recording the
#     full historical pass-rate ledger as an artifact.
#
# This workflow is SCHEDULE + manual ONLY — it deliberately does NOT trigger on pull_request. The TSan job
# installs a nightly toolchain and rebuilds std with the sanitizer (minutes, network), which must not run on
# every PR; the deterministic, plugin-free per-PR concurrency coverage lives in the required sigil-governor
# and warden-kernel jobs (see the header). Both jobs here are therefore NON-PR advisory jobs, enumerated
# with their reason in docs/tests/test_required_checks_canonical.py::KNOWN_NONPR_ADVISORY.

name: concurrency-race

on:
  schedule:
    - cron: "30 4 * * *"        # daily 04:30 UTC (distinct from livefire 03:00 and supply-chain 06:00)
  workflow_dispatch:
    inputs:
      stress_iters:
        description: "SIGIL_STRESS_ITERS for the python-heavy-stress job"
        required: false
        default: "25"
      stress_repeat:
        description: "shell-loop repeats for the python-heavy-stress job"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tsan-warden-kernel:
    name: TSan — WARDEN Rust kernel concurrency (scheduled, heavy)
    # HEAVY: installs a nightly toolchain + rust-src and rebuilds std with the thread sanitizer. Not a
    # required check; scheduled-only; NOT validated in the author's offline sandbox (no network for the
    # nightly + rust-src + compiler-rt install — see docs/decisions/W11-5-*.md). On the schedule it is
    # authoritative and fails loudly.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install a nightly toolchain with rust-src (for -Zbuild-std) + the sanitizer
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustc +nightly --version
      - name: cargo test the kernel under ThreadSanitizer
        working-directory: apps/sigil/kernel
        env:
          # TSan needs std rebuilt WITH the sanitizer (-Zbuild-std) for a specific target triple.
          RUSTFLAGS: "-Zsanitizer=thread"
          RUSTDOCFLAGS: "-Zsanitizer=thread"
          # TSan's own knobs: exit non-zero (fail the job) on the FIRST detected race, and give a full report.
          TSAN_OPTIONS: "halt_on_error=1 exitcode=66 second_deadlock_stack=1"
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::error::apps/sigil/kernel/Cargo.toml missing from the checkout"; exit 1
          fi
          # Run the FULL kernel test suite under TSan (it includes the flock'd concurrent_appends test that
          # spawns 8 threads, and warden.rs's threaded paths). --test-threads>1 so inter-test threads race too.
          cargo +nightly test \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            -- --test-threads=4

  python-heavy-stress:
    name: Python heavy two-engagement spine stress (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: install vigil_core + SIGIL deps (hash-locked) — same closure as sigil-governor
        run: |
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: high-iteration repeat stress + full flake ledger
        env:
          SIGIL_HOME: /tmp/sigil-ci
          SIGIL_STRESS_ITERS: ${{ github.event.inputs.stress_iters || '25' }}
          SIGIL_STRESS_PER: "120"
        run: |
          mkdir -p /tmp/sigil-ci
          cp docs/flake/ledger.jsonl "$RUNNER_TEMP/flake-ledger.jsonl"
          PYTHONPATH=apps/sigil python tools/flake/run_and_record.py \
            --target apps/sigil/tests/test_spine_concurrency_stress.py \
            --repeat "${{ github.event.inputs.stress_repeat || '20' }}" \
            --run-id "sched-${GITHUB_RUN_ID:-local}" \
            --ledger "$RUNNER_TEMP/flake-ledger.jsonl"
      - name: publish the enriched flake ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-ledger-heavy-stress
          path: ${{ runner.temp }}/flake-ledger.jsonl
          if-no-files-found: warn
