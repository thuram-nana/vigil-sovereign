  strix-vigil:
    name: strix Claude-runtime (P8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pytest (hash-locked) + best-effort SDK (so reasoning/dedup tests run, not just skip)
        run: |
          # W3-2: the harness (pytest) is pinned in the committed CI toolchain lock.
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
          # openai-agents[litellm] + openai let the reasoning/dedup tests actually execute
          # (red-pen P8 finding 3). Best-effort AND deliberately UNPINNED: this heavy live-scan SDK is
          # not part of the tested tree — if it cannot resolve, those two tests importorskip and the
          # job is honest about it. (Locking it is [W3-6]'s strix.lock surface, not this slice.)
          pip install "openai-agents[litellm]" openai || echo "SDK unavailable — reasoning/dedup tests will skip"
      - name: strix vigil tests (Anthropic price table + reasoning + dedup fallback)
        run: |
          if [ -d vendor/strix/tests_vigil ]; then
            PYTHONPATH=vendor/strix python -m pytest vendor/strix/tests_vigil -q
          else
            # STRICT branch protection ⇒ a mergeable PR is up to date with main and this committed
            # vendored monorepo path always exists; its absence means a rename/deletion — fail RED, never skip GREEN.
            echo "::error::vendor/strix/tests_vigil missing from the checkout"; exit 1
          fi

  sigil-governor:
    name: SIGIL governor gates (P7 — offense gate + authn)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core + SIGIL deps (hash-locked) — W3-2 (governor tests are pure-Python)
        run: |
          # W3-2: runtime third-party deps from the committed HASH LOCK, pytest from the pinned CI
          # toolchain lock. The offense framework lock is used deliberately: it is the LIGHT runtime
          # closure (the sovereign lock drags in the kuzu/onnxruntime/qdrant ML stack this pure-Python
          # job does not need), it holds ONLY third-party packages — no framework/sigil, so FATAL-2 is
          # untouched — and its shared versions are byte-identical to the sovereign lock (asserted by
          # integration/tests/test_supply_chain.py::test_shared_runtime_versions_agree_across_locks),
          # so the governor is tested against the same cryptography/pydantic it ships with.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: offense gate + hardening + finding receiver (P7 governance + P10 two-anchor ingest)
        env:
          SIGIL_HOME: /tmp/sigil-ci
        run: |
          mkdir -p /tmp/sigil-ci
          if [ -f apps/sigil/tests/test_offense_gate.py ]; then
            # DEFECT-5 STRUCTURAL FIX: run the WHOLE apps/sigil/tests/ directory, not a hand-maintained
            # explicit file list. That list silently DRIFTED — 56 of ~94 sovereign test files (e.g.
            # test_floor_witness, test_ha_failover_guard, test_governance_replay_guard, the
            # test_snapshot_fold_* family, test_login_pop) were never named, so they never ran in CI at all.
            # Running the directory means a NEW test file is AUTO-INCLUDED — it can only fail LOUDLY, never
            # silently skip. test_ci_sigil_tests_all_run.py guards this invariant + the --ignore honesty.
            #
            # --ignore list: EMPTY. Grep-triage of every apps/sigil/tests/test_*.py (NOT "it passed on Kali")
            # found NO file that needs a resource ubuntu-latest lacks: all network is loopback(127.0.0.1) or
            # monkeypatched (urlopen/_do_open/httpx/FakeEngine/Dict*Source/injected fetch); heavy deps
            # (numpy/cv2/qdrant/fastembed/boto3/kuzu/onnxruntime) are lazy or importorskip-guarded — the only
            # unindented heavy import in the source, numpy in voice/backends, is reached by no test at import
            # time; every third-party import in the suite (cryptography/httpx/pydantic/PyYAML) is installed
            # above; external CLIs are base git (identity set in-test) / python (sys.executable) or
            # shutil.which-guarded (node). Per doctrine "prefer running; a loud CI failure beats a silent
            # skip", nothing is excluded. If a future test truly needs an absent resource, add
            # `--ignore=apps/sigil/tests/<f>` AND a KNOWN_EXCLUDED reason in the guard — it fails on any
            # mismatch, so an undocumented ignore can never re-introduce a silent skip.
            #
            # integration on the path for the P10 finding-receiver (it uses vigil_integration.inert_finding,
            # which is sovereign-safe = vigil_core only, so no offense engine is pulled).
            PYTHONPATH=apps/sigil:integration python -m pytest apps/sigil/tests/ \
              --ignore=apps/sigil/tests/test_robustness.py \
              --ignore=apps/sigil/tests/test_graph.py -q
          else
            # STRICT branch protection ⇒ a mergeable PR is up to date with main and this committed
            # monorepo path always exists; its absence means a rename/deletion — fail RED, never skip GREEN.
            echo "::error::apps/sigil/tests/test_offense_gate.py missing from the checkout"; exit 1
          fi

  sigil-lint:
    name: SIGIL lint (ruff blocking + mypy can-complete)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ruff and mypy were declared as dev extras but NEVER run in CI. A "# type:" PROSE comment in
    # settings.py was parsed as a PEP 484 type comment and ABORTED mypy for the whole package ("mypy cannot
    # complete") while ruff stayed green — it shipped precisely because neither tool ran here. This job
    # wires both in: ruff is FULLY BLOCKING (E9/F/B real bug classes, green today); mypy is a CAN-COMPLETE
    # gate — it fails ONLY if mypy cannot finish (exit 2: a parse/type-comment/config abort, the class just
    # fixed), NOT on the pre-existing type errors it now surfaces (exit 1). Reducing that type-error debt is
    # a tracked follow-on; this gate keeps mypy RUNNABLE, it does not claim type-cleanliness.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install ruff + mypy (hash-locked) + sigil deps — W3-2
        run: |
          # W3-2: runtime third-party deps from the committed HASH LOCK; ruff+mypy from the pinned CI
          # toolchain lock (same lock the ruff/mypy versions are pinned in, so the lint behaviour that
          # runs here is the validated one). See the governor step / docs/SUPPLY-CHAIN.md §2.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: ruff (BLOCKING — E9/F/B real bug classes)
        working-directory: apps/sigil
        run: ruff check sigil
      - name: mypy must be able to COMPLETE (guards the parse-abort class; type-error debt not gated here)
        working-directory: apps/sigil
        run: |
          set +e
          python -m mypy sigil; rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::mypy could NOT complete (exit 2) — a parse/type-comment/config abort regressed"
            exit 1
          fi
          echo "mypy completed (exit $rc). Pre-existing type-error debt is surfaced above and tracked as a follow-on, not gated here."
          exit 0

  formal-verification:
    name: formal (TLA+ core-invariant model check, F1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Persist the PINNED tla2tools.jar across runs. When the GitHub release CDN
      # (objects.githubusercontent.com) has an incident — as it did 2026-08-21, reddening F1 on main and
      # every PR for ~40m — a warm cache lets check.sh short-circuit WITHOUT any network fetch. The key is
      # derived from check.sh (which carries the sha256 pin), so a pin change busts the cache; and check.sh
      # re-verifies sha256 on whatever it restores, so a stale/wrong cached jar is rejected and re-fetched —
      # the supply-chain pin stays authoritative regardless of the cache.
      - name: Cache the pinned tla2tools.jar
        uses: actions/cache@v4
        with:
          path: formal/.tla2tools.jar
          key: tla2tools-${{ hashFiles('formal/check.sh') }}
      - name: TLC model-check the four core invariants + their mutants
        run: |
          if [ -f formal/check.sh ]; then
            # check.sh uses a PINNED, sha256-verified tla2tools.jar: a warm cache short-circuits; a cache
            # miss fetches from the release CDN (with a bounded, sha-re-verifying retry loop for transient
            # truncation), then the post-job cache save persists it for the next run.
            bash formal/check.sh
          else
            # STRICT branch protection ⇒ a mergeable PR is up to date with main and this committed
            # monorepo path always exists; its absence means a rename/deletion — fail RED, never skip GREEN.
            echo "::error::formal/check.sh missing from the checkout"; exit 1
          fi

  warden-kernel:
    name: WARDEN Rust kernel (A10 durability)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: cargo test the WARDEN kernel (chain/head/anti-rollback/tiers/router/registry/crypto + A10 durability)
        run: |
          if [ -f apps/sigil/kernel/Cargo.toml ]; then
            # GitHub ubuntu runners ship a stable Rust toolchain. Run the FULL kernel test suite — the
            # #[test]s the audit (A10) flagged as never wired into CI, now including the durability
            # regressions: the concurrent-append flock (unique/contiguous seqs, no duplicate under a
            # race), the atomic head write (no torn temp), and the de-hardcoded interpreter path. A
            # release build proves the binary compiles clean.
            cd apps/sigil/kernel
            cargo test
            cargo build --release
          else
            # STRICT branch protection ⇒ a mergeable PR is up to date with main and this committed
            # monorepo path always exists; its absence means a rename/deletion — fail RED, never skip GREEN.
            echo "::error::apps/sigil/kernel/Cargo.toml missing from the checkout"; exit 1
          fi
