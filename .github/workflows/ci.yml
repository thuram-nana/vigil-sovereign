name: vigil-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vigil-core:
    name: vigil_core — shared integrity substrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core (hash-locked runtime + pinned pytest) — W3-2
        run: |
          # W3-2: the RUNTIME tree comes from the committed HASH LOCK so the tested tree equals the
          # shipped/locked tree (CI once installed cryptography>=42 under a >=50 CVE floor). The
          # offense framework lock is the light third-party runtime closure — no framework/sigil
          # package, so FATAL-2 is untouched — and its shared versions are byte-identical to the
          # sovereign lock (asserted by integration/tests/test_supply_chain.py). vigil_core is
          # first-party → editable --no-deps (its floors resolve to the already-locked versions,
          # never fresh). pytest is pinned in the CI toolchain lock, not resolved at run time.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: migration-safety tests (v1 byte-identical signing, threshold, tamper)
        run: pytest packages/core/vigil_core/tests -q

  briefing-completeness:
    name: the briefing explains every agent and capability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reads files only — imports neither trust domain — so it needs no environment and is safe
    # to run anywhere. It exists because the plain-English briefing silently fell a whole half of
    # the system behind the code once, and prose cannot promise not to do that again.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # W3-2: even a reads-only job installs its harness from the committed hash lock, so nothing
      # in CI resolves a package fresh from PyPI.
      - run: pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: every agent and named capability the code declares is explained to a reader
        run: pytest docs/tests -q

  crucible-core:
    name: CRUCIBLE core on vigil_core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install engine deps + vigil_core
        run: |
          # W3-2: runtime from the committed HASH LOCK (== the shipped tree), pytest+asyncio from the
          # pinned CI toolchain lock; vigil_core editable --no-deps. pytest-httpserver ships in the
          # runtime lock. See the vigil_core step above / docs/SUPPLY-CHAIN.md §2 for the rationale.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: the whole engine v2 test tree (eval split to crucible-eval; every tests dir covered by construction)
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: |
          # Run the WHOLE framework/v2 tree, NOT a hand-maintained path list. A hand list silently DRIFTED:
          # of the 40 test directories under framework/v2 only a subset were named, so ~13 suites
          # (agents/tools, imports, improve, intake, intruder, knowledge, mcp, plugins, repeater,
          # socialdefense, the top-level framework/v2/tests, plus most of agents/ and intel/) never ran in CI
          # at all. "A skipped proof and a passing proof are the same colour on a dashboard." Wholesale means
          # a NEW suite is AUTO-INCLUDED and can only fail loudly, never silently skip; a path that collects
          # nothing makes pytest exit 5 and fails the job — coverage by construction.
          #
          # framework/v2/tests/test_ci_crucible_core_covers_all_suites.py is the coverage guard: it runs
          # inside THIS very pytest invocation and asserts every framework/v2/**/tests dir is covered here or
          # is one of the two documented --ignore exclusions below (its KNOWN_EXCLUDED set must EQUAL them, so
          # an undocumented ignore — a silent dark dir — fails the run).
          #
          # Two documented exclusions (see that guard's KNOWN_EXCLUDED for the full reasons):
          #   * eval — the one expensive suite (~2.5 min: corpus + committed recall/precision baselines +
          #     determinism re-run + soak). It runs WHOLESALE in the separate, also-required `crucible-eval`
          #     job; --ignore'd here to avoid double-running it (the accuracy gate stays required, via that
          #     job).
          #   * console/.../test_chat_inject.py — imports the vigil_integration (integration/) package at RUN
          #     time (unlike its console siblings, which module-level importorskip it and skip cleanly).
          #     crucible-core deliberately does not install the integration package (two-env boundary), so
          #     these 4 tests only pass when scanner's test_claim_discipline happens to run first and inserts
          #     integration/ onto sys.path — a fragile cross-suite ordering the wholesale (filesystem-order)
          #     run does not provide. Excluded so this job stays order-independent.
          pytest framework/v2 \
                 --ignore=framework/v2/eval \
                 --ignore=framework/v2/console/tests/test_chat_inject.py -q

  crucible-eval:
    name: CRUCIBLE eval + benchmark corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The SPLIT half of the CI-coverage fix. framework/v2/eval was uncovered like the
      # suites folded into crucible-core above, but it is the only expensive one
      # (~2.5 min: corpus runs, the committed recall/precision baselines, the
      # determinism re-run and the soak harness). crucible-core is already the
      # workflow's critical path (~8m, every other job <4m), so eval runs HERE, in
      # parallel — coverage added at ~zero wall-clock cost instead of dropped.
      #
      # NOTE FOR THE OPERATOR: `main` is branch-protected with 13 required status
      # checks (committed in .github/required-status-checks.txt), and this job —
      # `CRUCIBLE eval + benchmark corpus` — is now one of them, so it BLOCKS a merge.
      # crucible-core (also required) still carries the security-critical half —
      # veracity, kernel, planner, sensors, defender, memory, analysis — so the
      # accuracy claim is gated from both sides.
      CRUCIBLE_EVAL_SUITES: framework/v2/eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install engine deps + vigil_core
        run: |
          # W3-2: runtime from the committed HASH LOCK (== the shipped tree), pytest+asyncio from the
          # pinned CI toolchain lock; vigil_core editable --no-deps. pytest-httpserver ships in the
          # runtime lock. See the vigil_core step above / docs/SUPPLY-CHAIN.md §2 for the rationale.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: coverage guard — the eval suite must actually collect tests
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: |
          set -uo pipefail
          fail=0
          total=0
          for suite in $CRUCIBLE_EVAL_SUITES; do
            out="$(pytest "$suite" --collect-only -q 2>&1)"; rc=$?
            n="$(printf '%s\n' "$out" | awk '
              /^[^ ].*: [0-9]+$/ { s += $NF; seen = 1 }
              /::/               { ids++ }
              END                { if (seen) print s; else print ids + 0 }')"
            if [ "$rc" -eq 5 ]; then
              echo "::error::$suite collected ZERO tests — this path buys no coverage"
              fail=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$suite failed collection (pytest rc=$rc)"
              printf '%s\n' "$out" | tail -n 40
              fail=1
            else
              echo "  $suite -> $n test(s)"
              total=$((total + n))
            fi
          done
          echo "eval suites collect $total test(s)"
          [ "$fail" -eq 0 ]
      - name: eval — benchmark corpus, committed recall/precision baselines, determinism + soak
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: pytest $CRUCIBLE_EVAL_SUITES -q

  loopback-engagement:
    name: loopback engagement (end-to-end + offline re-verify)
    # W11-1 (#482). THE GAP THIS CLOSES: the flagship demonstration — scan a live target, confirm a real
    # weakness through the oracle, and RE-VERIFY that evidence offline with no trust in the tool that
    # produced it — existed only as a hand-run recorded in a memory file, which proves nothing on the next
    # commit. This REQUIRED job mechanizes it on every PR, and it is the ANTIC reviewer demonstration.
    #
    # Hermetic: the target is this repository's own stdlib HTTP app (infra/loopback/vulnapp.py) bound to
    # 127.0.0.1. NO docker, NO network egress, NO root — `scan` is loopback-only by design.
    #
    # Four ASSERTED legs (see tools/loopback-engagement/run_loopback_engagement.sh): POSITIVE (the
    # vulnerable app yields oracle-confirmed, certificate-carrying facts over the full corpus) ->
    # RE-VERIFY (those certificates re-run OFFLINE on the CLEAN independent checkout below) -> TAMPER
    # (a forged certificate is REJECTED, proving the gate is not a no-op) -> NEGATIVE (the patched twin,
    # vulnapp --safe, is a SOUND clean: zero findings AND a conclusive full-corpus coverage statement).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: a CLEAN, independent checkout to re-verify the evidence offline
        # The re-verification runs `framework.v2 verify` from THIS tree over the report the primary tree
        # produced — proving the proof is portable and needs no trust in the checkout that built it.
        uses: actions/checkout@v4
        with:
          path: _clean-reverify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install the engine's python deps + vigil_core
        run: |
          # W3-2 (#425): runtime from the committed HASH LOCK (== the shipped tree), pytest from the
          # pinned CI toolchain lock; vigil_core editable --no-deps. An inline "cryptography>=42" here
          # admitted a version below the >=50 project floor (CVE-2026-69247) and pytest floated unpinned.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: asserter logic + negative controls (stdlib, in-process)
        run: pytest tools/loopback-engagement/tests -q
      - name: end-to-end — scan the loopback range, re-verify OFFLINE on the clean checkout, controls
        env:
          VIGIL_LE_PYTHON: python
          VIGIL_LE_OUT: ${{ github.workspace }}/loopback-engagement-out
          VIGIL_LE_REVERIFY_DIR: ${{ github.workspace }}/_clean-reverify
        run: bash tools/loopback-engagement/run_loopback_engagement.sh
      - name: retain the reviewer demonstration artifact
        # ALWAYS — a failing run's partial demo is exactly what a reviewer needs to see WHY it failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loopback-engagement-demo
          path: loopback-engagement-out/
          if-no-files-found: warn

  gateway:
    name: gateway egress gate (P6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install nftables
        # bounded retry-with-backoff so a transient apt mirror blip self-heals within the timeout (#556)
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/apt-retry.sh" nftables
      - name: install deps (vigil_core + framework scope reuse)
        run: |
          # W3-2: runtime from the committed HASH LOCK (== the shipped tree); pytest from the pinned
          # CI toolchain lock; vigil_core editable --no-deps. See docs/SUPPLY-CHAIN.md §2.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
      - name: gateway tests (denylist, proxy socket refusals, nft render + netns ruleset load)
        run: |
          if [ -d gateway/tests ]; then
            PYTHONPATH=gateway python -m pytest gateway/tests -q
          else
            # STRICT branch protection ⇒ a mergeable PR is up to date with main and this committed
            # monorepo path always exists; its absence means a rename/deletion — fail RED, never skip GREEN.
            echo "::error::gateway/tests missing from the checkout"; exit 1
          fi

  integration:
    name: integration two-env boundary (P5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core + CRUCIBLE deps (for the oracle-adapter test)
        run: |
          # W3-2: runtime from the committed HASH LOCK (== the shipped tree), pytest+asyncio from the
          # pinned CI toolchain lock; vigil_core editable --no-deps. pytest-httpserver ships in the
          # runtime lock. See the vigil_core step above / docs/SUPPLY-CHAIN.md §2 for the rationale.
          pip install --require-hashes -r engine/crucible/framework/v2/requirements.lock.txt
          pip install -e packages/core/vigil_core --no-deps
          pip install --require-hashes -r infra/supply-chain/ci-tooling.lock.txt
          # NO best-effort `pip install -e apps/sigil` here, and that is the whole point of this slice.
          # That build (the Rust WARDEN kernel + the sovereign heavy stack — onnxruntime/kuzu/fastembed/
          # qdrant) is unreliable on a runner, and it used to be swallowed with
          #   pip install -e apps/sigil || echo "apps/sigil build skipped — boundary test will skip"
          # so a build failure let this REQUIRED job go GREEN with the two-env boundary proof unproven
          # (a skipped proof and a passing proof are the same colour on a dashboard). The proof does NOT
          # need the installed package: test_two_env_boundary builds its OWN sovereign venv, and the
          # keyless-actor governance-forge proof puts apps/sigil on sys.path itself — both run from SOURCE
          # against vigil_core + cryptography (installed above). The proof's EXECUTION is now enforced by
          # the "boundary proof MUST have actually executed" step below, which fails this job on a skip.
      - name: install bubblewrap — WITHOUT it the strongest egress proofs SKIP
        # test_sandbox_exec.py's real-isolation tests (a connect() from inside the sandbox must fail;
        # host daemon sockets must be unreachable) are gated on a working `bwrap`. bwrap was never
        # installed on the runners, so those four tests skipped on EVERY CI run — the repository's
        # strongest runtime no-egress evidence was dark, and a skipped proof is the same colour as a
        # passing one on a dashboard. Installing it here is what makes them actually run.
        # Installing bwrap is NOT the same as those tests running: the gate is `_bwrap_works()`, which
        # requires bwrap to actually construct namespaces, and unprivileged user namespaces are
        # AppArmor-restricted on some Ubuntu runners. So prove it works here — otherwise the job would
        # install a package, the tests would skip exactly as before, and the "fixed" claim would be
        # believed. That is the same failure this step exists to end.
        run: |
          # bounded retry-with-backoff so a transient apt mirror blip self-heals within the timeout (#556)
          bash "${GITHUB_WORKSPACE}/.github/scripts/apt-retry.sh" bubblewrap
          # UBUNTU 24.04 BLOCKS THE THING BWRAP NEEDS, and this is not theoretical: the first CI run of
          # this step failed with "bwrap cannot construct namespaces here". Noble ships
          # kernel.apparmor_restrict_unprivileged_userns=1, which denies unprivileged user namespaces —
          # exactly what an unprivileged bwrap constructs. Installing the package therefore did NOT make
          # the real-isolation tests run; they would have skipped precisely as before, while the commit
          # that added the install claimed they now execute.
          #
          # So lift the restriction rather than lower the claim. `|| true` because a runner image that
          # does not have this knob at all (or already permits it) is fine — the assertion below is what
          # decides, not this line.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Assert with the TEST'S OWN predicate, not a second one written here. A separate bwrap
          # invocation could pass while `_bwrap_works()` returned False (different binds, different
          # flags) and the tests would skip while this step reported success — one more guard that is
          # believed rather than true.
          PYTHONPATH=integration:gateway python -c "
          import sys
          sys.path.insert(0, 'integration/tests')
          from test_sandbox_exec import _bwrap_works
          if not _bwrap_works():
              sys.exit('bwrap cannot construct namespaces here; the real-isolation tests would SKIP')
          print('bwrap works — test_sandbox_exec real-isolation tests will RUN')
          "
      - name: build the egress guard (loopback-only connect(2) supervisor)
        # No external dependency: raw seccomp BPF against the kernel uapi headers. Built here so
        # test_egress_guard.py RUNS rather than skipping — it is the test that proves the no-egress
        # limit by EXECUTION (a real refused connect, a real permitted loopback connect) rather than
        # by argv construction, which is all the older no-egress tests could assert.
        run: make -C tools/egress-guard
      - name: integration tests (inert receiver, keyless worker, boundary, oracle adapter)
        run: |
          if [ -d integration/tests ]; then
            # framework (offense) and sigil.governor (sovereign) CANNOT co-load in one process —
            # assert_no_offense refuses it (the P5 boundary, working). So run the framework-
            # dependent oracle-adapter test in its OWN process, separate from the sigil-importing tests.
            # gateway is on the path so the F1 url_guard SSRF pre-filter can reuse vigil_gateway.denylist
            # (single source of truth for the always-denied ranges — a pure, offense-free module).
            # -rs NAMES every skip. Without it the job reports e.g. "1976 passed, 129 skipped" and a
            # skipped SECURITY control is indistinguishable from one that ran: the egress bypass
            # battery skips when Docker or host egress is unavailable, and there was no way to tell
            # from CI output whether the sandbox boundary had actually been proven in that run.
            PYTHONPATH=integration:gateway python -m pytest -rs integration/tests \
              --ignore=integration/tests/test_oracle_adapter.py \
              --ignore=integration/tests/test_external_tool_runner.py \
              --ignore=integration/tests/test_conformance.py \
              --ignore=integration/tests/test_sbom.py \
              --ignore=integration/tests/test_web_redrive.py \
              --ignore=integration/tests/test_web_redrive_proof_sink.py \
              --ignore=integration/tests/test_typed_outcomes.py \
              --ignore=integration/tests/test_engine_live.py \
              --ignore=integration/tests/test_engine_terminal.py \
              --ignore=integration/tests/test_executor_scoped.py \
              --ignore=integration/tests/test_executor_terminal.py \
              --ignore=integration/tests/test_cli_terminal.py \
              --ignore=integration/tests/test_cli_sandbox.py \
              --ignore=integration/tests/test_proof_engine.py \
              --ignore=integration/tests/test_proof_run.py \
              --ignore=integration/tests/test_proof_bootstrap.py \
              --ignore=integration/tests/test_proof_bundle.py \
              --ignore=integration/tests/test_dossier.py \
              --ignore=integration/tests/test_deliverable_chain.py \
              --ignore=integration/tests/test_session_dossier.py \
              --ignore=integration/tests/test_fix_oracle.py \
              --ignore=integration/tests/test_fix_ladder_matches_the_gate.py \
              --ignore=integration/tests/test_remediation_cert.py \
              --ignore=integration/tests/test_remediation_conformance.py \
              --ignore=integration/tests/test_prove_driver.py \
              --ignore=integration/tests/test_prove_driver_differential.py \
              --ignore=integration/tests/test_attestation_log.py \
              --ignore=integration/tests/test_vf_differential.py \
              --ignore=integration/tests/test_vf_end_to_end.py \
              --ignore=integration/tests/test_live_adapter.py \
              --ignore=integration/tests/test_live_adapter_tls.py \
              --ignore=integration/tests/test_live_adapter_f2.py \
              --ignore=integration/tests/test_spine_verify.py \
              --ignore=integration/tests/test_anchor_out_of_base.py \
              --ignore=integration/tests/test_ledger_head_pin.py \
              --ignore=integration/tests/test_cli_remediate.py \
              --ignore=integration/tests/test_posture_certificate.py \
              --ignore=integration/tests/test_posture_vf_differential.py \
              --ignore=integration/tests/test_posture_live.py \
              --ignore=integration/tests/test_posture_series.py \
              --ignore=integration/tests/test_posture_endpoint.py \
              --ignore=integration/tests/test_posture_reexecutable.py \
              --ignore=integration/tests/test_authority.py \
              --ignore=integration/tests/test_hexstrike_brain.py \
              --ignore=integration/tests/test_hexstrike_body.py \
              --ignore=integration/tests/test_vendor_hexstrike_quarantine.py \
              --ignore=integration/tests/test_imds_verify.py \
              --ignore=integration/tests/test_imds_runner.py \
              --ignore=integration/tests/test_secret_verify.py \
              --ignore=integration/tests/test_secret_runner.py \
              --ignore=integration/tests/test_iam_escalation_verify.py \
              --ignore=integration/tests/test_k8s_rbac_verify.py \
              --ignore=integration/tests/test_gcp_impersonation_verify.py \
              --ignore=integration/tests/test_k8s_rbac_grant_verify.py \
              --ignore=integration/tests/test_dossier_case_file.py \
              --ignore=integration/tests/test_brain_engine.py \
              --ignore=integration/tests/test_sovereignty_governs_llm_egress.py \
              --ignore=integration/tests/test_live_executor_report_builders.py \
              --junit-xml="${RUNNER_TEMP:-/tmp}/sovereign-junit.xml" -q
            # The offense-process suite: framework-dependent tests run in their OWN process. The
            # scoped-executor test (WS-A) exercises the signed-scope egress guard, which resolves scope via
            # vigil_gateway.scope_source → CRUCIBLE host_matches_scope, so it belongs here (it would load
            # `framework` into the sovereign-path process above and trip its import-clean assertions).
            #
            # test_live_executor_report_builders.py is here for the same reason, and it was NOT here when
            # the file was added. Its point is that a tool VIGIL ran produces a report the ENGINE can then
            # read, and the reading half is `framework.v2.imports.parsers` — importable only with
            # engine/crucible on the path. Collected in the sovereign process it did not fail, it SKIPPED:
            # five `importorskip`s reported "CRUCIBLE not importable here" and the job went green having
            # proved nothing about the consume leg. A skipped proof and a passing proof are the same colour
            # on a dashboard, so the file has to run in the process that can import the parser.
            # docs/tests/test_out_of_scope_is_honest.py runs HERE, not in briefing-completeness. It
            # compares ADR 0003's deferred-tool frontier against the REAL driver registries, so it needs
            # BOTH trust domains on the path — and briefing-completeness installs only pytest (rightly:
            # the briefing test reads files). There it skipped, silently, all five checks, while the ADR
            # claimed to be "enforced by a required check". This job IS required, and
            # VIGIL_REQUIRE_FRONTIER_CHECK=1 turns an import failure into a FAILURE rather than a skip,
            # so the guard cannot go dark again without the build going red.
            #
            # The cloud/K8s/IaC/mesh posture + cloud live-capture suites at the tail of this list are
            # framework-dependent (importorskip framework.v2.*), so they can ONLY execute in THIS leg — in
            # the sovereign leg they are collected-but-skipped. They were omitted from BOTH legs and so
            # never ran in CI (readiness fix — same silent-skip class as the two named cloud files).
            # test_ci_framework_tests_run_in_offense_leg.py now FAILS the build if a file that either
            # importorskips `framework` OR is --ignore'd in the sovereign leg (a hard framework import) is
            # missing from this offense list — covering both ways a framework-dependent test can hide, so the
            # gap cannot silently reopen.
            VIGIL_REQUIRE_FRONTIER_CHECK=1 \
            PYTHONPATH=integration:engine/crucible:gateway python -m pytest \
              docs/tests/test_out_of_scope_is_honest.py \
              integration/tests/test_tool_intake.py \
              integration/tests/test_oracle_adapter.py \
              integration/tests/test_external_tool_runner.py \
              integration/tests/test_conformance.py \
              integration/tests/test_sbom.py \
              integration/tests/test_web_redrive.py \
              integration/tests/test_web_redrive_proof_sink.py \
              integration/tests/test_typed_outcomes.py \
              integration/tests/test_engine_live.py \
              integration/tests/test_engine_terminal.py \
              integration/tests/test_approval_per_action_standing.py \
              integration/tests/test_executor_scoped.py \
              integration/tests/test_executor_terminal.py \
              integration/tests/test_cli_terminal.py \
              integration/tests/test_cli_sandbox.py \
              integration/tests/test_detection_vocabulary.py \
              integration/tests/test_enforcement_matrix.py \
              integration/tests/test_protected_guard_corpus.py \
              integration/tests/test_live_executor_report_builders.py \
              integration/tests/test_proof_engine.py \
              integration/tests/test_proof_run.py \
