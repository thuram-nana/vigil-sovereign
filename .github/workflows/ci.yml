name: vigil-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vigil-core:
    name: vigil_core — shared integrity substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core
        run: pip install -e packages/core/vigil_core pytest
      - name: migration-safety tests (v1 byte-identical signing, threshold, tamper)
        run: pytest packages/core/vigil_core/tests -q

  crucible-core:
    name: CRUCIBLE core on vigil_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install engine deps + vigil_core
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest pytest-httpserver pytest-asyncio
      - name: evidence + entitlement + verify + worldmodel + confidence + authority
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: |
          pytest framework/v2/evidence framework/v2/entitlement framework/v2/common \
                 framework/v2/verify framework/v2/confidence framework/v2/worldmodel \
                 framework/v2/calibration framework/v2/authority -q

  gateway:
    name: gateway egress gate (P6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: install deps (vigil_core + framework scope reuse)
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest
      - name: gateway tests (denylist, proxy socket refusals, nft render + netns ruleset load)
        run: |
          if [ -d gateway/tests ]; then
            PYTHONPATH=gateway python -m pytest gateway/tests -q
          else
            echo "gateway/ not present on this ref (pre-merge) — nothing to test"
          fi

  integration:
    name: integration two-env boundary (P5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core + CRUCIBLE deps (for the oracle-adapter test) (+ best-effort sigil)
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest pytest-httpserver pytest-asyncio
          # apps/sigil builds the Rust WARDEN kernel; best-effort so the structural boundary
          # proof runs when it succeeds and skips (not fails) when the toolchain is unavailable.
          pip install -e apps/sigil || echo "apps/sigil build skipped — boundary test will skip"
      - name: integration tests (inert receiver, keyless worker, boundary, oracle adapter)
        run: |
          if [ -d integration/tests ]; then
            # framework (offense) and sigil.governor (sovereign) CANNOT co-load in one process —
            # assert_no_offense refuses it (the P5 boundary, working). So run the framework-
            # dependent oracle-adapter test in its OWN process, separate from the sigil-importing tests.
            # gateway is on the path so the F1 url_guard SSRF pre-filter can reuse vigil_gateway.denylist
            # (single source of truth for the always-denied ranges — a pure, offense-free module).
            PYTHONPATH=integration:gateway python -m pytest integration/tests \
              --ignore=integration/tests/test_oracle_adapter.py \
              --ignore=integration/tests/test_engine_live.py -q
            # The offense-process suite: the framework-dependent oracle-adapter test AND the WS-5 live
            # engine validation (the unified engine over the REAL CRUCIBLE gate + oracle). gateway is on
            # the path because the live executor reuses vigil_gateway.denylist (the loopback egress pin).
            PYTHONPATH=integration:engine/crucible:gateway python -m pytest \
              integration/tests/test_oracle_adapter.py \
              integration/tests/test_engine_live.py \
              integration/tests/test_detection_vocabulary.py -q
          else
            echo "integration/ not present on this ref (pre-merge) — nothing to test"
          fi

  strix-vigil:
    name: strix Claude-runtime (P8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pytest + best-effort SDK (so reasoning/dedup tests run, not just skip)
        run: |
          pip install pytest
          # openai-agents[litellm] + openai let the reasoning/dedup tests actually execute
          # (red-pen P8 finding 3). Best-effort: if it can't resolve, those two importorskip.
          pip install "openai-agents[litellm]" openai || echo "SDK unavailable — reasoning/dedup tests will skip"
      - name: strix vigil tests (Anthropic price table + reasoning + dedup fallback)
        run: |
          if [ -d vendor/strix/tests_vigil ]; then
            PYTHONPATH=vendor/strix python -m pytest vendor/strix/tests_vigil -q
          else
            echo "vendor/strix/tests_vigil not present on this ref (pre-merge) — nothing to test"
          fi

  sigil-governor:
    name: SIGIL governor gates (P7 — offense gate + authn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core + SIGIL deps (governor tests are pure-Python; no Rust kernel needed)
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML "cryptography>=42" packaging pytest
      - name: offense gate + hardening + finding receiver (P7 governance + P10 two-anchor ingest)
        env:
          SIGIL_HOME: /tmp/sigil-ci
        run: |
          mkdir -p /tmp/sigil-ci
          if [ -f apps/sigil/tests/test_offense_gate.py ]; then
            # integration on the path for the P10 finding-receiver (it uses vigil_integration.inert_finding,
            # which is sovereign-safe = vigil_core only, so no offense engine is pulled).
            PYTHONPATH=apps/sigil:integration python -m pytest \
              apps/sigil/tests/test_offense_gate.py \
              apps/sigil/tests/test_hardening.py \
              apps/sigil/tests/test_finding_receiver.py \
              apps/sigil/tests/test_finding_receiver_delegation.py \
              apps/sigil/tests/test_offense_spine_delegation.py \
              apps/sigil/tests/test_detection_receiver.py \
              apps/sigil/tests/test_vault.py \
              apps/sigil/tests/test_secrets_sealed.py \
              apps/sigil/tests/test_kernel_pin.py \
              apps/sigil/tests/test_floor_signing.py \
              apps/sigil/tests/test_gesture_arm.py \
              apps/sigil/tests/test_spine_envelope.py \
              apps/sigil/tests/test_spine_sealed.py \
              apps/sigil/tests/test_backup.py \
              apps/sigil/tests/test_witness_checkpoint.py \
              apps/sigil/tests/test_capability_latch.py \
              apps/sigil/tests/test_capability_gesture.py \
              apps/sigil/tests/test_capability_voice.py \
              apps/sigil/tests/test_capability_ui.py -q
          else
            echo "apps/sigil offense-gate tests not present on this ref (pre-merge) — nothing to test"
          fi
