name: vigil-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vigil-core:
    name: vigil_core — shared integrity substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core
        run: pip install -e packages/core/vigil_core pytest
      - name: migration-safety tests (v1 byte-identical signing, threshold, tamper)
        run: pytest packages/core/vigil_core/tests -q

  crucible-core:
    name: CRUCIBLE core on vigil_core
    runs-on: ubuntu-latest
    env:
      # Suites that existed, passed, and were NEVER RUN IN CI — the job hand-listed
      # its paths and simply omitted these. `veracity` is the anti-fabrication layer:
      # the product's central claim (no finding becomes a FACT without a re-executed
      # deterministic proof) had ZERO CI coverage, so a regression in it could merge
      # green. `planner` carries the flagship UTI -> ACP -> MAO -> report end-to-end
      # test, which was RED on main precisely because nothing ran it.
      #
      # Cost of adding them here: ~9s of the job's ~8m. `framework/v2/eval` is the
      # one expensive suite (~2.5 min: benchmark corpus + recall baselines + soak),
      # so it is SPLIT into its own parallel `crucible-eval` job rather than dropped
      # — crucible-core is the workflow's critical path and must not grow by 30%.
      #
      # Single source of truth: the guard step below and the pytest invocation both
      # expand THIS variable, so a path can never be guarded-but-not-run (or run
      # but not guarded). A NEW test file under an otherwise-uncovered directory
      # belongs HERE for exactly that reason — hand-listing it in the pytest step
      # alone would run it unguarded, so a path typo that collects ZERO tests would
      # merge green (`framework/v2/agents` is not covered wholesale; only named
      # files under it run).
      CRUCIBLE_UNCOVERED_SUITES: >-
        framework/v2/veracity
        framework/v2/kernel
        framework/v2/planner
        framework/v2/sensors
        framework/v2/defender
        framework/v2/memory
        framework/v2/analysis
        framework/v2/agents/tests/test_engagement_library.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install engine deps + vigil_core
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest pytest-httpserver pytest-asyncio
      - name: coverage guard — every newly-listed suite must actually collect tests
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: |
          # A test path that silently matches NOTHING is worse than not adding it: the
          # job stays green and the log looks like coverage. pytest exits 5
          # (EXIT_NOTESTSCOLLECTED) for a path that collects nothing and 4 for a path
          # that does not exist, so this is a version-independent hard gate, and it
          # prints the per-suite counts so the live run shows the coverage it bought.
          set -uo pipefail
          fail=0
          total=0
          for suite in $CRUCIBLE_UNCOVERED_SUITES; do
            out="$(pytest "$suite" --collect-only -q 2>&1)"; rc=$?
            n="$(printf '%s\n' "$out" | awk '
              /^[^ ].*: [0-9]+$/ { s += $NF; seen = 1 }
              /::/               { ids++ }
              END                { if (seen) print s; else print ids + 0 }')"
            if [ "$rc" -eq 5 ]; then
              echo "::error::$suite collected ZERO tests — this path buys no coverage"
              fail=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$suite failed collection (pytest rc=$rc)"
              printf '%s\n' "$out" | tail -n 40
              fail=1
            else
              echo "  $suite -> $n test(s)"
              total=$((total + n))
            fi
          done
          echo "newly-covered suites collect $total test(s)"
          [ "$fail" -eq 0 ]
      - name: evidence + entitlement + verify + worldmodel + confidence + authority + console/api (UI federation) + AEGIS gate-invariants + deferred-infra scaffolds (G1/X1-X3) + veracity/kernel/planner/sensors/defender/memory/analysis
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: |
          # framework/v2/scanner carries the probe + oracle-predicate suites (open-redirect / CORS /
          # host-header / SSO co-location, the inert-markup content models, the parse-time bounds and the
          # tokenizer differential). They were absent from CI, so a soundness regression in a shipped
          # predicate could merge green — exactly the class this wave had to fix.
          #
          # $CRUCIBLE_UNCOVERED_SUITES appends the directories that were omitted from this
          # hand-maintained list entirely (see the job env above for why each matters).
          pytest framework/v2/evidence framework/v2/entitlement framework/v2/common \
                 framework/v2/scanner \
                 framework/v2/verify framework/v2/confidence framework/v2/worldmodel \
                 framework/v2/calibration framework/v2/authority \
                 framework/v2/console framework/v2/api framework/v2/report \
                 framework/v2/graph framework/v2/attest \
                 framework/v2/remediation_binary framework/v2/agent_body \
                 framework/v2/aegis \
                 framework/v2/agents/tests/test_agent_message.py \
                 framework/v2/intel/tests/test_vulnfeed.py \
                 framework/v2/knowledge_engine \
                 $CRUCIBLE_UNCOVERED_SUITES -q

  crucible-eval:
    name: CRUCIBLE eval + benchmark corpus
    runs-on: ubuntu-latest
    env:
      # The SPLIT half of the CI-coverage fix. framework/v2/eval was uncovered like the
      # suites folded into crucible-core above, but it is the only expensive one
      # (~2.5 min: corpus runs, the committed recall/precision baselines, the
      # determinism re-run and the soak harness). crucible-core is already the
      # workflow's critical path (~8m, every other job <4m), so eval runs HERE, in
      # parallel — coverage added at ~zero wall-clock cost instead of dropped.
      #
      # NOTE FOR THE OPERATOR: `main` is branch-protected with 9 required status
      # checks. This is a NEW check name, so until it is added to that required list
      # it will run and report but will NOT block a merge. crucible-core (already
      # required) carries the security-critical half — veracity, kernel, planner,
      # sensors, defender, memory, analysis — deliberately, so the enforcement gap
      # is limited to the measurement suite.
      CRUCIBLE_EVAL_SUITES: framework/v2/eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install engine deps + vigil_core
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest pytest-httpserver pytest-asyncio
      - name: coverage guard — the eval suite must actually collect tests
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: |
          set -uo pipefail
          fail=0
          total=0
          for suite in $CRUCIBLE_EVAL_SUITES; do
            out="$(pytest "$suite" --collect-only -q 2>&1)"; rc=$?
            n="$(printf '%s\n' "$out" | awk '
              /^[^ ].*: [0-9]+$/ { s += $NF; seen = 1 }
              /::/               { ids++ }
              END                { if (seen) print s; else print ids + 0 }')"
            if [ "$rc" -eq 5 ]; then
              echo "::error::$suite collected ZERO tests — this path buys no coverage"
              fail=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$suite failed collection (pytest rc=$rc)"
              printf '%s\n' "$out" | tail -n 40
              fail=1
            else
              echo "  $suite -> $n test(s)"
              total=$((total + n))
            fi
          done
          echo "eval suites collect $total test(s)"
          [ "$fail" -eq 0 ]
      - name: eval — benchmark corpus, committed recall/precision baselines, determinism + soak
        working-directory: engine/crucible
        env:
          PYTHONPATH: .
        run: pytest $CRUCIBLE_EVAL_SUITES -q

  gateway:
    name: gateway egress gate (P6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: install deps (vigil_core + framework scope reuse)
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest
      - name: gateway tests (denylist, proxy socket refusals, nft render + netns ruleset load)
        run: |
          if [ -d gateway/tests ]; then
            PYTHONPATH=gateway python -m pytest gateway/tests -q
          else
            echo "gateway/ not present on this ref (pre-merge) — nothing to test"
          fi

  integration:
    name: integration two-env boundary (P5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core + CRUCIBLE deps (for the oracle-adapter test) (+ best-effort sigil)
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML beautifulsoup4 Jinja2 \
            "cryptography>=42" packaging pytest pytest-httpserver pytest-asyncio
          # apps/sigil builds the Rust WARDEN kernel; best-effort so the structural boundary
          # proof runs when it succeeds and skips (not fails) when the toolchain is unavailable.
          pip install -e apps/sigil || echo "apps/sigil build skipped — boundary test will skip"
      - name: integration tests (inert receiver, keyless worker, boundary, oracle adapter)
        run: |
          if [ -d integration/tests ]; then
            # framework (offense) and sigil.governor (sovereign) CANNOT co-load in one process —
            # assert_no_offense refuses it (the P5 boundary, working). So run the framework-
            # dependent oracle-adapter test in its OWN process, separate from the sigil-importing tests.
            # gateway is on the path so the F1 url_guard SSRF pre-filter can reuse vigil_gateway.denylist
            # (single source of truth for the always-denied ranges — a pure, offense-free module).
            PYTHONPATH=integration:gateway python -m pytest integration/tests \
              --ignore=integration/tests/test_oracle_adapter.py \
              --ignore=integration/tests/test_external_tool_runner.py \
              --ignore=integration/tests/test_conformance.py \
              --ignore=integration/tests/test_sbom.py \
              --ignore=integration/tests/test_web_redrive.py \
              --ignore=integration/tests/test_typed_outcomes.py \
              --ignore=integration/tests/test_engine_live.py \
              --ignore=integration/tests/test_engine_terminal.py \
              --ignore=integration/tests/test_executor_scoped.py \
              --ignore=integration/tests/test_executor_terminal.py \
              --ignore=integration/tests/test_cli_terminal.py \
              --ignore=integration/tests/test_cli_sandbox.py \
              --ignore=integration/tests/test_proof_engine.py \
              --ignore=integration/tests/test_proof_run.py \
              --ignore=integration/tests/test_proof_bootstrap.py \
              --ignore=integration/tests/test_proof_bundle.py \
              --ignore=integration/tests/test_dossier.py \
              --ignore=integration/tests/test_session_dossier.py \
              --ignore=integration/tests/test_fix_oracle.py \
              --ignore=integration/tests/test_remediation_cert.py \
              --ignore=integration/tests/test_remediation_conformance.py \
              --ignore=integration/tests/test_prove_driver.py \
              --ignore=integration/tests/test_prove_driver_differential.py \
              --ignore=integration/tests/test_attestation_log.py \
              --ignore=integration/tests/test_vf_differential.py \
              --ignore=integration/tests/test_vf_end_to_end.py \
              --ignore=integration/tests/test_live_adapter.py \
              --ignore=integration/tests/test_live_adapter_tls.py \
              --ignore=integration/tests/test_live_adapter_f2.py \
              --ignore=integration/tests/test_spine_verify.py \
              --ignore=integration/tests/test_cli_remediate.py \
              --ignore=integration/tests/test_posture_certificate.py \
              --ignore=integration/tests/test_posture_vf_differential.py \
              --ignore=integration/tests/test_posture_live.py \
              --ignore=integration/tests/test_posture_series.py \
              --ignore=integration/tests/test_posture_endpoint.py \
              --ignore=integration/tests/test_posture_reexecutable.py \
              --ignore=integration/tests/test_authority.py \
              --ignore=integration/tests/test_hexstrike_brain.py \
              --ignore=integration/tests/test_hexstrike_body.py \
              --ignore=integration/tests/test_vendor_hexstrike_quarantine.py \
              --ignore=integration/tests/test_imds_verify.py \
              --ignore=integration/tests/test_imds_runner.py \
              --ignore=integration/tests/test_secret_verify.py \
              --ignore=integration/tests/test_secret_runner.py \
              --ignore=integration/tests/test_iam_escalation_verify.py \
              --ignore=integration/tests/test_k8s_rbac_verify.py \
              --ignore=integration/tests/test_gcp_impersonation_verify.py \
              --ignore=integration/tests/test_k8s_rbac_grant_verify.py \
              --ignore=integration/tests/test_dossier_case_file.py \
              --ignore=integration/tests/test_brain_engine.py \
              --ignore=integration/tests/test_sovereignty_governs_llm_egress.py -q
            # The offense-process suite: framework-dependent tests run in their OWN process. The
            # scoped-executor test (WS-A) exercises the signed-scope egress guard, which resolves scope via
            # vigil_gateway.scope_source → CRUCIBLE host_matches_scope, so it belongs here (it would load
            # `framework` into the sovereign-path process above and trip its import-clean assertions).
            PYTHONPATH=integration:engine/crucible:gateway python -m pytest \
              integration/tests/test_oracle_adapter.py \
              integration/tests/test_external_tool_runner.py \
              integration/tests/test_conformance.py \
              integration/tests/test_sbom.py \
              integration/tests/test_web_redrive.py \
              integration/tests/test_typed_outcomes.py \
              integration/tests/test_engine_live.py \
              integration/tests/test_engine_terminal.py \
              integration/tests/test_executor_scoped.py \
              integration/tests/test_executor_terminal.py \
              integration/tests/test_cli_terminal.py \
              integration/tests/test_cli_sandbox.py \
              integration/tests/test_detection_vocabulary.py \
              integration/tests/test_proof_engine.py \
              integration/tests/test_proof_run.py \
              integration/tests/test_proof_bootstrap.py \
              integration/tests/test_proof_bundle.py \
              integration/tests/test_dossier.py \
              integration/tests/test_session_dossier.py \
              integration/tests/test_fix_oracle.py \
              integration/tests/test_remediation_cert.py \
              integration/tests/test_remediation_conformance.py \
              integration/tests/test_prove_driver.py \
              integration/tests/test_prove_driver_differential.py \
              integration/tests/test_attestation_log.py \
              integration/tests/test_vf_differential.py \
              integration/tests/test_vf_end_to_end.py \
              integration/tests/test_reprove.py \
              integration/tests/test_live_adapter.py \
              integration/tests/test_live_adapter_tls.py \
              integration/tests/test_live_adapter_f2.py \
              integration/tests/test_spine_verify.py \
              integration/tests/test_cli_remediate.py \
              integration/tests/test_posture_certificate.py \
              integration/tests/test_posture_vf_differential.py \
              integration/tests/test_posture_live.py \
              integration/tests/test_posture_series.py \
              integration/tests/test_posture_endpoint.py \
              integration/tests/test_posture_reexecutable.py \
              integration/tests/test_authority.py \
              integration/tests/test_hexstrike_brain.py \
              integration/tests/test_hexstrike_body.py \
              integration/tests/test_vendor_hexstrike_quarantine.py \
              integration/tests/test_imds_verify.py \
              integration/tests/test_imds_runner.py \
              integration/tests/test_secret_verify.py \
              integration/tests/test_secret_runner.py \
              integration/tests/test_iam_escalation_verify.py \
              integration/tests/test_k8s_rbac_verify.py \
              integration/tests/test_gcp_impersonation_verify.py \
              integration/tests/test_k8s_rbac_grant_verify.py \
              integration/tests/test_dossier_case_file.py \
              integration/tests/test_brain_engine.py \
              integration/tests/test_sovereignty_governs_llm_egress.py -q
          else
            echo "integration/ not present on this ref (pre-merge) — nothing to test"
          fi

  strix-vigil:
    name: strix Claude-runtime (P8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pytest + best-effort SDK (so reasoning/dedup tests run, not just skip)
        run: |
          pip install pytest
          # openai-agents[litellm] + openai let the reasoning/dedup tests actually execute
          # (red-pen P8 finding 3). Best-effort: if it can't resolve, those two importorskip.
          pip install "openai-agents[litellm]" openai || echo "SDK unavailable — reasoning/dedup tests will skip"
      - name: strix vigil tests (Anthropic price table + reasoning + dedup fallback)
        run: |
          if [ -d vendor/strix/tests_vigil ]; then
            PYTHONPATH=vendor/strix python -m pytest vendor/strix/tests_vigil -q
          else
            echo "vendor/strix/tests_vigil not present on this ref (pre-merge) — nothing to test"
          fi

  sigil-governor:
    name: SIGIL governor gates (P7 — offense gate + authn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install vigil_core + SIGIL deps (governor tests are pure-Python; no Rust kernel needed)
        run: |
          pip install -e packages/core/vigil_core \
            "pydantic>=2.10,<3" structlog httpx requests PyYAML "cryptography>=42" packaging pytest
      - name: offense gate + hardening + finding receiver (P7 governance + P10 two-anchor ingest)
        env:
          SIGIL_HOME: /tmp/sigil-ci
        run: |
          mkdir -p /tmp/sigil-ci
          if [ -f apps/sigil/tests/test_offense_gate.py ]; then
            # integration on the path for the P10 finding-receiver (it uses vigil_integration.inert_finding,
            # which is sovereign-safe = vigil_core only, so no offense engine is pulled).
            PYTHONPATH=apps/sigil:integration python -m pytest \
              apps/sigil/tests/test_offense_gate.py \
              apps/sigil/tests/test_hardening.py \
              apps/sigil/tests/test_finding_receiver.py \
              apps/sigil/tests/test_finding_receiver_delegation.py \
              apps/sigil/tests/test_offense_spine_delegation.py \
              apps/sigil/tests/test_detection_receiver.py \
              apps/sigil/tests/test_spool_watcher.py \
              apps/sigil/tests/test_vault.py \
              apps/sigil/tests/test_secrets_sealed.py \
              apps/sigil/tests/test_kernel_pin.py \
              apps/sigil/tests/test_floor_signing.py \
              apps/sigil/tests/test_gesture_arm.py \
              apps/sigil/tests/test_spine_envelope.py \
              apps/sigil/tests/test_spine_sealed.py \
              apps/sigil/tests/test_backup.py \
              apps/sigil/tests/test_witness_checkpoint.py \
              apps/sigil/tests/test_capability_latch.py \
              apps/sigil/tests/test_capability_gesture.py \
              apps/sigil/tests/test_capability_voice.py \
              apps/sigil/tests/test_capability_ui.py \
              apps/sigil/tests/test_ui.py \
              apps/sigil/tests/test_ui_remote.py \
              apps/sigil/tests/test_ui_settings.py \
              apps/sigil/tests/test_system_map_sync.py \
              apps/sigil/tests/test_voice_nav.py \
              apps/sigil/tests/test_gesture_nav.py \
              apps/sigil/tests/test_hud_status.py \
              apps/sigil/tests/test_capability_autolearn.py \
              apps/sigil/tests/test_knowledge_proposals.py \
              apps/sigil/tests/test_learn_grant.py \
              apps/sigil/tests/test_learn_source.py \
              apps/sigil/tests/test_promotion_state_all.py -q
          else
            echo "apps/sigil offense-gate tests not present on this ref (pre-merge) — nothing to test"
          fi

  formal-verification:
    name: formal (TLA+ core-invariant model check, F1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC model-check the four core invariants + their mutants
        run: |
          if [ -f formal/check.sh ]; then
            # check.sh fetches a PINNED, sha256-verified tla2tools.jar (GitHub runners have net),
            # model-checks each faithful spec (must hold) AND each mutant (must be caught).
            bash formal/check.sh
          else
            echo "formal/ not present on this ref (pre-merge) — nothing to check"
          fi

  warden-kernel:
    name: WARDEN Rust kernel (A10 durability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test the WARDEN kernel (chain/head/anti-rollback/tiers/router/registry/crypto + A10 durability)
        run: |
          if [ -f apps/sigil/kernel/Cargo.toml ]; then
            # GitHub ubuntu runners ship a stable Rust toolchain. Run the FULL kernel test suite — the
            # #[test]s the audit (A10) flagged as never wired into CI, now including the durability
            # regressions: the concurrent-append flock (unique/contiguous seqs, no duplicate under a
            # race), the atomic head write (no torn temp), and the de-hardcoded interpreter path. A
            # release build proves the binary compiles clean.
            cd apps/sigil/kernel
            cargo test
            cargo build --release
          else
            echo "apps/sigil/kernel not present on this ref (pre-merge) — nothing to test"
          fi
