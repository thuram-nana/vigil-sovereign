        with:
          distribution: temurin
          java-version: "21"
      - name: TLC model-check the four core invariants + their mutants
        run: |
          if [ -f formal/check.sh ]; then
            # check.sh fetches a PINNED, sha256-verified tla2tools.jar (GitHub runners have net),
