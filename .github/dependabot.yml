# Dependency-update automation.
#
# WHY THIS EXISTS. Before this file the repository had NO update automation of any kind — no
# Dependabot, no Renovate, no .snyk. A vulnerability disclosed in an already-pinned dependency sat
# invisible until a human happened to open a pull request that touched a lock (the A14 gate in
# .github/workflows/supply-chain.yml only runs on push/PR to `main`). This config makes the update a
# scheduled, attributable pull request; the scheduled scan in
# .github/workflows/scheduled-supply-chain-scan.yml is the other half — it surfaces a finding as an
# issue even when nobody opens a PR at all.
#
# ECOSYSTEMS. All four the repository actually contains: pip (Python), cargo (the WARDEN Rust
# kernel), github-actions (the workflow files themselves), and docker (the service images). npm is
# not declared: the repository ships no runtime npm project, and an npm entry with no package.json
# fails every Dependabot run. integration/tests/test_dependency_automation.py fails the build the
# moment a runtime package.json lands without an npm entry for its directory.
# The deliberately-vulnerable eval-corpus fixtures under
# engine/crucible/framework/v2/eval/corpus_apps/_cve/ are NOT listed on purpose — they are meant to
# stay vulnerable so the engine can prove it detects the CVE, and a Dependabot PR "fixing" one would
# break the corpus. `vendor/` is third-party quarantined source and is likewise left alone.
#
# CADENCE. Weekly for the update PRs (low-noise; a security-relevant bump still surfaces the same day
# through the scheduled scan's issue), grouped so a batch of minor/patch bumps is one reviewable PR
# rather than a dozen.

version: 2

updates:
  # -------------------------------------------------------------------------- pip (Python)
  - package-ecosystem: "pip"
    # The real runtime/build manifests. Trivy's lock scanning in A14 covers the resolved trees;
    # Dependabot watches the top-level manifests these are compiled from.
    directories:
      - "/"
      - "/apps/sigil"
      - "/gateway"
      - "/integration"
      - "/engine/crucible"
      - "/engine/crucible/framework/v2"
      - "/packages/core/vigil_core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------------------------- cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/apps/sigil/kernel"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------------------------- github-actions
  # Watches the pinned action SHAs in .github/workflows/*. Dependabot bumps a SHA and records the new
  # tag comment, so the SHA-pin discipline the A14 test enforces stays maintainable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
      - "ci"

  # -------------------------------------------------------------------------- docker
  - package-ecosystem: "docker"
    directories:
      - "/gateway"
      - "/engine/crucible/framework/v2/aegis"
    schedule:
      interval: "weekly"
      day: "monday"
    # Both images pin the `python` base to the minor the committed hash-locks target (W1-7):
    # integration/tests/test_aegis_dockerfile_wired.py asserts image == lock for each. A bump to another
    # minor is therefore red by construction until the locks themselves move, so this keeps Dependabot to
    # same-minor digest refreshes of 3.13-slim. Dependabot's docker parser reads only literal FROM lines
    # (it never substitutes an ARG), so each base is pinned on one: the gateway's as the named stage
    # `pinned-python` that its `ARG PYTHON_BASE` default selects. test_dependency_automation.py keeps every
    # watched base visible. Move this bound together with the runtime lock.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.14"]
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
