# VIGIL monorepo — uv workspace root.
#
# The workspace declares every member package. Crucially, VIGIL is NOT one flat environment:
# the offense-free guarantee (FATAL-2) requires TWO isolated environments that never share an
# interpreter — env-sovereign (personal core, offense-free) and env-offense (the autonomous
# offense side). uv workspaces resolve to a single lock, so the two isolated locks are built
# from the member sets in envs/ (envs/sovereign.txt, envs/offense.txt); see envs/README.md.
# This root exists so `uv` (when present) can discover members and for repo-wide tooling.

[tool.uv.workspace]
members = [
    "packages/core/vigil_core",
    "apps/sigil",
    "engine/crucible",
    "vendor/strix",
    "gateway",
    "integration",
]

# Resolve every first-party member from the workspace, never the package index. Without this a
# member that depends on another by NAME (e.g. `vigil-integration` -> `vigil-core`) makes `uv sync`/
# `uv lock` fail — uv refuses a workspace member that has no `tool.uv.sources` entry ("`vigil-core`
# is included as a workspace member, but is missing an entry in `tool.uv.sources`"). The isolated
# env builds still install third-party deps from the committed HASH LOCKS (see envs/build_envs.sh);
# this table only makes uv's own workspace resolution / repo-wide tooling work. Declaring all
# members is safe and future-proofs any new inter-member dependency.
[tool.uv.sources]
vigil-core = { workspace = true }
sigil = { workspace = true }
crucible = { workspace = true }
strix-agent = { workspace = true }
vigil-gateway = { workspace = true }
vigil-integration = { workspace = true }

# The two isolated environments, as documentation of the boundary (built via envs/):
#   env-sovereign : vigil_core + apps/sigil + integration      (NEVER framework.* or strix.*)
#   env-offense   : vigil_core + engine/crucible + vendor/strix + gateway + integration
# The structural proof that the sovereign env cannot import the offense members lives in
# integration/tests/test_two_env_boundary.py.

[tool.vigil.environments.sovereign]
members = ["packages/core/vigil_core", "apps/sigil", "integration"]
forbids = ["framework", "strix"]

[tool.vigil.environments.offense]
members = ["packages/core/vigil_core", "engine/crucible", "vendor/strix", "gateway", "integration"]
owner_key = false   # the offense worker runs with NO owner signing key (keyless trust domain)
