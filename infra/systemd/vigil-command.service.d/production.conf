# VIGIL COMMAND — PRODUCTION drop-in: the operator console runs PROXY-ONLY in front of sigil-cockpit.service.
#
# WHY. A production host runs the sovereign cockpit as its own unit (sigil-cockpit.service, 127.0.0.1:8733 —
# GO-LIVE §6). A plain `vigil up` would start a second cockpit on that same port, so whichever of the two starts
# second cannot bind and restart-loops. With this drop-in the console starts NO backend: it federates
# /sovereign/* to the cockpit unit on 127.0.0.1:8733 (and /offense/* to 127.0.0.1:8787 / :8799 when an offense
# console and API run on this host — docs/architecture/HA-PROFILE.md §1.1). `vigil doctor` reports a host where
# both units are enabled and the console is not proxy-only.
#
# INSTALL (once, on the production host):
#   mkdir -p ~/.config/systemd/user/vigil-command.service.d
#   cp infra/systemd/vigil-command.service.d/production.conf ~/.config/systemd/user/vigil-command.service.d/
#   systemctl --user daemon-reload && systemctl --user restart vigil-command
#
# SETTINGS (in ~/vigil/.vigil-live/service.env, the unit's EnvironmentFile; plain KEY=VALUE):
#   VIGIL_CONSOLE_DOMAIN=console.example.com  the console's own hostname (the nginx vhost in GO-LIVE §7). The proxy
#                                             admits only this Host/Origin; the cockpit's cockpit.env must list it
#                                             in SIGIL_UI_ALLOWED_HOSTS / SIGIL_UI_ALLOWED_ORIGINS too.
#   CRUCIBLE_API_KEY=<long random secret>     required by `vigil up --domain` (it refuses to start without it).
# If sigil-cockpit binds anything other than 127.0.0.1:8733 (SIGIL_UI_BIND / SIGIL_UI_PORT in cockpit.env), change
# --sovereign-addr below to match; `vigil doctor` reports a console that federates to an address the cockpit
# unit does not bind.

[Service]
# An empty ExecStart= clears the unit's own command; the next line replaces it.
ExecStart=
ExecStart=%h/vigil/.venv-offense/bin/vigil up --proxy-only --sovereign-addr 127.0.0.1:8733 --port 8770 --no-browser --domain ${VIGIL_CONSOLE_DOMAIN}
