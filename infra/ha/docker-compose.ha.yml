# VIGIL HA / cluster overlay — extends the root docker-compose.yml.
# =============================================================================
# Use it AS AN OVERLAY on the root compose (compose merges left-to-right):
#
#     docker compose -f docker-compose.yml -f infra/ha/docker-compose.ha.yml \
#         --profile observability up -d qdrant otel-collector otel-collector-2 vigil-lb
#     # + the passive sovereign standby (does NOT auto-write):
#     docker compose -f docker-compose.yml -f infra/ha/docker-compose.ha.yml \
#         --profile passive up -d sovereign-passive
#
# HONESTY — read docs/architecture/HA-PROFILE.md first. This overlay makes the
# STATELESS read/proxy tier active-active and documents the server-mode upgrades
# the stateful backends need. It does NOT, and cannot, make the sovereign spine a
# multi-writer. The spine is single-writer; a second concurrent writer is a
# DETECTABLE FORK, not scale (HA-PROFILE.md §2).
#
# BOUNDARY (mirrors the root compose): the sovereign and offense runtimes run
# NATIVELY in their own venvs — the offense plane MUST stay native (it drives the
# host Docker daemon; containerizing it would require handing it the host docker
# socket, weakening the two-process boundary). So this overlay containerizes ONLY
# the backing infra (LB, Qdrant, otel) and a NON-writing sovereign standby sidecar.
# The two `vigil up` proxy replicas and the ACTIVE sovereign writer are NATIVE host
# processes the LB fronts over loopback (exact commands below and in lb.nginx.conf).
#
# LOOPBACK/VIP DISCIPLINE: EVERY host port below is published on 127.0.0.1 ONLY —
# never 0.0.0.0 — exactly like the root compose (its comment at line ~9). Reach
# anything remotely via a tunnel + TLS reverse proxy in front of the VIP
# (apps/sigil/deploy/REMOTE-HOSTING.md).

services:
  # ---------------------------------------------------------------------------
  # LB: fronts the TWO active-active `vigil up` proxy replicas (native, on the
  # host at 127.0.0.1:8770 and :8771). See infra/ha/lb.nginx.conf. Sticky sessions
  # (ip_hash) because each replica holds its own per-instance session token.
  #
  # Launch the two NATIVE replicas the LB points at:
  #   CRUCIBLE_API_KEY=... vigil up --domain vigil.example.com --host 127.0.0.1 --port 8770 --no-browser
  #   CRUCIBLE_API_KEY=... vigil up --domain vigil.example.com --host 127.0.0.1 --port 8771 --no-browser
  # ---------------------------------------------------------------------------
  vigil-lb:
    # Digest-pinned per the root compose's supply-chain policy (A14 — every container base image is
    # image:tag@sha256:<digest>). Re-resolve drift with infra/supply-chain/resolve-image-digests.sh; see
    # docs/SUPPLY-CHAIN.md. (nginx:1.27-alpine as of resolution.)
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: vigil-lb
    restart: unless-stopped
    volumes:
      - ./infra/ha/lb.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # host.docker.internal -> the host, so the container can reach the two NATIVE
    # `vigil up` replicas bound on the host's loopback. Required on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8760:8770"          # the VIP; put your TLS terminator in front of THIS (loopback-only)

  # ---------------------------------------------------------------------------
  # Qdrant — the vector store. HA requires DISTRIBUTED (multi-node + replication)
  # mode, which you must run and configure; SIGIL must also be pointed at it via
  # QDRANT_URL=http://127.0.0.1:6333 (env), replacing the embedded/local store
  # (config.py QDRANT_PATH). This single node is durable but NOT HA on its own.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    environment:
      # Enable clustering on this node. A REAL HA deployment adds a SECOND node that
      # bootstraps to this one and sets a per-collection replication_factor >= 2 — see
      # the commented qdrant-2 stub below. One node with clustering enabled is NOT HA.
      QDRANT__CLUSTER__ENABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"          # REST/readyz
      - "127.0.0.1:6334:6334"          # gRPC (peer + client)
    volumes:
      - qdrant-data:/qdrant/storage
  # qdrant-2 (documented, not shipped — a real 2-node HA cluster):
  #   qdrant-2:
  #     image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
  #     command: ["./qdrant", "--bootstrap", "http://qdrant:6335"]
  #     environment: { QDRANT__CLUSTER__ENABLED: "true" }
  #     ports: [ "127.0.0.1:6343:6333" ]
  #     volumes: [ "qdrant2-data:/qdrant/storage" ]
  # Then set each collection's replication_factor>=2 via the Qdrant API. This overlay
  # documents the upgrade; it does not pretend one node is a cluster.

  # ---------------------------------------------------------------------------
  # otel — two active-active collectors (stateless OTLP->stdout). Point the app at
  # either (or round-robin in the app's exporter). Distinct loopback host ports.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector:0.158.0@sha256:5b97e6e3550ec6e48a71dba6f6304d349a293af8df4ee1f51da67be94fce2ecd
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/sidecars/otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

  otel-collector-2:
    image: otel/opentelemetry-collector:0.158.0@sha256:5b97e6e3550ec6e48a71dba6f6304d349a293af8df4ee1f51da67be94fce2ecd
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/sidecars/otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4319:4318"          # second replica on a distinct loopback host port

  # ---------------------------------------------------------------------------
  # Sovereign writer — ONE ACTIVE (native) + this labeled PASSIVE standby.
  #
  # The ACTIVE sovereign writer is a NATIVE host process (the two-process boundary):
  #   SIGIL_UI_ALLOWED_HOSTS=vigil.example.com sigil serve --host 127.0.0.1 --port 8733
  # It is the SINGLE writer; the two `vigil up` replicas federate to it over loopback.
  #
  # This `sovereign-passive` service is the labeled standby under `--profile passive`.
  # It holds a synced MIRROR of ~/.sigil (mounted READ-ONLY here) and DOES NOT WRITE:
  # no `sigil serve`, no `sigil sign`, no checkpoint. Two live writers = a fork
  # (HA-PROFILE.md §2), so a standby never writes until it is DELIBERATELY promoted,
  # and promotion is GATED by the failover guard, never automatic:
  #
  #   sigil floor promote-passive --witnessed /retained/off-box/checkpoint.witnessed.json
  #   # (or: python3 tools/ha/spine_failover_guard.py --witnessed <...>)
  #
  # The guard REFUSES (exit 2) if this mirror is stale (its head is below the
  # off-box witnessed checkpoint), so a standby cannot roll the durable floor back.
  # A real deployment wires the ~/.sigil mirror sync (rsync/volume-snapshot/DRBD)
  # out-of-band; this sidecar only proves the standby is present and NON-writing.
  # ---------------------------------------------------------------------------
  sovereign-passive:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # benign base; this sidecar never runs the writer
    profiles: ["passive"]
    restart: unless-stopped
    labels:
      vigil.role: "sovereign-passive"
      vigil.writes: "false"           # INVARIANT: a passive standby does not write the spine
    volumes:
      - sigil-home-mirror:/mirror/.sigil:ro     # the synced mirror, READ-ONLY: it cannot advance the spine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo 'VIGIL sovereign PASSIVE standby: holding a read-only ~/.sigil mirror; NOT writing.';
        echo 'Promote ONLY via the gated failover guard:';
        echo '  sigil floor promote-passive --witnessed /retained/off-box/checkpoint.witnessed.json';
        echo '  (the guard refuses if this mirror is below the off-box witnessed checkpoint).';
        while true; do sleep 3600; done

volumes:
  qdrant-data:
  sigil-home-mirror:                  # the passive's read-only mirror of ~/.sigil (synced out-of-band)
