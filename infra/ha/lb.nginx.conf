# VIGIL HA — load balancer fronting the ACTIVE-ACTIVE `vigil up` proxy replicas.
# =============================================================================
# This nginx runs in the `vigil-lb` container (infra/ha/docker-compose.ha.yml) and
# is the ONLY thing that binds a shareable address — and even that is published on
# 127.0.0.1 / a VIP only (never 0.0.0.0), mirroring the root docker-compose.yml
# loopback discipline. Put your TLS terminator (Caddy/nginx per
# apps/sigil/deploy/reverse-proxy/*) IN FRONT of this VIP; this file only spreads
# load across the two stateless `vigil up` proxy replicas.
#
# The two `vigil up` proxy replicas are NATIVE host processes (per the root
# compose: the sovereign/offense runtimes run natively in their own venvs). Launch
# them on loopback, each on its own port, teaching them the public domain:
#
#     CRUCIBLE_API_KEY=... vigil up --domain vigil.example.com \
#         --host 127.0.0.1 --port 8770 --no-browser        # replica 1
#     CRUCIBLE_API_KEY=... vigil up --domain vigil.example.com \
#         --host 127.0.0.1 --port 8771 --no-browser        # replica 2
#
# The container reaches them via host.docker.internal (mapped to host-gateway in
# the compose). Both replicas federate to the SAME single-writer sovereign +
# offense backends over loopback — active-active is a READ/PROXY property; it does
# NOT make the spine writer multi-active (see docs/architecture/HA-PROFILE.md §2).

upstream vigil_proxies {
    # ip_hash = STICKY SESSIONS. `vigil up` holds a per-instance session token, so a
    # client must return to the replica that issued its token. Without stickiness (or a
    # shared token store) a request load-balanced to the other replica would 401. This
    # is the documented limit in HA-PROFILE.md §4 "the stateless proxy tier's session
    # token" — ip_hash is the simplest correct answer; swap for a shared token store if
    # you need true any-replica routing.
    ip_hash;
    server host.docker.internal:8770 max_fails=3 fail_timeout=10s;   # vigil up replica 1
    server host.docker.internal:8771 max_fails=3 fail_timeout=10s;   # vigil up replica 2
}

server {
    listen 8770;                       # the container's internal port; compose publishes it to 127.0.0.1 only
    server_name _;

    # Server-Sent Events must not be re-buffered by the LB (the replicas already stream them).
    location ~ ^/(sovereign/api/stream|offense/api/events|offense/api/blackboard)$ {
        proxy_pass http://vigil_proxies;
        proxy_set_header Host $host;                 # forward the domain: the backends' anti-rebind allowlist needs it
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://vigil_proxies;
        proxy_set_header Host $host;                 # anti-rebind allowlist: forward the original domain, never 127.0.0.1
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;   # fail a dead replica over to the live one
    }
}
