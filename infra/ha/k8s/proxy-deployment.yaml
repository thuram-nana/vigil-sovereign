# VIGIL HA — the STATELESS read/proxy tier (`vigil up --proxy-only`), horizontally scalable.
# =============================================================================
# This is the ONE tier that is genuinely active-active: N stateless replicas.
# It is NOT the spine writer (that is the single-replica StatefulSet). Scaling
# this Deployment scales reads/proxying only — see docs/architecture/HA-PROFILE.md.
#
# --proxy-only IS LOAD-BEARING, not cosmetic. A plain `vigil up` LAUNCHES the sovereign
# cockpit (8733) + both offense backends (8787/8799) as CHILDREN of the proxy. Run that in
# N replicas and each pod would spawn its OWN sovereign cockpit — i.e. a SECOND (Nth)
# signed-spine writer, which is exactly the "same height, different head" FORK the floor +
# witnesses exist to reject (HA-PROFILE.md §2). --proxy-only spawns NOTHING and federates
# `/sovereign/*` to the ONE central StatefulSet writer instead. It is the only correct way
# to replicate this tier.
#
# Bind the POD IP, never 0.0.0.0: `vigil up` routes --host through `bind_ok`, which REFUSES
# 0.0.0.0 / a public address (the process exits 2) and ACCEPTS RFC1918 — and a pod IP is
# RFC1918. --domain is the advertised authority (TLS terminated at your Ingress), not a bind.
#
# Sticky sessions: the offense-hop credential is per-deployment (a Secret), but a per-user
# session still rides the proxy, so the Service / Ingress in front of this Deployment SHOULD
# use session affinity (services.yaml sets sessionAffinity: ClientIP) or a shared token store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-proxy
  labels: { app: vigil-proxy, tier: read-proxy }
spec:
  replicas: 3                          # active-active; safe to scale — stateless read/proxy tier
  selector:
    matchLabels: { app: vigil-proxy }
  template:
    metadata:
      labels: { app: vigil-proxy, tier: read-proxy }
    spec:
      containers:
        - name: vigil-up
          image: vigil/runtime:local   # operator-built (sovereign venv + repo); digest-pin before prod
          # PROXY-ONLY: spawn nothing; federate /sovereign/* to the central writer Service, and (see the
          # offense note below) /offense/* to a co-located offense plane. --host $(POD_IP) binds the pod's
          # RFC1918 IP (bind_ok-allowed); --domain sets the advertised authority for the Ingress/TLS edge.
          command: ["vigil", "up", "--proxy-only",
                    "--host", "$(POD_IP)", "--port", "8770", "--no-browser",
                    "--domain", "vigil.example.com",
                    "--sovereign-addr", "vigil-sovereign:8733",
                    # OFFENSE PLANE — NOT clustered by this profile. The offense console/api bind LOOPBACK
                    # ONLY by design (serve() refuses any non-loopback host) AND stay NATIVE (they drive the
                    # host Docker daemon; the two-process boundary keeps them out of the sovereign image).
                    # So they are unreachable cross-pod: /offense/* works only against a co-located offense
                    # plane the operator adds as a loopback sidecar. Left at the loopback default → /offense/*
                    # returns 502 until such a sidecar exists; /sovereign/* is fully functional regardless.
                    "--offense-console-addr", "127.0.0.1:8787",
                    "--offense-api-addr", "127.0.0.1:8799"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            # Required because --domain makes run_up FAIL CLOSED unless CRUCIBLE_API_KEY is set (the gated
            # offense api must never be internet-fronted unauthenticated). Also the key the co-located
            # offense api would use, wherever the operator runs it.
            - name: CRUCIBLE_API_KEY
              valueFrom: { secretKeyRef: { name: vigil-secrets, key: crucible-api-key } }
            # W8-6 (#472) — ENCRYPT THE PROXY->COCKPIT HOP. The `--sovereign-addr vigil-sovereign:8733`
            # hop above crosses the pod network; the NetworkPolicy bounds WHO connects, not confidentiality.
            # The proxy is a TLS client for the hop: verify the cockpit's cert (VIGIL_HOP_CA — PINS to that
            # operator CA alone; the system trust store is NOT loaded, so no public CA can vouch for the
            # backend), and present a client cert for mutual TLS (the VIGIL_HOP_CLIENT_CERT/KEY pair). Under
            # VIGIL_POSTURE=production the proxy REFUSES TO START with a plaintext hop to this remote cockpit.
            #
            # POSTURE IS ARMED BY DEFAULT (below, ACTIVE — not commented): this profile federates the
            # credential-bearing hop to a REMOTE cockpit, so it is fail-closed out of the box. Applying this
            # manifest AS SHIPPED — before the hop-TLS material exists — makes the proxy REFUSE TO START (the
            # pod crashloops on the resolve_hop_tls ValueError) rather than run the per-user bearer + the
            # substituted owner console credential over the pod network in CLEARTEXT. That refusal is
            # intentional: it forces the operator to provide the hop-TLS material below, never a silent leak.
            #
            # RESIDUAL, operator-provided: (a) the CA/cert/key MATERIAL (the `vigil-hop-tls` Secret mounted
            # below), and (b) a TLS-TERMINATING cockpit — `sigil serve` binds plaintext, so front the
            # sovereign StatefulSet with a TLS sidecar (or a service-mesh mTLS) that presents a cert whose
            # SAN is `vigil-sovereign`. Uncomment the four hop-TLS env vars + the volumeMounts + the volume +
            # Secret below to enable the encrypted hop and CLEAR the refusal.
            - { name: VIGIL_POSTURE,          value: "production" }
            # - { name: VIGIL_HOP_TLS,          value: "require" }
            # - { name: VIGIL_HOP_CA,           value: "/etc/vigil/hop-tls/ca.pem" }
            # - { name: VIGIL_HOP_CLIENT_CERT,  value: "/etc/vigil/hop-tls/client-cert.pem" }
            # - { name: VIGIL_HOP_CLIENT_KEY,   value: "/etc/vigil/hop-tls/client-key.pem" }
          # volumeMounts:                       # uncomment together with the env + volume + Secret above
          #   - { name: hop-tls, mountPath: /etc/vigil/hop-tls, readOnly: true }
          ports:
            - { name: http, containerPort: 8770 }
          # W6-2 (#453): readiness = /readyz, which LIVE-probes this replica's real dependency — the
          # sovereign backend it federates every authenticated request to — and returns 503 when that
          # writer is down, so the Service stops routing to a replica whose backend is dead. This replaces
          # the shallow `GET /` on the STATIC bundle, which returned 200 as long as the web tier could read
          # a file off disk (a proxy whose backend is dead stayed Ready — the cited defect). liveness =
          # /healthz (the process answers, no dependency I/O), replacing the bare tcpSocket. Both are the
          # UNAUTHENTICATED, Host-ungated W6-1 routes, answered before auth/routing.
          readinessProbe:                # do not route to a replica until its sovereign backend is reachable
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      # W8-6 (#472): the hop-TLS cert material as a read-only projected Secret. Uncomment together with the
      # env + volumeMounts above and create the Secret, e.g.:
      #   kubectl create secret generic vigil-hop-tls \
      #     --from-file=ca.pem --from-file=client-cert.pem --from-file=client-key.pem
      # volumes:
      #   - name: hop-tls
      #     secret: { secretName: vigil-hop-tls, defaultMode: 0400 }
---
# Optional: an HPA can scale the stateless proxy tier on CPU. (The StatefulSet writer
# is deliberately NOT autoscaled — it is single-writer by design.)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigil-proxy
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vigil-proxy }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
