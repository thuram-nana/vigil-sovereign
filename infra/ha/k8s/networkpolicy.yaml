# VIGIL HA — NetworkPolicy: the sovereign cockpit is reachable ONLY via the authenticating proxy.
# =============================================================================
# WHY THIS IS REQUIRED, NOT OPTIONAL. The sovereign cockpit (`sigil serve`) serves its OWN
# owner-token-embedding index at `GET /` TOKEN-FREE (`<body data-token="<owner token>">` — it is a
# single-operator, on-host surface by design), and the headless `vigil-sovereign` Service has no auth of
# its own. The reverse proxy is the authenticating boundary: it establishes per-user identity (delegated
# whoami) AND scrubs the backend's embedded owner token out of any relayed HTML before it can reach a
# browser. So ANY in-cluster workload that reaches `vigil-sovereign:8733` DIRECTLY — bypassing the proxy —
# can scrape the owner token off `GET /` and act as OWNER. This policy makes the proxy tier the ONLY thing
# that can connect to the cockpit, closing that network vector. See docs/architecture/HA-PROFILE.md §1.1.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigil-sovereign-proxy-only
  labels: { app: vigil-sovereign, tier: spine-writer }
spec:
  podSelector:
    matchLabels: { app: vigil-sovereign }   # this policy governs ingress to the writer pod(s)
  policyTypes: [ Ingress ]
  ingress:
    # ONLY the stateless proxy tier may reach the cockpit port. Everything else in the cluster is denied
    # (selecting Ingress with a single from-rule is default-deny for every other source).
    - from:
        - podSelector:
            matchLabels: { app: vigil-proxy }
      ports:
        - { protocol: TCP, port: 8733 }
    # NOTE — kubelet health probes: the readiness AND liveness probes (both httpGet :8733 → /readyz and
    # /healthz after W6-2) originate from the NODE, not a pod. Most CNIs exempt kubelet health-check traffic
    # from NetworkPolicy; a CNI that does NOT will fail the probes under this default-deny (and a failed
    # LIVENESS probe would then RESTART the writer in a loop). If your CNI enforces policy on probe traffic,
    # ALSO allow the node
    # source (an `ipBlock` for your node CIDR, cluster-specific) or switch to an exec/tcpSocket probe.
    # This is left out here because the node CIDR is deployment-specific — do not paste a wrong one.
---
# The proxy tier + the Ingress boundary: the proxy is INTENDED to be fronted by your Ingress/TLS edge and
# is the only human-facing listener, so its ingress is deliberately NOT locked to in-cluster sources here.
# What matters for the owner-token leak is that the SOVEREIGN cockpit above is proxy-only — enforced.
#
# CONFIDENTIALITY OF THE HOP (W8-6 #472): this NetworkPolicy bounds WHO may connect (the proxy only); it
# does NOT itself encrypt the hop. Encryption is a SEPARATE control, and the proxy now ships it:
#   * The proxy is a TLS client for the hop — set VIGIL_HOP_TLS=require (+ VIGIL_HOP_CA, and the
#     VIGIL_HOP_CLIENT_CERT/KEY pair for mutual TLS) on the vigil-proxy Deployment (proxy-deployment.yaml).
#   * Under VIGIL_POSTURE=production the proxy REFUSES TO START with a plaintext hop to a REMOTE cockpit
#     (fail-closed) — so a production deploy cannot silently run this hop in cleartext.
# RESIDUAL (operator-provided): the CA / cert / key MATERIAL and a TLS-TERMINATING cockpit. `sigil serve`
# binds plaintext by design (the single-owner on-host surface above), so in-cluster the cockpit must be
# fronted by a TLS-terminating sidecar (or an equivalent service-mesh mTLS — Istio/Linkerd — or an
# encrypted CNI: WireGuard/IPsec). Until that material is provisioned, do not assume the pod network is
# confidential. See HA-PROFILE.md §1.2 + §4 and docs/decisions/W8-6-encrypt-proxy-cockpit-hop.md.
