# VIGIL HA — otel-collector, stateless, active-active.
# =============================================================================
# Stateless OTLP -> stdout receiver; safe to run N replicas behind a Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
data:
  # Mirror of infra/sidecars/otel-config.yaml (loopback debug exporter; secret-free).
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:  { receivers: [otlp], exporters: [debug] }
        logs:    { receivers: [otlp], exporters: [debug] }
        metrics: { receivers: [otlp], exporters: [debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: { app: otel-collector, tier: observability }
spec:
  replicas: 2                          # active-active; stateless
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector, tier: observability }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.158.0@sha256:5b97e6e3550ec6e48a71dba6f6304d349a293af8df4ee1f51da67be94fce2ecd
          args: ["--config", "/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: otel-config, mountPath: /etc/otelcol }
          # W6-2 (#453): both probes. The collector is a dependency-free stateless OTLP->stdout receiver,
          # so its only real health surface is its own listening socket: liveness AND readiness both TCP-
          # connect the OTLP receiver port (process alive / accepting), liveness kept more lenient. No
          # workload ships without both.
          readinessProbe:
            tcpSocket: { port: otlp-http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: otlp-http }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: otel-config
          configMap:
            name: otel-config
            items: [ { key: config.yaml, path: config.yaml } ]
