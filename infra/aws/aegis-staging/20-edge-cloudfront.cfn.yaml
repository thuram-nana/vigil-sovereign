AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AEGIS AS-26 (OPS-1) staging edge (spec §5 request path): a Route 53 TEST hosted zone, a central KEYLESS
  origin-hop cert issuer (ACM Private CA), and — per tenant (D3 distribution-tenant-per-host, 2 tenants) —
  a CloudFront distribution with Shield, caching disabled, an origin-request policy forwarding Host +
  CloudFront-Viewer-Address, and a per-(org,host) edge secret injected as an origin header, in front of a
  VPC origin to an INTERNAL application load balancer. The ALB admits only in-VPC origin traffic; a request
  that bypasses CloudFront never carries the edge secret and is refused at the front (offline-tested by the
  Z3R/edge guard). STAGING-ONLY, merged-not-applied. Long-form intrinsics only.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The staging VPC id (output VpcId of 00-network-zones).
  AlbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two Z2E subnets for the internal ALB (output Z2ESubnets of 00-network-zones).
  TestZoneName:
    Type: String
    Default: aegis-staging.vigil.test
    Description: The Route 53 TEST hosted-zone name (a non-production test domain).
  Tenant1Host:
    Type: String
    Default: tenant-a.aegis-staging.vigil.test
    Description: Tenant A host (distribution tenant per host).
  Tenant2Host:
    Type: String
    Default: tenant-b.aegis-staging.vigil.test
    Description: Tenant B host (distribution tenant per host).

Resources:
  # --------------------------------------------------------------------------------------------------
  # Route 53 TEST hosted zone (spec row: "Route 53 test zone"). A private-looking test domain, never a
  # production name. The two tenant records point at the two CloudFront distributions.
  # --------------------------------------------------------------------------------------------------
  TestHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name:
        Ref: TestZoneName
      HostedZoneConfig:
        Comment: AEGIS staging test zone (OPS-1); not a production domain.
      HostedZoneTags:
        - Key: vigil:environment
          Value: staging

  # --------------------------------------------------------------------------------------------------
  # Keyless origin-hop cert issuer — ACM Private CA. The front gets its origin-hop certificate from this
  # central issuer (spec §5). Viewer TLS is terminated by CloudFront with AWS-custody keys (not here).
  # --------------------------------------------------------------------------------------------------
  OriginHopCA:
    Type: AWS::ACMPCA::CertificateAuthority
    Properties:
      Type: ROOT
      KeyAlgorithm: EC_prime256v1
      SigningAlgorithm: SHA256WITHECDSA
      Subject:
        Organization: VIGIL AEGIS staging
        CommonName: aegis-staging-origin-hop-issuer
      UsageMode: SHORT_LIVED_CERTIFICATE
      Tags:
        - Key: vigil:issuer
          Value: origin-hop-keyless

  # --------------------------------------------------------------------------------------------------
  # Per-(org,host) edge secrets. CloudFront injects each as an origin header; the front verifies it, so a
  # direct-to-origin request (no edge secret) is refused (T-PXY / CloudFront-bypass).
  # --------------------------------------------------------------------------------------------------
  Tenant1EdgeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: aegis-staging/edge/tenant-a
      Description: Per-(org,host) edge secret for tenant A (CloudFront -> front verification).
      GenerateSecretString:
        SecretStringTemplate: '{"header":"X-Vigil-Edge-Secret"}'
        GenerateStringKey: edge_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: vigil:tenant
          Value: tenant-a

  Tenant2EdgeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: aegis-staging/edge/tenant-b
      Description: Per-(org,host) edge secret for tenant B (CloudFront -> front verification).
      GenerateSecretString:
        SecretStringTemplate: '{"header":"X-Vigil-Edge-Secret"}'
        GenerateStringKey: edge_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: vigil:tenant
          Value: tenant-b

  # --------------------------------------------------------------------------------------------------
  # Internal ALB. SG admits only in-VPC origin traffic (the CloudFront VPC origin lives in the VPC); no
  # 0.0.0.0/0 ingress. Host rule -> target group per instance_id (compiled from grants x placement).
  # --------------------------------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB for the AEGIS staging VPC origin; admits only in-VPC origin traffic.
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "10.80.0.0/16"
          Description: in-VPC CloudFront VPC-origin traffic only
      Tags:
        - Key: Name
          Value: aegis-staging-alb-sg

  InternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: aegis-staging-origin
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      Subnets:
        Ref: AlbSubnetIds
      SecurityGroups:
        - Ref: AlbSecurityGroup
      Tags:
        - Key: vigil:environment
          Value: staging

  Tenant1TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aegis-staging-tenant-a
      VpcId:
        Ref: VpcId
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /healthz
      Tags:
        - Key: vigil:tenant
          Value: tenant-a

  Tenant2TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aegis-staging-tenant-b
      VpcId:
        Ref: VpcId
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /healthz
      Tags:
        - Key: vigil:tenant
          Value: tenant-b

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn:
        Ref: InternalAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "421"
            ContentType: text/plain
            MessageBody: misdirected request (foreign Host)

  Tenant1ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: AlbListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - Ref: Tenant1Host
      Actions:
        - Type: forward
          TargetGroupArn:
            Ref: Tenant1TargetGroup

  Tenant2ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Ref: AlbListener
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - Ref: Tenant2Host
      Actions:
        - Type: forward
          TargetGroupArn:
            Ref: Tenant2TargetGroup

  # --------------------------------------------------------------------------------------------------
  # CloudFront VPC origin to the internal ALB, an origin-request policy forwarding Host +
  # CloudFront-Viewer-Address, and caching disabled via the AWS managed CachingDisabled policy.
  # --------------------------------------------------------------------------------------------------
  AlbVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: aegis-staging-alb-origin
        Arn:
          Ref: InternalAlb
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        OriginSSLProtocols:
          - TLSv1.2
      Tags:
        - Key: vigil:environment
          Value: staging

  EdgeOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: aegis-staging-host-and-viewer-address
        Comment: Forward Host + CloudFront-Viewer-Address to the VPC origin (spec §5).
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Host
            - CloudFront-Viewer-Address
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all

  Tenant1Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AEGIS staging tenant A (distribution tenant per host).
        Aliases:
          - Ref: Tenant1Host
        Origins:
          - Id: alb-vpc-origin
            DomainName:
              Fn::GetAtt:
                - InternalAlb
                - DNSName
            VpcOriginConfig:
              VpcOriginId:
                Ref: AlbVpcOrigin
            OriginCustomHeaders:
              - HeaderName: X-Vigil-Edge-Secret
                HeaderValue:
                  Fn::Sub: "{{resolve:secretsmanager:${Tenant1EdgeSecret}:SecretString:edge_secret}}"
        DefaultCacheBehavior:
          TargetOriginId: alb-vpc-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId:
            Ref: EdgeOriginRequestPolicy
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: vigil:tenant
          Value: tenant-a

  Tenant2Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AEGIS staging tenant B (distribution tenant per host).
        Aliases:
          - Ref: Tenant2Host
        Origins:
          - Id: alb-vpc-origin
            DomainName:
              Fn::GetAtt:
                - InternalAlb
                - DNSName
            VpcOriginConfig:
              VpcOriginId:
                Ref: AlbVpcOrigin
            OriginCustomHeaders:
              - HeaderName: X-Vigil-Edge-Secret
                HeaderValue:
                  Fn::Sub: "{{resolve:secretsmanager:${Tenant2EdgeSecret}:SecretString:edge_secret}}"
        DefaultCacheBehavior:
          TargetOriginId: alb-vpc-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId:
            Ref: EdgeOriginRequestPolicy
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: vigil:tenant
          Value: tenant-b

  # --------------------------------------------------------------------------------------------------
  # Shield protections on each distribution (spec row: "static staging CloudFront + Shield").
  # --------------------------------------------------------------------------------------------------
  Tenant1Shield:
    Type: AWS::Shield::Protection
    Properties:
      Name: aegis-staging-tenant-a
      ResourceArn:
        Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Tenant1Distribution}"

  Tenant2Shield:
    Type: AWS::Shield::Protection
    Properties:
      Name: aegis-staging-tenant-b
      ResourceArn:
        Fn::Sub: "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Tenant2Distribution}"

  # --------------------------------------------------------------------------------------------------
  # Route 53 records for each tenant host -> its distribution.
  # --------------------------------------------------------------------------------------------------
  Tenant1Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: TestHostedZone
      Name:
        Ref: Tenant1Host
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - Tenant1Distribution
            - DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  Tenant2Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: TestHostedZone
      Name:
        Ref: Tenant2Host
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - Tenant2Distribution
            - DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  Tenant1DistributionId:
    Description: Tenant A CloudFront distribution id.
    Value:
      Ref: Tenant1Distribution
  Tenant2DistributionId:
    Description: Tenant B CloudFront distribution id.
    Value:
      Ref: Tenant2Distribution
  OriginHopCAArn:
    Description: Keyless origin-hop cert issuer (ACM Private CA) ARN.
    Value:
      Ref: OriginHopCA
  TestHostedZoneId:
    Description: The Route 53 test hosted-zone id.
    Value:
      Ref: TestHostedZone
